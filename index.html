ic":"蛋白质二级结构","type":"choice","question":"L-氨基酸组成的α-螺旋最稳定的形式是？","options":{"A":"左手螺旋","B":"右手螺旋","C":"混合螺旋","D":"无规螺旋"},"answer":"B","explanation":"L-氨基酸组成的α-螺旋最稳定形式为右手螺旋。左手螺旋较少（第一个碳和氢接触较近，不易稳定），但特殊情况下可形成。","difficulty":2,"tags":["右手螺旋","L-氨基酸"]},{"id":22,"topic":"蛋白质二级结构","type":"choice","question":"α-螺旋中氢键的取向？","options":{"A":"垂直于螺旋轴","B":"几乎平行于螺旋轴","C":"与螺旋轴呈45°角","D":"与螺旋轴呈60°角"},"answer":"B","explanation":"α-螺旋中相邻螺圈间形成的氢键几乎平行于螺旋轴。","difficulty":1,"tags":["α-螺旋","氢键"]},{"id":23,"topic":"蛋白质二级结构","type":"choice","question":"β-折叠中相邻肽链反向时的结构称为？","options":{"A":"平行β-折叠","B":"反平行β-折叠","C":"混合型β-折叠","D":"弯曲β-折叠"},"answer":"B","explanation":"反平行β-折叠中相邻肽链方向相反。反平行比平行更稳定，但平行更规则易形成大结构。","difficulty":2,"tags":["β-折叠","反平行"]},{"id":24,"topic":"蛋白质二级结构","type":"choice","question":"β-转角由几个连续的氨基酸残基组成？","options":{"A":"2个","B":"4个","C":"6个","D":"8个"},"answer":"B","explanation":"β-转角由4个连续氨基酸残基组成，主链以180°回折改变方向，n位C=O与n+3位N-H形成氢键。","difficulty":2,"tags":["β-转角"]},{"id":25,"topic":"蛋白质二级结构","type":"choice","question":"以下哪种氨基酸经常出现在β-转角中？","options":{"A":"Met和Leu","B":"Glu和Asp","C":"Gly和Pro","D":"Lys和Arg"},"answer":"C","explanation":"Gly（侧链小柔性大）和Pro（亚胺氮的肽键易采取顺式构型）常出现在β-转角中。但并非有转角一定有这两种氨基酸。","difficulty":2,"tags":["Gly","Pro","β-转角"]},{"id":26,"topic":"蛋白质二级结构","type":"choice","question":"α-螺旋的氢键是由第n个肽基的C=O与哪个位置的N-H形成？","options":{"A":"n+1","B":"n+2","C":"n+3或n+4","D":"n+5"},"answer":"C","explanation":"α-螺旋中氢键由第n个肽基的C=O与第n+3（或n+4）位氨基酸残基的N-H形成，封闭形成13元环。","difficulty":3,"tags":["α-螺旋","氢键","13元环"]},{"id":27,"topic":"蛋白质二级结构","type":"choice","question":"在α-螺旋中出现频率最高的氨基酸是？","options":{"A":"Tyr、Pro、Gly","B":"Glu、Met、Ala","C":"Pro、Gly、Asn","D":"Val、Ile、Phe"},"answer":"B","explanation":"α-螺旋中Glu、Met、Ala出现频率最高，Tyr、Pro、Gly频率最低。注意只是频率高低，不能说哪种氨基酸绝对不会出现。","difficulty":3,"tags":["α-螺旋","氨基酸频率"]},{"id":28,"topic":"蛋白质二级结构","type":"choice","question":"影响α-螺旋形成与稳定性的因素不包括？","options":{"A":"Pro和Gly的存在","B":"间隔3-4个残基的R基相互作用","C":"螺旋末端残基的相互作用","D":"溶液中NaCl的浓度"},"answer":"D","explanation":"影响α-螺旋稳定的因素包括：α螺旋固有倾向、R基相互作用、相邻R基体积、Pro/Gly存在、末端残基和电偶极作用。NaCl浓度不是主要因素。","difficulty":2,"tags":["α-螺旋","稳定性"]},{"id":29,"topic":"蛋白质二级结构","type":"truefalse","question":"α-螺旋的二级结构稳定性主要靠侧链间的氢键维持。","answer":false,"explanation":"α-螺旋的稳定性主要靠主链上的氢键维持，而非侧链间氢键。氢键由第n个肽基C=O与n+3位N-H形成。","difficulty":1,"tags":["α-螺旋","氢键"]},{"id":30,"topic":"蛋白质二级结构","type":"truefalse","question":"在β-折叠中绝对不会出现Gly。","answer":false,"explanation":"Gly小侧链有助于β-折叠伸展，在β-折叠中是可以出现的。不能说某种氨基酸绝对不会出现在某类二级结构中，只能说频率高低不同。","difficulty":2,"tags":["Gly","β-折叠"]},{"id":31,"topic":"蛋白质二级结构","type":"truefalse","question":"β-转角常出现在蛋白质内部而非表面。","answer":false,"explanation":"β-转角经常出现在蛋白质表面，转角中央的两个氨基酸残基能够和水形成氢键。此外，常出现在球状蛋白质中，占全部残基的1/4。","difficulty":2,"tags":["β-转角","蛋白质表面"]},{"id":32,"topic":"纤维状蛋白","type":"choice","question":"α-角蛋白的主要二级结构类型是？","options":{"A":"β-折叠","B":"α-螺旋","C":"无规卷曲","D":"三股螺旋"},"answer":"B","explanation":"α-角蛋白是α-螺旋蛋白质，富含Ala、Val、Leu、Ile、Met和Phe。两条右手螺旋相互缠绕形成左手卷曲螺旋。","difficulty":1,"tags":["α-角蛋白","α-螺旋"]},{"id":33,"topic":"纤维状蛋白","type":"choice","question":"丝心蛋白（蚕丝）的主要二级结构类型是？","options":{"A":"α-螺旋","B":"反平行β-折叠","C":"平行β-折叠","D":"三股螺旋"},"answer":"B","explanation":"丝心蛋白二级结构是反平行β-折叠片，主要含Gly、Ser、Ala等小侧链氨基酸。","difficulty":1,"tags":["丝心蛋白","β-折叠"]},{"id":34,"topic":"纤维状蛋白","type":"choice","question":"α-角蛋白在湿热条件下可转变为？","options":{"A":"α-螺旋","B":"β-构象","C":"无规卷曲","D":"三股螺旋"},"answer":"B","explanation":"α-角蛋白在湿热条件下可伸展转变为β-构象，在寒冷干燥时又可自发恢复。此即烫发原理的生化基础。","difficulty":2,"tags":["α-角蛋白","β-构象"]},{"id":35,"topic":"纤维状蛋白","type":"choice","question":"胶原蛋白中大量存在的特征性重复序列是？","options":{"A":"Gly-X-Y","B":"Ala-Gly-Ser","C":"Val-Leu-Ile","D":"Pro-Lys-Arg"},"answer":"A","explanation":"胶原多肽链富含Gly-X-Y重复序列，其中X常为Pro，Y常为Hyp（羟脯氨酸）。","difficulty":2,"tags":["胶原蛋白","Gly-X-Y"]},{"id":36,"topic":"纤维状蛋白","type":"choice","question":"胶原蛋白合成中，脯氨酸羟化过程需要的辅因子是？","options":{"A":"维生素A","B":"维生素C","C":"维生素D","D":"维生素E"},"answer":"B","explanation":"脯氨酸羟化酶和赖氨酸羟化酶催化的羟化过程需要维生素C作为辅因子。缺少维生素C会导致胶原蛋白合成障碍（坏血病）。","difficulty":2,"tags":["胶原蛋白","维生素C","羟化"]},{"id":37,"topic":"纤维状蛋白","type":"choice","question":"丝心蛋白多肽链中每隔一个残基就出现的氨基酸是？","options":{"A":"Pro","B":"Lys","C":"Gly","D":"Trp"},"answer":"C","explanation":"丝心蛋白中每隔一个残基就是Gly（Gly-Ala-Gly-Ala-Gly-Ser），Gly侧链在片层一侧赋予柔软性。","difficulty":2,"tags":["丝心蛋白","Gly"]},{"id":38,"topic":"纤维状蛋白","type":"truefalse","question":"α-角蛋白的纤维强度与其中二硫键的含量成反比关系。","answer":false,"explanation":"α-角蛋白纤维强度和二硫键含量成正比关系。二硫键帮助稳定α-角蛋白的四级结构，二硫键越多越牢固。","difficulty":2,"tags":["α-角蛋白","二硫键"]},{"id":39,"topic":"纤维状蛋白","type":"truefalse","question":"胶原蛋白是一种糖蛋白，不含羟脯氨酸和羟赖氨酸。","answer":false,"explanation":"胶原蛋白含有3种不常见氨基酸：4-羟脯氨酸、3-羟脯氨酸和5-羟赖氨酸。且胶原蛋白是糖蛋白。","difficulty":1,"tags":["胶原蛋白","羟脯氨酸"]},{"id":40,"topic":"超二级结构与结构域","type":"choice","question":"超二级结构的基本组合形式不包括？","options":{"A":"αα","B":"βαβ","C":"β发夹","D":"αβα"},"answer":"D","explanation":"超二级结构基本组合有αα、βαβ、ββ（含β发夹、β曲折、希腊钥匙）。αβα不是标准命名。","difficulty":2,"tags":["超二级结构","组合形式"]},{"id":41,"topic":"超二级结构与结构域","type":"choice","question":"结构域一般由多少个氨基酸残基组成？","options":{"A":"20-50","B":"100-200","C":"500-800","D":"1000-2000"},"answer":"B","explanation":"结构域一般由100-200个氨基酸残基组成，是空间相对独立的紧密球状实体，具有特异结构和独立功能。","difficulty":1,"tags":["结构域","氨基酸数"]},{"id":42,"topic":"超二级结构与结构域","type":"choice","question":"结构域的功能不包括？","options":{"A":"蛋白折叠单位","B":"结构单位","C":"催化肽键水解","D":"功能单位"},"answer":"C","explanation":"结构域是蛋白的折叠单位、结构单位和功能单位。催化肽键水解是蛋白水解酶的功能，不是结构域的通用功能。","difficulty":2,"tags":["结构域","功能"]},{"id":43,"topic":"超二级结构与结构域","type":"choice","question":"Ω环一般长度是多少个氨基酸残基？","options":{"A":"2-4个","B":"6-8个","C":"15-20个","D":"25-30个"},"answer":"B","explanation":"Ω环长度一般为6-8个氨基酸残基，最多不超过16个。多出现在球状蛋白中。","difficulty":3,"tags":["Ω环"]},{"id":44,"topic":"超二级结构与结构域","type":"truefalse","question":"超二级结构是由两个或更多相邻的二级结构单元组合而成的。","answer":true,"explanation":"超二级结构由相邻二级结构单元（主要是α-螺旋和β-折叠）和连接部件组合形成，是有规则的二级结构组合。","difficulty":1,"tags":["超二级结构"]},{"id":45,"topic":"超二级结构与结构域","type":"truefalse","question":"结构域的结构与功能总是相互依赖的，不能独立存在。","answer":false,"explanation":"结构域的结构和功能往往是独立的。结构域间的裂缝常是酶的活性部位和反应物的出入口。","difficulty":1,"tags":["结构域","功能独立"]},{"id":46,"topic":"球状蛋白与三级结构","type":"choice","question":"蛋白质三级结构的定义是什么？","options":{"A":"多肽链中所有原子的空间排布","B":"多肽链中氨基酸的排列顺序","C":"亚基的组合方式","D":"主链原子的局部空间排布"},"answer":"A","explanation":"三级结构指多肽链在二级结构基础上进一步盘曲折叠形成的包括主、侧链所有原子在内的整体空间排布。","difficulty":1,"tags":["三级结构","空间排布"]},{"id":47,"topic":"球状蛋白与三级结构","type":"choice","question":"球状蛋白质分子中，疏水侧链主要分布在哪里？","options":{"A":"分子表面","B":"分子内部","C":"均匀分布","D":"分子表面和内部各一半"},"answer":"B","explanation":"球状蛋白质疏水侧链埋藏在分子内部，亲水侧链暴露在分子表面。疏水中心主要由α-螺旋和β-折叠组成。","difficulty":1,"tags":["球状蛋白","疏水侧链"]},{"id":48,"topic":"球状蛋白与三级结构","type":"choice","question":"球状蛋白质分子的表面常有什么结构？","options":{"A":"一个空穴（活性部位）","B":"多个二硫键","C":"大量疏水基团","D":"糖链"},"answer":"A","explanation":"球状蛋白质分子表面有一个空穴，常是酶的活性部位。","difficulty":2,"tags":["球状蛋白","活性部位"]},{"id":49,"topic":"球状蛋白与三级结构","type":"choice","question":"稳定蛋白质三级结构的最强非共价力是？","options":{"A":"氢键","B":"离子键","C":"疏水相互作用","D":"范德华力"},"answer":"C","explanation":"稳定三级结构的作用力中疏水相互作用最强，其次是氢键、离子键和范德华力。此外还有共价二硫键。","difficulty":1,"tags":["三级结构","疏水相互作用"]},{"id":50,"topic":"球状蛋白与三级结构","type":"truefalse","question":"蛋白质三级结构的稳定只依赖于共价二硫键。","answer":false,"explanation":"三级结构的稳定主要靠非共价弱相互作用（疏水相互作用、氢键、离子键、范德华力），二硫键起辅助稳定作用。","difficulty":1,"tags":["三级结构","非共价力"]},{"id":51,"topic":"膜蛋白","type":"choice","question":"占膜蛋白70%-80%的类型是？","options":{"A":"膜周边蛋白质","B":"内在膜蛋白质","C":"脂锚定蛋白质","D":"糖蛋白"},"answer":"B","explanation":"内在膜蛋白质占膜蛋白的70%-80%，部分或全部嵌在脂双层中。膜周边蛋白质占20%-30%。","difficulty":1,"tags":["膜蛋白","内在膜蛋白"]},{"id":52,"topic":"膜蛋白","type":"choice","question":"膜周边蛋白质主要通过什么作用力与膜结合？","options":{"A":"疏水相互作用","B":"静电相互作用和氢键","C":"共价键","D":"范德华力"},"answer":"B","explanation":"膜周边蛋白质主要通过静电相互作用和氢键与膜内在蛋白亲水结构域或膜脂极性头基结合。用温和方法即可分离。","difficulty":2,"tags":["膜周边蛋白质"]},{"id":53,"topic":"膜蛋白","type":"choice","question":"脂锚定蛋白通过什么方式固定到质膜上？","options":{"A":"跨膜肽段","B":"静电相互作用","C":"共价相连的脂质","D":"氢键"},"answer":"C","explanation":"脂锚定蛋白通过共价相连的脂质固定到质膜上，虽然不含跨膜肽段但能与膜牢固结合。","difficulty":1,"tags":["脂锚定蛋白"]},{"id":54,"topic":"膜蛋白","type":"choice","question":"内在膜蛋白质主要依靠何种力与膜牢固结合？","options":{"A":"离子键","B":"与脂双层的疏水相互作用","C":"二硫键","D":"肽键"},"answer":"B","explanation":"内在膜蛋白质主要靠与脂双层的疏水相互作用与膜牢固结合，需去污剂或变性剂才能分离提取。","difficulty":2,"tags":["内在膜蛋白","疏水相互作用"]},{"id":55,"topic":"膜蛋白","type":"truefalse","question":"脂锚定蛋白含有跨膜肽段。","answer":false,"explanation":"脂锚定蛋白不含跨膜肽段，通过共价结合的脂质与膜牢固结合，有时可出现在膜和细胞溶胶之间，也称兼在膜蛋白。","difficulty":2,"tags":["脂锚定蛋白"]},{"id":56,"topic":"蛋白质四级结构","type":"choice","question":"蛋白质四级结构中亚基之间结合的主要驱动力是？","options":{"A":"共价键","B":"疏水相互作用","C":"肽键","D":"糖苷键"},"answer":"B","explanation":"亚基缩合的主要驱动力是疏水相互作用。亚基间接触界面存在极性和疏水相互作用。氢键和离子键提供特异性。","difficulty":1,"tags":["四级结构","疏水相互作用"]},{"id":57,"topic":"蛋白质四级结构","type":"choice","question":"以下关于寡聚蛋白质亚基数目的说法正确的是？","options":{"A":"亚基数目多为奇数","B":"亚基数目多为偶数","C":"亚基数目一定是2","D":"亚基数目一定是4"},"answer":"B","explanation":"大多数寡聚蛋白质的亚基数目为偶数。对称性是蛋白质四级结构最重要的性质之一。","difficulty":2,"tags":["寡聚蛋白","亚基数"]},{"id":58,"topic":"蛋白质四级结构","type":"choice","question":"别构效应的定义是？","options":{"A":"亚基之间的共价结合","B":"配体结合影响其他部位的效应","C":"蛋白质完全展开的过程","D":"蛋白质合成的起始步骤"},"answer":"B","explanation":"别构效应指结合在蛋白质特定部位上的配体对该分子其他部位产生的影响。具有此效应的蛋白称为别构蛋白质。","difficulty":2,"tags":["别构效应"]},{"id":59,"topic":"蛋白质四级结构","type":"choice","question":"协同效应的定义是？","options":{"A":"一个效应物分子对另一个效应物分子结合的影响","B":"蛋白质分子量的增加","C":"亚基的解离","D":"肽键的水解"},"answer":"A","explanation":"协同效应指一个效应物分子与变构酶结合对另一个效应物分子结合产生影响。","difficulty":2,"tags":["协同效应"]},{"id":60,"topic":"蛋白质四级结构","type":"choice","question":"四级结构涉及的相互作用不包括？","options":{"A":"亚基组成与数量","B":"亚基的空间排布","C":"亚基内肽键的形成","D":"亚基间相互作用"},"answer":"C","explanation":"四级结构涉及亚基组成、数量、空间排布和亚基间相互作用。肽键是共价键，属于一级结构范畴。","difficulty":2,"tags":["四级结构","亚基"]},{"id":61,"topic":"蛋白质四级结构","type":"truefalse","question":"蛋白质四级结构中亚基之间通过共价键连接。","answer":false,"explanation":"四级结构中亚基通过非共价力（疏水相互作用、氢键、盐键等）连接，无共价连接。","difficulty":1,"tags":["四级结构","非共价力"]},{"id":62,"topic":"蛋白质四级结构","type":"truefalse","question":"大多数寡聚蛋白质的亚基排列具有对称性。","answer":true,"explanation":"对称性是蛋白质四级结构最重要的性质之一。X射线晶体学和电镜观察揭示大多数寡聚蛋白亚基排列是对称的。","difficulty":1,"tags":["对称性","四级结构"]},{"id":63,"topic":"蛋白质变性与折叠","type":"choice","question":"蛋白质变性的实质是？","options":{"A":"一级结构被破坏","B":"次级键被破坏，构象解体","C":"肽键断裂","D":"蛋白质完全水解"},"answer":"B","explanation":"变性实质是次级键被破坏，天然构象解体。一级结构保持完好，肽键不破裂。","difficulty":1,"tags":["变性","次级键"]},{"id":64,"topic":"蛋白质变性与折叠","type":"choice","question":"蛋白质变性的主要特征是？","options":{"A":"分子量增大","B":"生物活性丧失","C":"溶解度增大","D":"颜色变深"},"answer":"B","explanation":"生物活性丧失是蛋白质变性的主要特征。变性后溶解度降低、疏水基暴露、更易被蛋白酶水解。","difficulty":1,"tags":["变性","活性丧失"]},{"id":65,"topic":"蛋白质变性与折叠","type":"choice","question":"尿素和盐酸胍使蛋白质变性的主要机制是？","options":{"A":"断裂肽键","B":"破坏二硫键","C":"增加疏水侧链溶解度，降低疏水相互作用","D":"氧化氨基酸侧链"},"answer":"C","explanation":"尿素/盐酸胍增加疏水侧链在水中溶解度，降低维持三级结构的疏水相互作用，同时与主链竞争氢键。","difficulty":2,"tags":["尿素","疏水相互作用"]},{"id":66,"topic":"蛋白质变性与折叠","type":"choice","question":"关于蛋白质折叠的热力学特征，正确的是？","options":{"A":"蛋白质自身熵增","B":"蛋白质自身熵减，体系总熵增","C":"体系总熵不变","D":"蛋白质自身熵不变"},"answer":"B","explanation":"蛋白质折叠中自身熵减（更加有序），但因疏水基团埋藏导致水分子自由能增加，体系总熵增。","difficulty":2,"tags":["蛋白质折叠","热力学"]},{"id":67,"topic":"蛋白质变性与折叠","type":"choice","question":"分子伴侣的功能是什么？","options":{"A":"直接加速蛋白质折叠反应","B":"防止错误折叠，增加功能性折叠产率","C":"为蛋白质提供能量","D":"直接参与形成最终蛋白质产物"},"answer":"B","explanation":"分子伴侣通过防止或消除肽链错误折叠增加功能性折叠产率，但不加快折叠速度，不促进正确折叠（只协助），不参与最终产物。","difficulty":3,"tags":["分子伴侣"]},{"id":68,"topic":"蛋白质变性与折叠","type":"choice","question":"肽基脯氨酸异构酶的作用是？","options":{"A":"催化二硫键形成","B":"催化蛋白质肽键的顺反异构","C":"催化肽键水解","D":"催化蛋白质降解"},"answer":"B","explanation":"肽基脯氨酸异构酶催化蛋白质肽键的顺反异构，尤其X-Pro肽键。体内肽键多为反式但X-Pro顺式概率较高。","difficulty":3,"tags":["肽基脯氨酸异构酶","顺反异构"]},{"id":69,"topic":"蛋白质变性与折叠","type":"truefalse","question":"蛋白质变性后一级结构保持完好。","answer":true,"explanation":"变性的实质是次级键破坏，一级结构（肽键）保持完好。这是变性和水解的本质区别。","difficulty":1,"tags":["变性","一级结构"]},{"id":70,"topic":"蛋白质变性与折叠","type":"truefalse","question":"分子伴侣可以加快蛋白质的折叠反应速度。","answer":false,"explanation":"分子伴侣不加快折叠速度。功能是防止错误折叠、增加功能性折叠产率，但不促进正确折叠，只协助。","difficulty":2,"tags":["分子伴侣","折叠速度"]},{"id":71,"topic":"氨基酸与蛋白质化学","type":"choice","question":"维持蛋白质α-螺旋二级结构的主要化学键是？","options":{"A":"肽键","B":"主链上的氢键","C":"疏水相互作用","D":"二硫键"},"answer":"B","explanation":"二级结构（α-螺旋、β-折叠等）的稳定性主要靠主链上的氢键维持。","difficulty":1,"tags":["二级结构","氢键"]},{"id":72,"topic":"氨基酸与蛋白质化学","type":"choice","question":"蛋白质中二硫键的作用是？","options":{"A":"维持二级结构","B":"稳定折叠态结构","C":"提供疏水核心","D":"促进肽键形成"},"answer":"B","explanation":"二硫键有稳定蛋白质折叠态结构的功能，但对肽链的正确折叠不是必要的。二硫键是共价键。","difficulty":2,"tags":["二硫键","折叠态"]},{"id":73,"topic":"氨基酸与蛋白质化学","type":"choice","question":"三级结构中，相隔较远的氨基酸残基通过什么相互作用？","options":{"A":"肽键","B":"侧链R基团的非共价力","C":"糖苷键","D":"磷酸二酯键"},"answer":"B","explanation":"三级结构因序列相隔较远的氨基酸残基侧链（R基）相互作用进一步折叠，涉及主链和侧链所有原子。","difficulty":1,"tags":["三级结构","R基"]},{"id":74,"topic":"氨基酸与蛋白质化学","type":"choice","question":"蛋白质变性后，哪种性质会降低？","options":{"A":"易被蛋白酶水解的程度","B":"溶解度","C":"黏度","D":"旋光性"},"answer":"B","explanation":"变性后疏水基外露导致溶解度降低，但黏度增高、更易被蛋白酶水解、旋光性和紫外吸收能力改变。","difficulty":2,"tags":["变性","溶解度"]},{"id":75,"topic":"氨基酸与蛋白质化学","type":"choice","question":"蛋白质折叠的核心驱动力是？","options":{"A":"氢键","B":"离子键","C":"疏水相互作用","D":"范德华力"},"answer":"C","explanation":"蛋白质折叠的核心驱动力是疏水相互作用。这是蛋白质能自发折叠成紧密球状结构的主要原因。","difficulty":1,"tags":["蛋白质折叠","疏水相互作用"]},{"id":76,"topic":"氨基酸与蛋白质化学","type":"choice","question":"无规卷曲常作为什么功能区？","options":{"A":"酶的活性部位","B":"跨膜区","C":"信号肽","D":"糖基化位点"},"answer":"A","explanation":"无规卷曲常作为酶的活性部位。细胞色素c的二级结构中含有无规卷曲。","difficulty":2,"tags":["无规卷曲","活性部位"]},{"id":77,"topic":"氨基酸与蛋白质化学","type":"truefalse","question":"蛋白质变性后，一级结构完全被破坏。","answer":false,"explanation":"变性只破坏次级键（非共价键）和构象，一级结构（肽键）保持完好。水解才会破坏一级结构。","difficulty":1,"tags":["变性","一级结构"]},{"type":"choice","topic":"蛋白质变性与折叠","question":"SDS使蛋白质变性的主要机制是？","options":{"A":"断裂肽键","B":"破坏二硫键","C":"破坏疏水相互作用","D":"氧化氨基酸残基"},"answer":"C","explanation":"SDS（十二烷基硫酸钠）可破坏蛋白质分子内的疏水相互作用，使疏水基团暴露于介质水中。","difficulty":2,"tags":["SDS","变性"],"id":78},{"type":"choice","topic":"蛋白质变性与折叠","question":"关于蛋白质复性的描述正确的是？","options":{"A":"任何变性蛋白都能完全复性","B":"复性需要合成新的肽链","C":"一般变性程度很低时才能复性","D":"复性需要高温条件"},"answer":"C","explanation":"一般认为蛋白质变性程度很低的情况下才可能发生复性，多采用透析或超滤等方法去除变性剂。","difficulty":2,"tags":["复性"],"id":79},{"type":"choice","topic":"蛋白质变性与折叠","question":"蛋白质二硫键异构酶的功能是？","options":{"A":"催化二硫键断裂","B":"帮助二硫键正确配对","C":"合成二硫键","D":"水解二硫键"},"answer":"B","explanation":"蛋白质二硫键异构酶有助于二硫键正确配对，协助蛋白质形成正确的折叠结构。","difficulty":2,"tags":["二硫键异构酶"],"id":80},{"type":"choice","topic":"蛋白质变性与折叠","question":"蛋白质折叠过程中，肽基脯氨酸异构酶催化什么反应？","options":{"A":"二硫键的氧化","B":"肽键的水解","C":"蛋白质肽键的顺反异构","D":"蛋白质的去折叠"},"answer":"C","explanation":"肽基脯氨酸异构酶催化蛋白质肽键的顺反异构，体内肽键多为反式但X-Pro顺式概率较高。","difficulty":2,"tags":["肽基脯氨酸异构酶"],"id":81},{"type":"choice","topic":"纤维状蛋白","question":"弹性蛋白存在于哪种组织中？","options":{"A":"骨骼","B":"结缔组织","C":"毛发","D":"血液"},"answer":"B","explanation":"弹性蛋白存在于结缔组织，使肺、血管及韧带等具有伸展性。","difficulty":2,"tags":["弹性蛋白","结缔组织"],"id":82},{"type":"choice","topic":"蛋白质变性与折叠","question":"我国提出蛋白质变性学说的生物化学家是？","options":{"A":"王应睐","B":"吴宪","C":"汤佩松","D":"邹承鲁"},"answer":"B","explanation":"吴宪在20世纪30年代就已提出蛋白质变性的学说，这是中国生物化学家的重要贡献。","difficulty":1,"tags":["吴宪","变性学说"],"id":83},{"type":"choice","topic":"膜蛋白","question":"以下哪种方法可用于分离提取内在膜蛋白质？","options":{"A":"改变pH","B":"加入尿素","C":"加入去污剂","D":"增加离子浓度"},"answer":"C","explanation":"内在膜蛋白质需要破坏疏水相互作用的介质（如去污剂、变性剂）才能分离。改变pH和离子浓度用于分离膜周边蛋白质。","difficulty":2,"tags":["内在膜蛋白","去污剂"],"id":84},{"type":"choice","topic":"蛋白质二级结构","question":"β-凸起的功能是什么？","options":{"A":"形成肽键","B":"改变多肽链的走向","C":"催化化学反应","D":"结合金属离子"},"answer":"B","explanation":"β-凸起也可以改变多肽链的走向，与β-转角类似。","difficulty":3,"tags":["β-凸起","走向"],"id":85},{"type":"truefalse","topic":"蛋白质变性与折叠","question":"蛋白质复性是指变性蛋白恢复天然构象和生物活性的现象。","answer":true,"explanation":"复性是变性蛋白在除去变性因素后恢复天然构象和生物活性的现象。","difficulty":1,"tags":["复性"],"id":86},{"type":"truefalse","topic":"蛋白质变性与折叠","question":"蛋白质折叠是一个需要输入外部能量的非自发过程。","answer":false,"explanation":"多肽链的折叠是自发过程，最终折叠形成的构象是生理条件下自由能最低的稳定构象。","difficulty":2,"tags":["蛋白质折叠","自发过程"],"id":87},{"type":"truefalse","topic":"蛋白质变性与折叠","question":"胶原蛋白于水中煮沸即转变为明胶。","answer":true,"explanation":"胶原于水中煮沸即转变为明胶（动物胶），是一种可溶性多肽混合物。","difficulty":1,"tags":["胶原蛋白","明胶"],"id":88}],"terms":[{"id":1,"term":"肽平面（酰胺平面）","definition":"肽键具有部分双键性质，参与肽键形成的C、H、O、N、Cα、Cα六个原子处于同一平面，不能自由旋转，形成多肽主链的平面结构。","chapter":"第二章"},{"id":2,"term":"二面角（构象角）","definition":"两相邻酰胺平面之间，以共同Cα为定点，绕N-Cα键旋转为Φ角，绕Cα-C键旋转为Ψ角，二者合称二面角，决定多肽链的构象。","chapter":"第二章"},{"id":3,"term":"蛋白质二级结构","definition":"多肽链局部肽段借氢键沿一定方向盘曲折叠形成的有规则周期性结构，不涉及侧链定位。主要包括α-螺旋、β-折叠、β-转角、无规卷曲等。","chapter":"第二章"},{"id":4,"term":"α-螺旋","definition":"蛋白质中最常见的二级结构元件，一个螺圈含3.6个残基，螺距0.54nm，氢键几乎平行于螺旋轴，由第n个肽基C=O与n+3位N-H形成13元环。","chapter":"第二章"},{"id":5,"term":"β-折叠","definition":"多肽链骨架伸展成锯齿结构，氢键存在于股间。分平行和反平行两种，反平行更稳定。Gly、Ala等小R基氨基酸常有助其伸展。","chapter":"第二章"},{"id":6,"term":"β-转角","definition":"由4个连续氨基酸残基组成，主链以180°回折改变方向。n位C=O与n+3位N-H形成氢键。Gly和Pro常出现在此结构中。","chapter":"第二章"},{"id":7,"term":"无规卷曲","definition":"有一定任意性的二级结构类型，不是完全无规。常作为酶的活性部位。例如细胞色素c的二级结构中含有。","chapter":"第二章"},{"id":8,"term":"超二级结构","definition":"由两个或更多相邻二级结构单元（主要是α-螺旋和β-折叠）和连接部件组合形成的规则结构组合，如αα、βαβ、β发夹等。","chapter":"第二章"},{"id":9,"term":"结构域","definition":"多肽链在二级或超二级结构基础上形成的三级结构局部折叠区，一般由100-200个残基组成，是空间相对独立的紧密球状实体，具有独立结构和功能。","chapter":"第二章"},{"id":10,"term":"蛋白质三级结构","definition":"多肽链在二级结构、超二级结构或结构域基础上，因相隔较远氨基酸残基侧链的相互作用进一步盘曲折叠形成的包括主、侧链所有原子在内的整体空间排布。","chapter":"第二章"},{"id":11,"term":"蛋白质四级结构","definition":"两条或多条有完整三级结构的多肽链（亚基）通过非共价力（主要是疏水相互作用）互相连接形成的立体结构。涉及亚基组成、数量和空间排布。","chapter":"第二章"},{"id":12,"term":"别构效应","definition":"结合在蛋白质特定部位上的配体对该分子其他部位产生的影响。具有此效应的蛋白质称为别构蛋白质。","chapter":"第二章"},{"id":13,"term":"协同效应","definition":"一个效应物分子与变构酶的结合对另一个效应物分子的结合产生影响。","chapter":"第二章"},{"id":14,"term":"蛋白质变性","definition":"天然蛋白受物理或化学因素影响，次级键被破坏、天然构象解体、生物活性丧失的过程。一级结构保持完好。","chapter":"第二章"},{"id":15,"term":"分子伴侣","definition":"细胞中一类能识别肽链非天然构象、通过与疏水肽段结合和释放（需ATP）发挥功能的保守蛋白质。防止错误折叠、协助正确折叠，不参与最终产物。","chapter":"第二章"},{"id":16,"term":"蛋白质复性","definition":"变性蛋白分子因除去变性因素而恢复天然构象和生物活性的现象。一般变性程度低时可通过透析或超滤去除变性剂实现。","chapter":"第二章"},{"id":17,"term":"膜周边蛋白质","definition":"分布在脂双层内、外表面的可溶性球状蛋白，通过静电相互作用和氢键与膜结合，可用温和方法分离。占膜蛋白20%-30%。","chapter":"第二章"},{"id":18,"term":"内在膜蛋白质","definition":"部分或全部嵌在脂双层中的膜蛋白，靠与脂双层的疏水相互作用牢固结合，需去污剂或变性剂才能分离。占膜蛋白70%-80%。","chapter":"第二章"}],"stats":{"total":88,"choice":66,"truefalse":22,"easy":37,"mid":44,"hard":7,"terms":18}},"cellbio_ch2":{"key":"cellbio_ch2","name":"细胞生物学","code":"851","chapterLabel":"2 研究方法","questions":[{"id":1,"topic":"光学显微镜技术","type":"choice","question":"普通光学显微镜的分辨率极限约为多少？","options":{"A":"0.2μm","B":"0.2nm","C":"2μm","D":"0.2mm"},"answer":"A","explanation":"光学显微镜的分辨率极限由阿贝公式决定：d=0.61λ/(n·sinα)。可见光波长约400-700nm，数值孔径最大约1.4，因此理论极限分辨率约为0.2μm。电子显微镜因使用电子束（波长极短），分辨率可达0.2nm。0.2mm为肉眼分辨极限。","difficulty":1,"tags":["分辨率","阿贝公式","光学显微镜"]},{"id":2,"topic":"光学显微镜技术","type":"choice","question":"影响光学显微镜分辨率的关键因素不包括以下哪一项？","options":{"A":"光源波长","B":"物镜数值孔径","C":"介质的折射率","D":"目镜的放大倍数"},"answer":"D","explanation":"分辨率取决于光源波长(λ)、介质折射率(n)和镜口角(α)，由公式d=0.61λ/(n·sinα)决定。目镜放大倍数只影响总放大率，不影响分辨率。数值孔径NA=n·sinα是物镜的关键参数。","difficulty":1,"tags":["分辨率","数值孔径","放大倍数"]},{"id":3,"topic":"光学显微镜技术","type":"choice","question":"相差显微镜主要用于观察什么类型的样品？","options":{"A":"荧光标记的样品","B":"未经染色的活细胞","C":"金属表面结构","D":"DNA分子"},"answer":"B","explanation":"相差显微镜利用细胞各组分折射率不同，将相位差转换为振幅差（明暗对比），特别适合观察未经染色的活细胞。荧光显微镜用于观察荧光标记样品，扫描电镜观察表面结构，DNA分子需用电镜或AFM观察。","difficulty":1,"tags":["相差显微镜","活细胞观察","相位差"]},{"id":4,"topic":"光学显微镜技术","type":"choice","question":"微分干涉差显微镜（DIC）相比相差显微镜的优势是？","options":{"A":"分辨率更高","B":"能呈现三维立体浮雕效果","C":"不需要光源","D":"可以观察荧光"},"answer":"B","explanation":"DIC显微镜利用偏振光和Nomarski棱镜，将样品厚度差异转化为明暗对比，呈现出具有立体浮雕感的图像。其分辨率与相差显微镜相当，但图像更加立体。两者均不能观察荧光，需要荧光显微镜。","difficulty":2,"tags":["微分干涉差显微镜","DIC","相差显微镜"]},{"id":5,"topic":"光学显微镜技术","type":"choice","question":"荧光显微镜中使用滤光片的主要目的是什么？","options":{"A":"提高分辨率","B":"分离激发光和发射光","C":"放大图像","D":"保护样品"},"answer":"B","explanation":"荧光显微镜的核心原理是用特定波长的激发光照射样品，荧光分子发射出波长更长的发射光。滤光片系统（激发滤光片+二向色镜+发射滤光片）的作用是选择性地让激发光和发射光通过，使二者有效分离。","difficulty":1,"tags":["荧光显微镜","滤光片","激发光","发射光"]},{"id":6,"topic":"光学显微镜技术","type":"choice","question":"共聚焦荧光显微镜相比普通荧光显微镜的主要优势是什么？","options":{"A":"放大倍数更大","B":"可进行三维光学切片成像","C":"不需要荧光标记","D":"分辨率达到0.2nm"},"answer":"B","explanation":"共聚焦显微镜在光路中加入针孔(pinhole)，只允许焦平面上的光通过，排除焦平面以外的杂散光，因此可进行光学切片并三维重建。分辨率有所提升但未达到纳米级别，仍需要荧光标记。","difficulty":2,"tags":["共聚焦显微镜","光学切片","针孔"]},{"id":7,"topic":"光学显微镜技术","type":"choice","question":"绿色荧光蛋白（GFP）在细胞生物学中的主要用途是什么？","options":{"A":"提高显微镜分辨率","B":"作为报告分子标记活细胞中的蛋白质","C":"杀死癌细胞","D":"提取细胞核"},"answer":"B","explanation":"GFP是源自水母的荧光蛋白，可通过基因融合技术与目标蛋白共表达，实现对活细胞内蛋白质的实时定位和动态追踪。GFP的发现和应用极大推动了活细胞成像研究。GFP本身不杀伤细胞。","difficulty":1,"tags":["GFP","绿色荧光蛋白","活细胞标记","报告分子"]},{"id":8,"topic":"光学显微镜技术","type":"choice","question":"全内反射荧光显微镜（TIRFM）主要用于观察什么？","options":{"A":"细胞核内结构","B":"质膜附近约100-200nm范围内的分子","C":"整个细胞的荧光分布","D":"线粒体内部"},"answer":"B","explanation":"TIRFM利用全内反射产生的消逝波（evanescent wave）仅激发紧贴盖玻片表面约100-200nm范围内的荧光分子，因此特别适合研究质膜附近的分子事件，如胞吐、细胞黏附等。","difficulty":2,"tags":["TIRFM","消逝波","全内反射","质膜"]},{"id":9,"topic":"光学显微镜技术","type":"choice","question":"超高分辨率显微技术（如STED、PALM、STORM）突破了什么限制？","options":{"A":"放大倍数限制","B":"阿贝衍射极限","C":"荧光强度限制","D":"样品厚度限制"},"answer":"B","explanation":"传统光学显微镜受阿贝衍射极限限制，分辨率约为200nm。STED（受激发射损耗显微镜）和PALM/STORM（光激活定位显微技术）等超分辨技术突破了这一极限，可实现20-50nm分辨率，其中STED通过受激发射耗尽周边荧光实现，2014年诺贝尔化学奖授予了此项技术的发明。","difficulty":3,"tags":["超高分辨率","STED","PALM","STORM","衍射极限"]},{"id":10,"topic":"光学显微镜技术","type":"choice","question":"在荧光共振能量转移（FRET）技术中，能量从供体分子转移到受体分子需要满足的关键条件是？","options":{"A":"供体和受体距离极近（1-10nm）","B":"供体和受体是同一种分子","C":"需要电子显微镜","D":"样品必须固定"},"answer":"A","explanation":"FRET的效率与供体-受体分子间距离的六次方成反比，有效检测距离通常为1-10nm。该技术可在活细胞中研究蛋白质分子间相互作用。供体和受体必须是两种不同的荧光分子，且不需要固定样品。","difficulty":2,"tags":["FRET","荧光共振能量转移","蛋白质相互作用"]},{"id":11,"topic":"光学显微镜技术","type":"choice","question":"光漂白后荧光恢复（FRAP）技术用于研究什么？","options":{"A":"蛋白质的氨基酸序列","B":"膜蛋白或胞内分子的扩散动力学","C":"细胞分裂周期","D":"DNA复制速率"},"answer":"B","explanation":"FRAP通过用强激光漂白细胞中某一小区域的荧光分子，然后监测周围未漂白的荧光分子向该区域的扩散恢复过程，从而定量测定分子的扩散系数和流动特性。广泛应用于研究膜蛋白扩散、细胞骨架动态等。","difficulty":2,"tags":["FRAP","光漂白后荧光恢复","扩散动力学","膜蛋白"]},{"id":12,"topic":"光学显微镜技术","type":"choice","question":"下列关于荧光显微镜样品制备的描述，正确的是？","options":{"A":"必须使用重金属染色","B":"可直接观察未经任何处理的活细胞","C":"通常使用荧光染料或荧光蛋白标记目标分子","D":"必须在真空中观察"},"answer":"C","explanation":"荧光显微镜需要样品带有荧光标记（荧光染料如DAPI、FITC，或荧光蛋白如GFP）。不需重金属染色（那是电镜需要的），可在常压下观察活细胞，不需真空环境。","difficulty":2,"tags":["荧光染料","样品制备","荧光标记"]},{"id":13,"topic":"光学显微镜技术","type":"truefalse","question":"普通光学显微镜的分辨率主要取决于目镜的放大倍数。","answer":false,"explanation":"普通光学显微镜的分辨率由物镜的数值孔径(NA)和光源波长决定，与目镜放大倍数无关。目镜仅起二次放大作用，不能提高分辨率。","difficulty":1,"tags":["分辨率","放大倍数"]},{"id":14,"topic":"光学显微镜技术","type":"truefalse","question":"共聚焦显微镜利用针孔排除了焦平面以外的杂散光，因此能进行光学切片。","answer":true,"explanation":"共聚焦显微镜的关键设计是在光路中加入照明针孔和检测针孔，只让焦平面上的光通过，阻挡焦平面以外的光，从而实现光学切片和三维重建。","difficulty":1,"tags":["共聚焦显微镜","光学切片","针孔"]},{"id":15,"topic":"光学显微镜技术","type":"truefalse","question":"相差显微镜能将样品中微小的折射率差异转化为明暗对比，适合观察活细胞。","answer":true,"explanation":"相差显微镜利用环状光阑和相板，将光通过样品不同区域的相位差转化为振幅差，使透明活细胞的不同结构呈现明暗区别，无需染色即可观察。","difficulty":1,"tags":["相差显微镜","活细胞","折射率"]},{"id":16,"topic":"光学显微镜技术","type":"truefalse","question":"绿色荧光蛋白(GFP)必须与抗体偶联后才能用于标记目标蛋白。","answer":false,"explanation":"GFP可通过基因融合技术与目标蛋白在细胞内共表达，无需抗体。GFP的基因可以直接连接到目的蛋白基因的3'端或5'端，表达出融合蛋白即可发出荧光。免疫荧光才需要抗体标记。","difficulty":2,"tags":["GFP","融合蛋白","免疫荧光"]},{"id":17,"topic":"电子显微镜技术","type":"choice","question":"透射电子显微镜（TEM）的分辨率极限约为多少？","options":{"A":"0.2nm","B":"0.2μm","C":"2μm","D":"20nm"},"answer":"A","explanation":"TEM使用波长极短的电子束（加速电压100kV时波长约0.0037nm），理论分辨率远高于光学显微镜，实际分辨率极限约0.1-0.2nm。0.2μm是光学显微镜的极限，2μm是普通细胞的大小级别。","difficulty":1,"tags":["透射电镜","分辨率","电子束"]},{"id":18,"topic":"电子显微镜技术","type":"choice","question":"透射电镜观察样品前，通常需要对样品进行什么处理？","options":{"A":"荧光染色","B":"戊二醛和四氧化锇固定、脱水、包埋、超薄切片","C":"直接观察活细胞","D":"仅在盖玻片上培养即可"},"answer":"B","explanation":"TEM观察需要样品极薄(50-100nm)且能耐受电子束轰击和高真空环境。标准制备流程包括：戊二醛固定→四氧化锇后固定→梯度脱水→树脂包埋→超薄切片→重金属染色（如醋酸铀酰和柠檬酸铅）。","difficulty":1,"tags":["超薄切片","固定","包埋","透射电镜样品制备"]},{"id":19,"topic":"电子显微镜技术","type":"choice","question":"扫描电子显微镜（SEM）主要用来观察什么？","options":{"A":"细胞内部超微结构","B":"样品表面形貌","C":"蛋白质三维结构","D":"活细胞的动态过程"},"answer":"B","explanation":"SEM利用聚焦的细电子束在样品表面逐点扫描，收集二次电子或背散射电子信号成像，主要显示样品表面的三维形貌特征。细胞内部结构需用TEM观察，蛋白质三维结构需X射线晶体学或冷冻电镜。","difficulty":1,"tags":["扫描电镜","表面形貌","二次电子"]},{"id":20,"topic":"电子显微镜技术","type":"choice","question":"透射电镜与扫描电镜的一个关键区别是？","options":{"A":"透射电镜使用电子束，扫描电镜使用光束","B":"透射电镜的电子束穿透样品，扫描电镜的电子束在样品表面扫描","C":"透射电镜分辨率为0.2μm","D":"扫描电镜需要超薄切片"},"answer":"B","explanation":"TEM电子束穿透极薄样品（50-100nm），携带样品内部结构信息成像。SEM电子束在样品表面逐点扫描，收集表面信号成像。两者都使用电子束。TEM分辨率可达0.2nm。SEM样品不需超薄切片，但需导电处理。","difficulty":1,"tags":["透射电镜","扫描电镜","电子束"]},{"id":21,"topic":"电子显微镜技术","type":"choice","question":"负染色技术在电镜中的主要作用是什么？","options":{"A":"标记蛋白质定位","B":"增强样品反差，显示病毒、细胞器等颗粒结构","C":"固定细胞膜","D":"观察活细胞"},"answer":"B","explanation":"负染色是用重金属盐（如磷钨酸）溶液浸染样品，重金属沉积在样品凹陷处和周围，使样品（如病毒颗粒、蛋白质复合体）在暗色背景中呈明亮图像。此方法简便快捷，但不适用于切片观察。","difficulty":2,"tags":["负染色","重金属盐","反差","病毒"]},{"id":22,"topic":"电子显微镜技术","type":"choice","question":"冷冻蚀刻技术主要用于观察什么结构？","options":{"A":"DNA双螺旋","B":"生物膜断裂面的内部结构","C":"细胞核内的染色质","D":"核糖体大亚基"},"answer":"B","explanation":"冷冻蚀刻技术将样品快速冷冻后断裂，断裂面沿膜脂双分子层的疏水内部裂开，暴露出膜内蛋白颗粒和膜结构。经铂碳投影后在TEM下观察，可显示生物膜的内部结构。该方法能揭示膜蛋白的分布和膜的不对称性。","difficulty":2,"tags":["冷冻蚀刻","生物膜","断裂面","膜蛋白"]},{"id":23,"topic":"电子显微镜技术","type":"choice","question":"免疫电镜技术的原理是什么？","options":{"A":"用电镜直接观察抗原","B":"用金颗粒标记的抗体特异性地定位抗原","C":"用荧光染料标记抗体","D":"用同位素标记抗原"},"answer":"B","explanation":"免疫电镜将免疫组织化学与电镜结合，用胶体金颗粒（直径5-20nm）标记的抗体与细胞内抗原特异性结合，在TEM下可见高电子密度的金颗粒，从而在超微结构水平定位抗原。荧光标记用于光镜。","difficulty":2,"tags":["免疫电镜","胶体金","抗原定位","抗体标记"]},{"id":24,"topic":"电子显微镜技术","type":"choice","question":"冷冻电镜（Cryo-EM）技术的重大突破主要体现在哪方面？","options":{"A":"可以观察活细胞","B":"可在近生理状态下测定生物大分子的高分辨率三维结构","C":"分辨率达到0.2μm","D":"不需要任何图像处理"},"answer":"B","explanation":"冷冻电镜将样品快速冷冻在玻璃态冰中（无需结晶），在低温下采集大量单颗粒二维投影图像，经三维重构获得生物大分子的高分辨率三维结构。2017年诺贝尔化学奖授予了此项技术。其分辨率已可达原子水平(约0.2-0.3nm)。","difficulty":3,"tags":["冷冻电镜","Cryo-EM","三维重构","单颗粒分析"]},{"id":25,"topic":"电子显微镜技术","type":"choice","question":"超薄切片的典型厚度范围是多少？","options":{"A":"1-5mm","B":"50-100nm","C":"0.2-0.5μm","D":"5-10μm"},"answer":"B","explanation":"透射电镜的超薄切片通常为50-100nm厚，因为电子束穿透能力有限，样品必须极薄。切片用超薄切片机配合玻璃刀或金刚石刀制作。普通石蜡切片为5-10μm，用于光镜。","difficulty":1,"tags":["超薄切片","透射电镜","样品厚度"]},{"id":26,"topic":"电子显微镜技术","type":"choice","question":"扫描电镜样品制备中通常需要进行什么特殊处理？","options":{"A":"超薄切片","B":"喷镀金属导电层","C":"荧光标记","D":"免疫染色"},"answer":"B","explanation":"生物样品通常不导电，SEM观察前需在样品表面喷镀一薄层金属（如金、铂），使其导电，防止电荷积累影响成像。同时进行固定、脱水和临界点干燥以保持表面结构。","difficulty":2,"tags":["扫描电镜","金属镀膜","导电处理","样品制备"]},{"id":27,"topic":"电子显微镜技术","type":"truefalse","question":"透射电子显微镜使用电子束作为照明源，因此分辨率远高于光学显微镜。","answer":true,"explanation":"TEM使用高压加速的电子束（波长极短），其理论分辨率可达0.1-0.2nm，远高于光学显微镜的0.2μm分辨率极限。电子束的波长远小于可见光。","difficulty":1,"tags":["透射电镜","分辨率","电子束"]},{"id":28,"topic":"电子显微镜技术","type":"truefalse","question":"扫描电子显微镜可以直接观察未经任何处理的活体细胞。","answer":false,"explanation":"SEM要求样品在真空条件下导电，生物样品必须经过固定、脱水、干燥和金属镀膜等处理，不能直接观察活细胞。活细胞中的水分在真空中会汽化破坏样品结构。","difficulty":1,"tags":["扫描电镜","样品制备","真空"]},{"id":29,"topic":"电子显微镜技术","type":"truefalse","question":"负染色技术使用重金属盐溶液，使样品在暗背景中呈明亮图像。","answer":true,"explanation":"负染色利用重金属盐（如磷钨酸、醋酸铀酰）填充样品周围和凹陷处，重金属散射电子能力强，在图像中呈暗色，而样品本身相对明亮，形成负反差。常用于病毒、蛋白质复合体的形态观察。","difficulty":2,"tags":["负染色","重金属盐","反差"]},{"id":30,"topic":"其他显微镜","type":"choice","question":"扫描隧道显微镜（STM）的基本原理是什么？","options":{"A":"利用光束扫描样品","B":"利用量子隧道效应测量探针与样品之间的隧道电流","C":"利用电子束穿透样品","D":"利用荧光信号成像"},"answer":"B","explanation":"STM利用极细的金属探针在导电样品表面扫描，当探针与样品距离极近(<1nm)时，在偏压作用下产生隧道电流。通过检测隧道电流的变化获得样品表面原子级形貌信息。STM要求样品导电。","difficulty":2,"tags":["扫描隧道显微镜","量子隧道效应","隧道电流"]},{"id":31,"topic":"其他显微镜","type":"choice","question":"原子力显微镜（AFM）相比STM的主要优势是什么？","options":{"A":"分辨率更高","B":"可用于非导电生物样品","C":"可以在真空中工作","D":"不需要计算机处理"},"answer":"B","explanation":"AFM通过检测探针与样品表面原子间作用力（范德华力、静电力等）成像，不依赖隧道电流，因此样品不需要导电。AFM可在空气或液体环境中工作，适合生物大分子的原位观察，如DNA、蛋白质复合体。","difficulty":2,"tags":["原子力显微镜","非导电样品","范德华力","生物大分子"]},{"id":32,"topic":"其他显微镜","type":"choice","question":"AFM的工作模式不包括以下哪种？","options":{"A":"接触模式","B":"轻敲模式","C":"非接触模式","D":"荧光激发模式"},"answer":"D","explanation":"AFM主要工作模式包括：接触模式（探针始终接触样品）、非接触模式（探针与样品保持一定距离）、轻敲模式（探针间歇性接触样品）。荧光激发是荧光显微镜的工作方式，与AFM无关。","difficulty":3,"tags":["原子力显微镜","工作模式","接触模式","轻敲模式"]},{"id":33,"topic":"其他显微镜","type":"choice","question":"下列关于STM和AFM的比较，正确的是？","options":{"A":"两者都需要样品导电","B":"STM利用隧道电流，AFM利用原子间作用力","C":"STM不能观察单原子","D":"AFM的分辨率低于普通光学显微镜"},"answer":"B","explanation":"STM原理基于隧道电流，要求样品导电；AFM原理基于探针-样品间作用力，不要求导电。两者都可达到原子级分辨率，远高于光学显微镜。STM可以实现单个原子的观察与操纵。","difficulty":2,"tags":["STM","AFM","隧道电流","原子间作用力"]},{"id":34,"topic":"其他显微镜","type":"truefalse","question":"扫描隧道显微镜可以用于观察非导电的生物样品。","answer":false,"explanation":"STM依赖隧道电流成像，要求样品表面导电。生物样品通常不导电，需喷镀金属导电层后方可观察。AFM则不受此限制，可直接观察非导电生物样品。","difficulty":2,"tags":["STM","导电性","生物样品"]},{"id":35,"topic":"其他显微镜","type":"truefalse","question":"原子力显微镜可在液相环境中工作，适合原位观察生物大分子。","answer":true,"explanation":"AFM不依赖真空环境，可在空气、真空或液相中成像，尤其适合在接近生理条件的溶液环境中观察DNA、蛋白质等生物大分子的结构和动态过程。","difficulty":2,"tags":["AFM","液相环境","原位观察"]},{"id":36,"topic":"细胞组分分离技术","type":"choice","question":"差速离心分离细胞组分的主要依据是什么？","options":{"A":"细胞器的颜色差异","B":"细胞器的大小和密度差异","C":"细胞器的膜组成差异","D":"细胞器的pH差异"},"answer":"B","explanation":"差速离心通过逐步提高离心力和离心时间，使不同大小和密度的细胞器依次沉降。从低到高依次收集：细胞核(600-1000g,10min)→线粒体和溶酶体(10000-20000g,20min)→微粒体(100000g,1h)→细胞质可溶性组分(上清)。","difficulty":1,"tags":["差速离心","细胞器分离","离心力","沉降系数"]},{"id":37,"topic":"细胞组分分离技术","type":"choice","question":"密度梯度离心中常用的介质不包括以下哪种？","options":{"A":"蔗糖","B":"氯化铯(CsCl)","C":"乙醇","D":"Percoll"},"answer":"C","explanation":"密度梯度离心常用蔗糖（形成连续或不连续密度梯度）、氯化铯（用于等密度离心分离DNA等大分子）和Percoll（硅胶颗粒，渗透压低，适合分离活细胞和细胞器）。乙醇会使蛋白质变性，不能用作离心介质。","difficulty":2,"tags":["密度梯度离心","蔗糖","氯化铯","Percoll"]},{"id":38,"topic":"细胞组分分离技术","type":"choice","question":"等密度离心（平衡密度离心）中，样品组分分离的依据是什么？","options":{"A":"大小不同","B":"形状不同","C":"浮力密度不同","D":"电荷不同"},"answer":"C","explanation":"等密度离心使样品（如DNA、细胞器）在密度梯度介质中离心至其自身浮力密度位置，形成狭窄条带。各组分停留在与其密度相等的梯度层中，不受离心时间延长影响。常用于DNA的CsCl密度梯度离心分离。","difficulty":2,"tags":["等密度离心","浮力密度","平衡","CsCl"]},{"id":39,"topic":"细胞组分分离技术","type":"choice","question":"要分离细胞核，通常需在什么离心条件下进行？","options":{"A":"600-1000g离心10分钟","B":"10000g离心20分钟","C":"100000g离心60分钟","D":"300000g离心2小时"},"answer":"A","explanation":"细胞核是最大的细胞器，在低速离心(600-1000g,10min)即首先沉降。线粒体和溶酶体在10000-20000g沉降，微粒体（内质网碎片和核糖体）需100000g以上。这是差速离心的基本程序。","difficulty":1,"tags":["细胞核分离","差速离心","低速离心"]},{"id":40,"topic":"细胞组分分离技术","type":"choice","question":"细胞匀浆化时，常用的匀浆介质应具备什么条件？","options":{"A":"高渗液以使细胞膨胀","B":"等渗液以保持细胞器完整","C":"含有强酸以水解细胞壁","D":"无任何溶质的纯水"},"answer":"B","explanation":"细胞匀浆需在等渗缓冲液（如0.25M蔗糖溶液）中进行，以维持渗透压，防止细胞器因渗透压变化而肿胀破裂或皱缩。缓冲液还需含有适当pH缓冲剂和离子成分，并保持低温操作以抑制酶解。","difficulty":2,"tags":["匀浆","等渗液","细胞器完整性","蔗糖"]},{"id":41,"topic":"细胞组分分离技术","type":"choice","question":"超速离心主要用于分离什么？","options":{"A":"完整的组织块","B":"微粒体、核糖体等亚细胞器","C":"细胞核和线粒体","D":"完整的活细胞"},"answer":"B","explanation":"超速离心(>100000g)用于分离极小的亚细胞组分，如内质网碎片形成的微粒体、核糖体、高尔基体膜泡等。低速离心即可分离细胞核，中速离心分离线粒体。","difficulty":1,"tags":["超速离心","微粒体","核糖体","亚细胞器"]},{"id":42,"topic":"细胞组分分离技术","type":"choice","question":"差速离心的主要局限性是什么？","options":{"A":"无法分离任何细胞器","B":"分离的组分纯度不高，存在交叉污染","C":"只能分离DNA","D":"需要极昂贵的设备"},"answer":"B","explanation":"差速离心虽然简便快速，但不同细胞器的沉降系数可能有重叠（如线粒体和溶酶体沉降系数接近），导致交叉污染。提高纯度需结合密度梯度离心。另外反复离心可能导致细胞器损伤。","difficulty":2,"tags":["差速离心","交叉污染","纯度","密度梯度离心"]},{"id":43,"topic":"细胞组分分离技术","type":"choice","question":"在蔗糖密度梯度离心分离高尔基体和内质网组分时，通常采用什么方式？","options":{"A":"仅靠重力自然沉降","B":"不连续蔗糖密度梯度超速离心","C":"低速离心","D":"磁分离"},"answer":"B","explanation":"高尔基体膜和内质网膜的密度不同，通过不连续蔗糖密度梯度超速离心，可在不同密度界面富集不同的膜组分。例如高尔基体膜密度较低（lipid-rich），内质网膜密度较高（ribosome-rich）。","difficulty":3,"tags":["密度梯度离心","蔗糖","高尔基体","内质网"]},{"id":44,"topic":"细胞组分分离技术","type":"truefalse","question":"差速离心中离心力越大、时间越长，沉降的颗粒越小。","answer":true,"explanation":"差速离心的基本规律：低速短时沉降较大颗粒（如细胞核），逐步提高离心力和时间可沉降更小的颗粒（如线粒体、微粒体）。超速离心可沉降核糖体等最小亚细胞颗粒。","difficulty":1,"tags":["差速离心","离心力","沉降"]},{"id":45,"topic":"细胞组分分离技术","type":"truefalse","question":"Percoll密度梯度离心可用于分离有活性的细胞和细胞器。","answer":true,"explanation":"Percoll是硅胶颗粒包被聚乙烯吡咯烷酮形成的介质，渗透压低、无毒，可形成等渗梯度，适合在保持活性的条件下分离活细胞和功能性细胞器。","difficulty":3,"tags":["Percoll","密度梯度离心","细胞活性"]},{"id":46,"topic":"细胞组分分离技术","type":"truefalse","question":"细胞匀浆后所有细胞器都会立即溶解。","answer":false,"explanation":"在等渗缓冲液中进行温和匀浆时，大多数细胞器（细胞核、线粒体、溶酶体、高尔基体等）保持完整膜结构。只有在极端条件（低渗、去垢剂、强酸强碱）下细胞器膜才会破裂溶解。","difficulty":1,"tags":["匀浆","细胞器完整性","等渗液"]},{"id":47,"topic":"蛋白质与核酸定位技术","type":"choice","question":"免疫荧光技术检测目标蛋白的基本原理是什么？","options":{"A":"直接用荧光显微镜观察所有蛋白质","B":"用荧光标记的抗体特异性地结合目标抗原","C":"用放射性同位素标记蛋白质","D":"用电子束激发荧光"},"answer":"B","explanation":"免疫荧光利用抗体-抗原特异性结合原理，用荧光染料（如FITC、Cy3、Alexa Fluor系列）标记的抗体识别并结合细胞内的目标抗原，在荧光显微镜下显示该蛋白质的定位。可分为直接法（荧光标一抗）和间接法（荧光标二抗）。","difficulty":1,"tags":["免疫荧光","抗体","抗原","荧光标记","蛋白质定位"]},{"id":48,"topic":"蛋白质与核酸定位技术","type":"choice","question":"间接免疫荧光法相比直接法的主要优势是什么？","options":{"A":"操作更简单","B":"信号放大效应，灵敏度更高","C":"不需要抗体","D":"可在电镜下观察"},"answer":"B","explanation":"间接法先用未标记的一抗结合抗原，再用荧光标记的二抗识别一抗。由于一个一抗可结合多个二抗，产生信号放大效应（约5-10倍），灵敏度更高。同时同一荧光二抗可用于检测不同一抗，更灵活经济。","difficulty":2,"tags":["间接免疫荧光","信号放大","一抗","二抗","灵敏度"]},{"id":49,"topic":"蛋白质与核酸定位技术","type":"choice","question":"荧光原位杂交（FISH）技术用于检测什么？","options":{"A":"蛋白质的氨基酸序列","B":"特定DNA或RNA序列在细胞中的位置","C":"细胞膜的流动性","D":"酶的活性"},"answer":"B","explanation":"FISH使用荧光标记的核酸探针与细胞内靶DNA或RNA序列互补杂交，在荧光显微镜下显示特定核酸序列在染色体或细胞中的空间位置。常用于染色体基因定位、基因扩增检测和染色体异常诊断。","difficulty":1,"tags":["FISH","荧光原位杂交","核酸探针","基因定位"]},{"id":50,"topic":"蛋白质与核酸定位技术","type":"choice","question":"DAPI是一种常用的荧光染料，它特异性地结合什么结构？","options":{"A":"细胞膜","B":"线粒体","C":"DNA（细胞核）","D":"肌动蛋白丝"},"answer":"C","explanation":"DAPI(4',6-二脒基-2-苯基吲哚)能穿过细胞膜与DNA双螺旋小沟中的A-T碱基对特异性结合，在紫外激发下发蓝色荧光，是常用的核染色染料。MitoTracker标记线粒体，鬼笔环肽标记F-actin。","difficulty":1,"tags":["DAPI","DNA染色","核染料","荧光染料"]},{"id":51,"topic":"蛋白质与核酸定位技术","type":"choice","question":"免疫电镜与免疫荧光的主要区别在于？","options":{"A":"使用的抗体不同","B":"免疫电镜使用胶体金标记，免疫荧光使用荧光染料标记","C":"免疫荧光分辨率高于免疫电镜","D":"免疫电镜只能观察活细胞"},"answer":"B","explanation":"免疫电镜使用电子致密的胶体金颗粒标记抗体，在TEM下可见黑色金颗粒；免疫荧光使用荧光染料标记抗体，在荧光显微镜下可见彩色荧光信号。免疫电镜分辨率远高于免疫荧光，可在超微结构水平定位抗原。","difficulty":2,"tags":["免疫电镜","免疫荧光","胶体金","荧光染料"]},{"id":52,"topic":"蛋白质与核酸定位技术","type":"choice","question":"关于GFP融合蛋白技术的描述，以下哪项是错误的？","options":{"A":"可在活细胞中实时观察","B":"GFP与目标蛋白在细胞内共表达","C":"需要用抗体标记","D":"可用于研究蛋白质的动态定位"},"answer":"C","explanation":"GFP融合蛋白通过基因重组与目标蛋白共表达，自身发荧光，无需抗体标记。GFP技术可在活细胞中实时追踪目标蛋白的定位、转运和动态变化。这是GFP相比免疫荧光的核心优势。","difficulty":2,"tags":["GFP","融合蛋白","活细胞","无需抗体"]},{"id":53,"topic":"蛋白质与核酸定位技术","type":"choice","question":"原位杂交与免疫组化的主要区别是检测目标分子不同，原位杂交检测什么？","options":{"A":"蛋白质","B":"核酸（DNA或RNA）","C":"脂类","D":"糖类"},"answer":"B","explanation":"原位杂交用标记的核酸探针检测特定DNA或RNA序列，免疫组化/免疫荧光用抗体检测蛋白质抗原。两者可在同一细胞中联合使用，同时检测核酸和蛋白质的定位。","difficulty":1,"tags":["原位杂交","免疫组化","核酸","蛋白质"]},{"id":54,"topic":"蛋白质与核酸定位技术","type":"choice","question":"免疫荧光实验中通常如何固定细胞？","options":{"A":"用液氮快速冷冻","B":"用多聚甲醛或甲醇固定","C":"用沸水加热","D":"不需要固定"},"answer":"B","explanation":"免疫荧光常用化学固定法：多聚甲醛(4%)通过交联蛋白质固定，保持细胞结构好但可能遮蔽抗原；甲醇(-20℃)使蛋白质变性固定，能同时通透细胞膜。固定后可进行通透(如Triton X-100)和封闭处理。","difficulty":2,"tags":["免疫荧光","固定","多聚甲醛","甲醇"]},{"id":55,"topic":"蛋白质与核酸定位技术","type":"truefalse","question":"在间接免疫荧光中，荧光染料标记的是识别抗原的一抗。","answer":false,"explanation":"间接免疫荧光中，荧光染料标记的是二抗（抗抗体），而非直接标记一抗。一抗识别抗原，荧光二抗识别一抗的Fc段，产生信号放大。直接法才是荧光标记一抗。","difficulty":1,"tags":["间接免疫荧光","二抗","荧光标记"]},{"id":56,"topic":"蛋白质与核酸定位技术","type":"truefalse","question":"荧光原位杂交可以同时检测多个不同靶序列，使用不同颜色的荧光探针。","answer":true,"explanation":"多色FISH使用不同荧光染料（如FITC、Cy3、Cy5等）标记多个不同的核酸探针，在同一细胞中同时显示各靶序列的位置，实现多基因或染色体的多重定位分析。","difficulty":2,"tags":["多色FISH","荧光探针","多重检测"]},{"id":57,"topic":"蛋白质与核酸定位技术","type":"truefalse","question":"DAPI和Hoechst都是能透过细胞膜与DNA结合的荧光染料。","answer":true,"explanation":"DAPI和Hoechst 33342均为细胞膜通透性的DNA结合染料，与DNA的A-T碱基对特异性结合，紫外激发发蓝色荧光。两者均可用于活细胞或固定细胞的核染色，是细胞生物学中最常用的核染料。","difficulty":2,"tags":["DAPI","Hoechst","DNA染料","活细胞染色"]},{"id":58,"topic":"细胞培养与细胞工程","type":"choice","question":"原代培养是指什么？","options":{"A":"将已建系的细胞进行传代","B":"直接从机体组织中分离细胞进行的首次培养","C":"将细胞冻存后复苏","D":"将两种细胞融合"},"answer":"B","explanation":"原代培养是从活体组织直接分离细胞后进行的初次培养。原代细胞保持了来源组织的许多特性，但体外寿命有限（有限细胞系）。传代培养是将原代细胞分散后接种至新培养瓶继续培养。","difficulty":1,"tags":["原代培养","传代培养","有限细胞系"]},{"id":59,"topic":"细胞培养与细胞工程","type":"choice","question":"细胞系（cell line）和细胞株（cell strain）的关系是？","options":{"A":"两者是完全相同的概念","B":"细胞株是从细胞系中经选择或克隆获得的特定细胞群体","C":"细胞系比细胞株更纯","D":"细胞株比细胞系更不稳定"},"answer":"B","explanation":"细胞系是原代培养经第一次传代后的细胞群体。细胞株是从细胞系中通过选择或克隆获得的具有特定性状的细胞群体。细胞株通常比细胞系更均一。HeLa细胞、CHO细胞都是著名的细胞株。","difficulty":2,"tags":["细胞系","细胞株","克隆选择","HeLa"]},{"id":60,"topic":"细胞培养与细胞工程","type":"choice","question":"接触抑制现象描述的是什么？","options":{"A":"细胞在分裂过程中相互碰撞","B":"正常细胞生长至形成单层后停止分裂","C":"免疫细胞攻击靶细胞","D":"药物抑制细胞生长"},"answer":"B","explanation":"接触抑制是正常贴壁细胞在体外培养中铺满培养皿表面形成单层后即停止分裂增殖的现象。癌细胞丧失接触抑制，可多层堆积生长，形成叠加的细胞团。接触抑制是正常细胞区别于癌细胞的重要特征之一。","difficulty":1,"tags":["接触抑制","单层","正常细胞","癌细胞"]},{"id":61,"topic":"细胞培养与细胞工程","type":"choice","question":"单克隆抗体技术的基础是什么？","options":{"A":"基因克隆技术","B":"杂交瘤技术——B淋巴细胞与骨髓瘤细胞融合","C":"PCR扩增技术","D":"DNA测序技术"},"answer":"B","explanation":"单克隆抗体通过杂交瘤技术制备：将免疫后能产生特定抗体的B淋巴细胞与永生化骨髓瘤细胞融合，筛选出既能分泌特定抗体又能无限增殖的杂交瘤细胞。每个杂交瘤克隆产生仅识别一个抗原表位的单克隆抗体。","difficulty":1,"tags":["单克隆抗体","杂交瘤","B淋巴细胞","骨髓瘤细胞"]},{"id":62,"topic":"细胞培养与细胞工程","type":"choice","question":"细胞融合实验中常用什么试剂诱导细胞膜融合？","options":{"A":"胰蛋白酶","B":"聚乙二醇(PEG)或灭活的仙台病毒","C":"EDTA","D":"DMSO"},"answer":"B","explanation":"PEG（聚乙二醇）能使细胞膜脱水、脂质分子重排，促进相邻细胞膜融合。灭活的仙台病毒也可作为融合剂（病毒包膜蛋白可促进细胞膜融合）。胰蛋白酶用于消化细胞间连接，EDTA螯合钙离子辅助消化，DMSO用于细胞冻存。","difficulty":2,"tags":["细胞融合","PEG","仙台病毒","杂交瘤"]},{"id":63,"topic":"细胞培养与细胞工程","type":"choice","question":"细胞冻存液中通常加入DMSO或甘油的主要目的是什么？","options":{"A":"提供营养","B":"防止冰晶形成损伤细胞","C":"促进细胞分裂","D":"抑制细菌生长"},"answer":"B","explanation":"DMSO（二甲亚砜）和甘油是渗透性低温保护剂，可进入细胞内置换水分，降低冰点，防止细胞内冰晶形成对细胞膜和细胞器的损伤。冻存液通常含10%DMSO+血清+培养基，采用梯度降温（-1℃/min至-80℃，然后液氮）。","difficulty":2,"tags":["细胞冻存","DMSO","低温保护剂","冰晶"]},{"id":64,"topic":"细胞培养与细胞工程","type":"choice","question":"细胞拆合实验中，去核后的细胞质体（cytoplast）与另一种细胞的核体（karyoplast）融合形成什么？","options":{"A":"杂交瘤细胞","B":"重组细胞（cybrid）","C":"原代细胞","D":"干细胞"},"answer":"B","explanation":"细胞拆合是将细胞的核与细胞质分离后再与另一种细胞的质或核重新组合。去核细胞质体与完整有核细胞或核体融合形成胞质杂种(cybrid)。经典的核移植实验（如童第周、克隆羊多莉）证明了细胞核对遗传性状的决定作用及细胞质对基因表达的影响。","difficulty":3,"tags":["细胞拆合","细胞质体","核体","胞质杂种","核移植"]},{"id":65,"topic":"细胞培养与细胞工程","type":"choice","question":"细胞培养中血清的主要作用不包括以下哪项？","options":{"A":"提供生长因子和激素","B":"提供贴壁因子和扩展因子","C":"作为抗生素抑制细菌生长","D":"提供营养物质和微量元素"},"answer":"C","explanation":"血清（常用胎牛血清FBS）富含生长因子、激素、贴壁因子（如纤连蛋白）、转运蛋白、脂类和微量元素，为细胞提供全面的营养和生长环境。血清不含抗生素，防止细菌污染需另外添加青霉素-链霉素等。","difficulty":2,"tags":["血清","生长因子","贴壁因子","培养基"]},{"id":66,"topic":"细胞培养与细胞工程","type":"choice","question":"有限细胞系与连续细胞系（永生细胞系）的根本区别是？","options":{"A":"培养温度不同","B":"有限细胞系体外传代次数有限，连续细胞系可无限传代","C":"培养基成分不同","D":"细胞颜色不同"},"answer":"B","explanation":"有限细胞系体外分裂次数有限（约50-60代，Hayflick界限），最终进入衰老。连续细胞系/永生细胞系克服了Hayflick界限，可无限增殖，通常来自肿瘤细胞或经病毒/基因转化（如激活端粒酶）。HeLa细胞是最著名的连续细胞系。","difficulty":2,"tags":["有限细胞系","连续细胞系","永生细胞系","Hayflick界限"]},{"id":67,"topic":"细胞培养与细胞工程","type":"choice","question":"在细胞工程中，基因敲除和基因敲入技术主要用于什么？","options":{"A":"杀死细胞","B":"研究特定基因的功能","C":"提高显微镜分辨率","D":"分离细胞器"},"answer":"B","explanation":"基因敲除（knockout）通过同源重组或CRISPR/Cas9技术失活特定基因，基因敲入（knockin）将外源基因整合至基因组特定位置。两者广泛用于在细胞或动物模型中研究基因功能，是细胞工程的核心技术。","difficulty":2,"tags":["基因敲除","基因敲入","基因功能","CRISPR/Cas9"]},{"id":68,"topic":"细胞培养与细胞工程","type":"truefalse","question":"原代培养的细胞通常具有有限的体外增殖次数。","answer":true,"explanation":"原代培养细胞来自活体组织，体外分裂约50-60代后进入复制性衰老(Hayflick界限)，称为有限细胞系。肿瘤细胞或转化细胞可突破此限制成为连续细胞系。","difficulty":1,"tags":["原代培养","有限细胞系","Hayflick界限"]},{"id":69,"topic":"细胞培养与细胞工程","type":"truefalse","question":"接触抑制现象是癌细胞体外培养的典型特征之一。","answer":false,"explanation":"正常细胞具有接触抑制，形成单层后停止分裂。癌细胞丧失了接触抑制能力，可多层生长形成叠加的细胞团(foci)。接触抑制丧失是癌细胞转化的标志之一。","difficulty":1,"tags":["接触抑制","癌细胞","正常细胞","转化"]},{"id":70,"topic":"细胞培养与细胞工程","type":"truefalse","question":"单克隆抗体每个克隆只识别一个特定的抗原表位。","answer":true,"explanation":"每个杂交瘤细胞克隆由单一B细胞与骨髓瘤细胞融合而来，仅分泌一种特异性抗体，识别目标抗原上唯一的一个抗原表位。多克隆抗体则包含识别同一抗原不同表位的多种抗体。","difficulty":1,"tags":["单克隆抗体","杂交瘤","抗原表位"]},{"id":71,"topic":"蛋白质互作与生物大分子动态研究","type":"choice","question":"酵母双杂交技术的基本原理是？","options":{"A":"利用酵母细胞融合","B":"将转录激活因子分成两个独立结构域，通过蛋白相互作用使其重构并激活报告基因","C":"用酵母提取蛋白质","D":"在酵母中表达荧光蛋白"},"answer":"B","explanation":"酵母双杂交将转录因子GAL4的DNA结合域(BD)与诱饵蛋白X融合，激活域(AD)与猎物蛋白Y融合。若X与Y相互作用，BD和AD靠近重构有功能的转录激活因子，驱动报告基因(如lacZ、HIS3)表达。该系统在酵母细胞核中进行。","difficulty":2,"tags":["酵母双杂交","蛋白质相互作用","转录因子","GAL4"]},{"id":72,"topic":"蛋白质互作与生物大分子动态研究","type":"choice","question":"酵母双杂交系统中，BD-X与AD-Y分别代表什么？","options":{"A":"BD-X是DNA结合域与诱饵蛋白融合，AD-Y是激活域与猎物蛋白融合","B":"BD-X是激活域融合蛋白","C":"二者都是用荧光标记的蛋白质","D":"二者都是细胞膜蛋白"},"answer":"A","explanation":"BD(DNA-binding domain)与诱饵蛋白X融合，识别并结合报告基因上游的UAS序列。AD(activation domain)与猎物蛋白Y融合。当X-Y相互作用时BD和AD靠近，AD招募转录机器启动转录。常用BD来自GAL4或LexA。","difficulty":3,"tags":["酵母双杂交","BD","AD","诱饵蛋白","猎物蛋白"]},{"id":73,"topic":"蛋白质互作与生物大分子动态研究","type":"choice","question":"免疫共沉淀（Co-IP）技术的主要用途是什么？","options":{"A":"测定蛋白质浓度","B":"检测蛋白质-蛋白质之间的相互作用","C":"合成新的蛋白质","D":"分离细胞核"},"answer":"B","explanation":"Co-IP用抗X蛋白的抗体将X蛋白及其相互作用的蛋白复合物一起沉淀下来，再用Western blot或质谱鉴定共沉淀的蛋白Y。该技术验证蛋白在生理条件下的物理相互作用。但可能漏检弱或瞬时的相互作用。","difficulty":2,"tags":["免疫共沉淀","Co-IP","蛋白质相互作用","抗体"]},{"id":74,"topic":"蛋白质互作与生物大分子动态研究","type":"choice","question":"Pull-down实验与Co-IP的主要区别在于？","options":{"A":"Pull-down采用体外纯化蛋白系统，Co-IP在细胞裂解液中进行","B":"Pull-down不需要抗体","C":"两者完全一样","D":"Co-IP不使用抗体"},"answer":"A","explanation":"Pull-down是利用GST等标签融合蛋白在体外直接检测蛋白间直接相互作用，排除了细胞环境中其他因素的干扰。Co-IP在细胞裂解液中进行，反映生理条件下蛋白复合体的组成。两者互补：Pull-down证明直接结合，Co-IP证明体内结合。","difficulty":3,"tags":["Pull-down","Co-IP","GST","体外结合","体内结合"]},{"id":75,"topic":"蛋白质互作与生物大分子动态研究","type":"choice","question":"染色质免疫沉淀（ChIP）技术主要用于研究什么？","options":{"A":"蛋白质与脂类的相互作用","B":"蛋白质与DNA在体内的结合位点","C":"RNA的二级结构","D":"细胞膜的组成"},"answer":"B","explanation":"ChIP用甲醛交联固定细胞内蛋白质-DNA复合物，超声打断DNA后，用目标蛋白（如转录因子、组蛋白修饰）的特异性抗体富集结合的DNA片段。解交联后对富集的DNA进行PCR(qPCR)或测序(ChIP-seq)分析，确定目标蛋白在基因组上的结合位点。","difficulty":2,"tags":["ChIP","染色质免疫沉淀","蛋白质-DNA相互作用","转录因子"]},{"id":76,"topic":"蛋白质互作与生物大分子动态研究","type":"choice","question":"放射自显影技术的原理是什么？","options":{"A":"用荧光激发标记分子","B":"利用放射性同位素发射的射线使感光乳胶曝光","C":"用酶催化的显色反应","D":"用金颗粒标记"},"answer":"B","explanation":"放射自显影将放射性同位素(如³H、¹⁴C、³²P、³⁵S)标记的生物分子导入细胞或组织，通过放射线使覆盖的感光乳胶中的银离子还原为金属银颗粒，经显影定影后在光镜或电镜下观察银颗粒分布，确定标记分子的位置和数量。","difficulty":2,"tags":["放射自显影","放射性同位素","感光乳胶","银颗粒"]},{"id":77,"topic":"蛋白质互作与生物大分子动态研究","type":"choice","question":"生物素-亲和素系统的广泛应用是基于什么特性？","options":{"A":"生物素和亲和素之间极高的亲和力","B":"二者都是荧光分子","C":"二者都是DNA结合蛋白","D":"它们只能在高温下结合"},"answer":"A","explanation":"生物素（维生素B7）与亲和素（avidin，来自蛋清）或链霉亲和素（streptavidin，来自链霉菌）之间的解离常数Kd约为10⁻¹⁵M，是目前已知最强的非共价相互作用之一。该系统广泛用于蛋白质纯化、免疫检测、核酸杂交等。","difficulty":2,"tags":["生物素","亲和素","链霉亲和素","高亲和力"]},{"id":78,"topic":"蛋白质互作与生物大分子动态研究","type":"choice","question":"蛋白质组学研究中最常用的核心技术是什么？","options":{"A":"普通光学显微镜","B":"质谱技术结合液相色谱","C":"PCR","D":"超速离心"},"answer":"B","explanation":"蛋白质组学大规模研究蛋白质表达、修饰和相互作用，核心技术是液相色谱(LC)串联质谱(MS/MS)。样品经酶解为肽段后经LC分离，MS/MS鉴定肽段序列，通过数据库搜索确定蛋白质身份和修饰位点。","difficulty":3,"tags":["蛋白质组学","质谱","液相色谱","MS/MS"]},{"id":79,"topic":"蛋白质互作与生物大分子动态研究","type":"truefalse","question":"酵母双杂交系统用于在体外检测蛋白质的直接相互作用。","answer":false,"explanation":"酵母双杂交在酵母细胞核内检测蛋白质相互作用，属于体内(in vivo)检测系统。虽然X-Y相互作用驱动了报告基因转录，但相互作用发生在核内环境中。体外(in vitro)检测通常用Pull-down或表面等离子体共振(SPR)。","difficulty":2,"tags":["酵母双杂交","体内检测","体外检测"]},{"id":80,"topic":"蛋白质互作与生物大分子动态研究","type":"truefalse","question":"免疫共沉淀可以检测细胞内生理条件下的蛋白-蛋白相互作用。","answer":true,"explanation":"Co-IP使用温和的非变性裂解液裂解细胞，保留了蛋白质复合体的天然构象和相互作用。通过特异性抗体沉淀目标蛋白及其相互作用的伙伴蛋白，可检测细胞内的生理性蛋白复合体。","difficulty":1,"tags":["免疫共沉淀","生理条件","蛋白质复合体"]},{"id":81,"topic":"模式生物","type":"choice","question":"以下哪个不是常用的模式生物？","options":{"A":"酿酒酵母(Saccharomyces cerevisiae)","B":"秀丽隐杆线虫(Caenorhabditis elegans)","C":"果蝇(Drosophila melanogaster)","D":"大熊猫(Ailuropoda melanoleuca)"},"answer":"D","explanation":"常用的细胞生物学模式生物包括：酿酒酵母（真核单细胞）、秀丽隐杆线虫（多细胞发育与凋亡）、黑腹果蝇（遗传发育）、斑马鱼（脊椎动物发育）、小鼠（哺乳动物模型）、拟南芥（植物模型）。大熊猫不是标准模式生物。","difficulty":1,"tags":["模式生物","酵母","线虫","果蝇","斑马鱼","小鼠"]},{"id":82,"topic":"模式生物","type":"choice","question":"酿酒酵母作为模式生物的主要优势是什么？","options":{"A":"多细胞结构","B":"基因组小、遗传操作简便、增殖快、是真核细胞","C":"可以进行光合作用","D":"与人类基因组完全相同"},"answer":"B","explanation":"酿酒酵母是单细胞真核生物，基因组约12Mb（约6200个基因），是第一个完成全基因组测序的真核生物。遗传操作简便（易于基因敲除和转化），增殖快速（约90分钟一代），是研究真核细胞基本生命过程的理想模型。","difficulty":1,"tags":["模式生物","酿酒酵母","基因组","遗传操作"]},{"id":83,"topic":"模式生物","type":"choice","question":"秀丽隐杆线虫为什么是研究细胞凋亡和发育的重要模型？","options":{"A":"其细胞数量极多无法统计","B":"其成体细胞数目固定且每个细胞的发育谱系已被完全阐明","C":"其生命周期极长","D":"它是单细胞生物"},"answer":"B","explanation":"秀丽隐杆线虫成体雌雄同体恰好有959个体细胞（雄性1031个），每个细胞的来源和分化命运都已绘制成完整的细胞谱系。其身体透明，可在光镜下直接观察活体发育过程。细胞凋亡的分子机制（ced基因）最早在线虫中发现。","difficulty":2,"tags":["秀丽隐杆线虫","细胞凋亡","细胞谱系","ced基因"]},{"id":84,"topic":"模式生物","type":"choice","question":"黑腹果蝇在遗传学发展中的核心贡献是什么？","options":{"A":"第一个被测序的动物基因组","B":"通过系统诱变发现了大量发育调控基因","C":"被用于生产胰岛素","D":"是光合作用的研究模型"},"answer":"B","explanation":"果蝇是经典遗传学模型，摩尔根通过果蝇确立了染色体遗传理论。果蝇胚胎发育中发现的同源异型基因（Hox基因）揭示了体节发育的分子机制。果蝇还具有世代短(约10天)、子代多、基因组小(~180Mb)等优势。","difficulty":2,"tags":["果蝇","遗传学","Hox基因","发育调控"]},{"id":85,"topic":"模式生物","type":"choice","question":"斑马鱼(Danio rerio)作为脊椎动物模型的独特优势是？","options":{"A":"可以飞翔","B":"胚胎透明、体外发育、可进行大规模正向遗传筛选","C":"与人类完全一样","D":"寿命极长达100年"},"answer":"B","explanation":"斑马鱼受精卵体外发育且胚胎透明，可直接在显微镜下观察脊椎动物的早期发育过程。可进行大规模正向遗传筛选（ENU诱变），世代约3-4个月，每次产卵数百枚。基因组已测序，与人类基因同源性高。","difficulty":2,"tags":["斑马鱼","胚胎透明","正向遗传筛选","脊椎动物模型"]},{"id":86,"topic":"模式生物","type":"choice","question":"小鼠(Mus musculus)作为哺乳动物模式生物不可替代的优势是？","options":{"A":"体型最大","B":"基因组与人类高度同源，可进行基因敲除小鼠构建","C":"可以飞行","D":"寿命仅几天"},"answer":"B","explanation":"小鼠是哺乳动物模型中最成功的一种，基因组大小和结构与人接近，约99%的基因有人类同源基因。基因敲除(KO)和基因敲入(KI)小鼠技术成熟（利用ES细胞同源重组或CRISPR/Cas9），是研究人类疾病和基因功能的金标准。","difficulty":2,"tags":["小鼠","基因敲除","哺乳动物模型","同源基因"]},{"id":87,"topic":"模式生物","type":"truefalse","question":"酿酒酵母是原核生物。","answer":false,"explanation":"酿酒酵母(Saccharomyces cerevisiae)属于真菌界，是真核单细胞生物。具有典型的真核细胞特征：线粒体、内质网、高尔基体、细胞核和核膜。它是研究真核细胞基本生命过程最简化的模型。原核模型生物是大肠杆菌(E.coli)。","difficulty":1,"tags":["酿酒酵母","真核生物","原核生物","大肠杆菌"]},{"id":88,"topic":"模式生物","type":"truefalse","question":"秀丽隐杆线虫是第一个完成全基因组测序的多细胞生物。","answer":true,"explanation":"秀丽隐杆线虫于1998年成为第一个完成全基因组测序的多细胞生物，基因组大小约97Mb，约20000个蛋白质编码基因。这一里程碑为系统研究多细胞生物的发育、行为、衰老等奠定了基础。","difficulty":2,"tags":["秀丽隐杆线虫","基因组测序","多细胞生物"]}],"terms":[{"id":1,"term":"分辨率（Resolution）","definition":"显微镜所能分辨的两个相邻物点之间的最小距离。光学显微镜分辨率约0.2μm，取决于光源波长和物镜数值孔径；电子显微镜分辨率可达0.2nm。","chapter":"第一章"},{"id":2,"term":"数值孔径（Numerical Aperture, NA）","definition":"描述物镜收集光锥能力的物理量，NA=n·sinα，n为介质折射率，α为镜口角的一半。NA越大，分辨率越高，是衡量物镜质量的关键参数。","chapter":"第一章"},{"id":3,"term":"相差显微镜（Phase Contrast Microscope）","definition":"利用环状光阑和相板将光通过样品不同区域的相位差转换为振幅差（明暗对比），适用于观察未经染色的透明活细胞。","chapter":"第一章"},{"id":4,"term":"共聚焦显微镜（Confocal Microscope）","definition":"在光路中加入针孔排除焦平面以外的杂散光，实现光学切片成像和三维重建的荧光显微镜。可提高图像清晰度和对比度。","chapter":"第一章"},{"id":5,"term":"绿色荧光蛋白（Green Fluorescent Protein, GFP）","definition":"源自水母的荧光蛋白，可通过基因融合方式与目标蛋白共表达，作为报告分子实现活细胞内蛋白质的定位和动态追踪。","chapter":"第一章"},{"id":6,"term":"超薄切片（Ultrathin Section）","definition":"电镜观察所需的极薄样品切片，厚度通常50-100nm，用超薄切片机和金刚石刀制备，经重金属染色后在透射电镜下观察。","chapter":"第一章"},{"id":7,"term":"负染色（Negative Staining）","definition":"用重金属盐溶液浸染样品，使重金属沉积在样品凹陷处和周围，形成暗背景中的明亮图像，适用于病毒和蛋白质复合体等颗粒状样品的电镜观察。","chapter":"第一章"},{"id":8,"term":"冷冻蚀刻（Freeze-Etching）","definition":"将样品快速冷冻后断裂，暴露生物膜脂双分子层内部结构，经铂碳投影后在透射电镜下观察膜内蛋白颗粒分布的技术。","chapter":"第一章"},{"id":9,"term":"免疫电镜（Immunoelectron Microscopy）","definition":"用胶体金颗粒标记的抗体与细胞内抗原特异性结合，在透射电镜下通过高电子密度的金颗粒在超微结构水平定位抗原分子的技术。","chapter":"第一章"},{"id":10,"term":"免疫荧光（Immunofluorescence）","definition":"用荧光染料标记的抗体特异性地识别和结合细胞内抗原，在荧光显微镜下显示目标蛋白定位的技术，分为直接法和间接法。","chapter":"第一章"},{"id":11,"term":"荧光原位杂交（FISH）","definition":"用荧光标记的核酸探针与细胞内特定DNA或RNA序列互补杂交，在荧光显微镜下定位特定核酸序列的细胞遗传学技术。","chapter":"第一章"},{"id":12,"term":"差速离心（Differential Centrifugation）","definition":"通过逐步提高离心力和时间，依次沉降不同大小和密度的细胞器或亚细胞组分的分离方法。沉淀顺序：细胞核→线粒体→微粒体。","chapter":"第一章"},{"id":13,"term":"密度梯度离心（Density Gradient Centrifugation）","definition":"在离心管中预先形成密度梯度（如蔗糖梯度），样品组分在离心过程中迁移至其浮力密度对应位置而分离的方法，纯度和分辨率高于差速离心。","chapter":"第一章"},{"id":14,"term":"原代培养（Primary Culture）","definition":"从活体组织直接分离细胞后进行的初次体外培养。原代细胞保持了来源组织的许多生物学特性，但体外增殖能力有限。","chapter":"第一章"},{"id":15,"term":"接触抑制（Contact Inhibition）","definition":"正常贴壁细胞在体外培养中生长至形成单层细胞后，细胞运动减慢、分裂停止的密度依赖性生长调控现象，癌细胞丧失此特性。","chapter":"第一章"},{"id":16,"term":"单克隆抗体（Monoclonal Antibody）","definition":"由单一B淋巴细胞与骨髓瘤细胞融合形成的杂交瘤细胞克隆所分泌的抗体，仅识别抗原上一个特定表位，具有高度特异性和均一性。","chapter":"第一章"},{"id":17,"term":"酵母双杂交（Yeast Two-Hybrid）","definition":"将转录因子拆分为BD和AD两个独立结构域，分别与诱饵蛋白和猎物蛋白融合，通过蛋白相互作用重构有功能的转录因子激活报告基因，用于在体内检测蛋白质-蛋白质相互作用。","chapter":"第一章"},{"id":18,"term":"模式生物（Model Organism）","definition":"在生物学研究中被广泛使用、具有代表性的生物种类，如酵母、线虫、果蝇、斑马鱼、小鼠等，用于揭示生命活动的基本规律。","chapter":"第一章"}],"stats":{"total":88,"choice":66,"truefalse":22,"easy":35,"mid":44,"hard":9,"terms":18}}};

// ==================== 配置 ====================
var DIFF_NAMES = {1:'简单',2:'中等',3:'困难'};
var DIFF_ICONS = {1:'⭐',2:'📖',3:'🔥'};
var SUBJECT_KEYS = ["biochemistry", "cellbiology", "biochem_ch3", "cellbio_ch2"];
var COURSES = {"biochemistry": {"name": "生物化学", "code": "338", "chapters": ["biochemistry", "biochem_ch3"]}, "cellbiology": {"name": "细胞生物学", "code": "851", "chapters": ["cellbiology", "cellbio_ch2"]}};
var CHAPTER_NAMES = {"biochemistry": "1+2 绪论+AA简介", "cellbiology": "1 绪论", "biochem_ch3": "3 pr的结构", "cellbio_ch2": "2 研究方法"};
var currentCourse = 'biochemistry';

// ==================== 状态层 ====================
var currentSubject = 'biochemistry';
var ALL_QS = [];
var ALL_TERMS = [];
var STATS = {};
var QS = [], idx = 0, answers = {}, done = {}, viewMode = 'home';
var errSet = new Set();
var bookmarkSet = new Set();

// ==================== localStorage 辅助 ====================
function lsKey(purpose) {
  return currentSubject + '_' + purpose;
}
function lsGet(purpose) {
  try { return localStorage.getItem(lsKey(purpose)); } catch(e) { return null; }
}
function lsSet(purpose, val) {
  try { localStorage.setItem(lsKey(purpose), val); } catch(e) {}
}
function lsRemove(purpose) {
  try { localStorage.removeItem(lsKey(purpose)); } catch(e) {}
}
function lsGetJson(purpose) {
  try { var r = localStorage.getItem(lsKey(purpose)); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}
function lsSetJson(purpose, obj) {
  try { localStorage.setItem(lsKey(purpose), JSON.stringify(obj)); } catch(e) {}
}

function saveErr() { lsSet('errors', JSON.stringify([...errSet])); }
function getErrCount() { return errSet.size; }
function clearErrSet() { errSet.clear(); saveErr(); }
function saveBookmarks() { lsSet('bookmarks', JSON.stringify([...bookmarkSet])); }
function getBookmarkCount() { return bookmarkSet.size; }
function getLastScore() { return lsGet('score'); }
function saveLastScore(s) { lsSet('score', s); }

// ==================== 科目切换 ====================
function loadSubjectData(key) {
  var bank = QUESTION_BANKS[key];
  ALL_QS = bank.questions.slice();
  ALL_TERMS = bank.terms.slice();
  STATS = bank.stats;
}

function switchCourse(courseKey) {
  if (courseKey === currentCourse) return;
  if (viewMode === 'quiz') saveProgress();
  saveErr(); saveBookmarks();
  currentCourse = courseKey;
  var firstCh = COURSES[courseKey].chapters[0];
  currentSubject = firstCh;
  loadSubjectData(firstCh);
  errSet = (function() { var r = lsGet('errors'); return r ? new Set(JSON.parse(r)) : new Set(); })();
  bookmarkSet = (function() { var r = lsGet('bookmarks'); return r ? new Set(JSON.parse(r)) : new Set(); })();
  QS = ALL_QS.slice(); idx = 0; answers = {}; done = {}; viewMode = 'home';
  buildChapterTabs();
  updateSubjectUI();
  
  showHome();
}

function switchChapter(chId) {
  // switchChapter
  if (chId === currentSubject && viewMode === 'home') return;
  if (viewMode === 'quiz') saveProgress();
  saveErr(); saveBookmarks();
  currentSubject = chId;
  loadSubjectData(chId);
  errSet = (function() { var r = lsGet('errors'); return r ? new Set(JSON.parse(r)) : new Set(); })();
  bookmarkSet = (function() { var r = lsGet('bookmarks'); return r ? new Set(JSON.parse(r)) : new Set(); })();
  QS = ALL_QS.slice(); idx = 0; answers = {}; done = {}; viewMode = 'home';
  updateSubjectUI();
  showHome();
}


function buildCourseTabs() {
  var h = '';
  Object.keys(COURSES).forEach(function(k) {
    var course = COURSES[k];
    h += '<button class="subject-tab' + (k === currentCourse ? ' active' : '') + '" data-course="' + k + '">' + course.name + '</button>';
  });
  document.getElementById('subjectSwitcher').innerHTML = h;
  document.querySelectorAll('.subject-tab').forEach(function(t) {
    t.addEventListener('click', function() {
      switchCourse(t.getAttribute('data-course'));
    });
  });
}
function buildChapterTabs() {
  var chapters = COURSES[currentCourse].chapters;
  var h = '';
  chapters.forEach(function(chId) {
    var name = CHAPTER_NAMES[chId] || chId;
    var cls = 'chapter-tab' + (chId === currentSubject ? ' active' : '');
    h += '<button class="' + cls + '" data-ch="' + chId + '">' + name + '</button>';
  });
  var el = document.getElementById('chapterSwitcher');
  if (el) el.innerHTML = h;
  document.querySelectorAll('.chapter-tab').forEach(function(t) {
    t.addEventListener('click', function() {
      switchChapter(t.getAttribute('data-ch'));
    });
  });
}

function updateSubjectUI() {
  var course = COURSES[currentCourse];
  var bank = QUESTION_BANKS[currentSubject];
  var chName = CHAPTER_NAMES[currentSubject] || bank.chapterLabel || '';
  document.getElementById('brandTitle').textContent = course.code + ' ' + course.name + '考研题库';
  document.getElementById('brandSub').textContent = chName;
  document.title = '湖南大学 ' + course.name + ' 考研题库';
  var tabs = document.querySelectorAll('.subject-tab');
  tabs.forEach(function(t) {
    t.classList.toggle('active', t.getAttribute('data-course') === currentCourse);
  });
  tabs = document.querySelectorAll('.chapter-tab');
  tabs.forEach(function(t) {
    t.classList.toggle('active', t.getAttribute('data-ch') === currentSubject);
  });
}

function saveProgress() {
  if (viewMode !== 'quiz' && viewMode !== 'diff') return;
  var doneIds = Object.keys(done); if (!doneIds.length) return;
  var mode = 'all';
  if (viewMode === 'diff' && QS.length && QS[0]) mode = 'diff:' + QS[0].difficulty;
  else if (QS.length !== ALL_QS.length) {
    var allErr = QS.every(function(q) { return errSet.has(q.id); });
    if (allErr) mode = 'err';
    else {
      var allChoice = QS.every(function(q) { return q.type === 'choice'; });
      if (allChoice) mode = 'choice';
      else { var allTF = QS.every(function(q) { return q.type === 'truefalse'; }); if (allTF) mode = 'truefalse'; }
    }
  }
  var p = { mode: mode, idx: idx, answers: answers, done: doneIds };
  lsSetJson('progress', p);
}

function loadProgress() {
  return lsGetJson('progress');
}

function clearProgress() {
  lsRemove('progress');
}

function resumeProgress() {
  var p = loadProgress(); if (!p) return false;
  answers = p.answers || {}; done = {};
  (p.done || []).forEach(function(id) { done[id] = true; });
  var mode = p.mode || 'all';
  if (mode === 'all') { QS = ALL_QS.slice(); viewMode = 'quiz'; }
  else if (mode === 'err') { QS = ALL_QS.filter(function(q) { return errSet.has(q.id); }); viewMode = 'quiz'; }
  else if (mode === 'choice') { QS = ALL_QS.filter(function(q) { return q.type === 'choice'; }); viewMode = 'quiz'; }
  else if (mode === 'truefalse') { QS = ALL_QS.filter(function(q) { return q.type === 'truefalse'; }); viewMode = 'quiz'; }
  else if (mode.indexOf('diff:') === 0) { var d = parseInt(mode.split(':')[1]); QS = ALL_QS.filter(function(q) { return q.difficulty === d; }); viewMode = 'diff'; }
  else { QS = ALL_QS.slice(); viewMode = 'quiz'; }
  if (!QS.length) { showHome(); return false; }
  idx = p.idx || 0; if (idx >= QS.length) idx = QS.length - 1;
  showQuizUI(); prog(); render(idx);
  return true;
}

// ==================== 辅助函数 ====================

// ==================== 自动错题收集 ====================
function autoCollectError(qid, userAnswer, correctAnswer) {
  var isCorrect = (userAnswer === correctAnswer);
  if (!isCorrect) {
    if (!errSet.has(qid)) { errSet.add(qid); saveErr(); }
  } else {
    if (errSet.has(qid)) { errSet.delete(qid); saveErr(); }
  }
}

// ==================== UI 控制 ====================
function showQuizUI() {
  document.getElementById('progWrap').style.display = 'flex';
  document.getElementById('navRow').style.display = 'flex';
}
function hideQuizUI() {
  document.getElementById('progWrap').style.display = 'none';
  document.getElementById('navRow').style.display = 'none';
}


// ==================== 渲染 ====================
var quizEl, progWrap, progBar, progText, progDiff, progModeTag, navRow, navHint, btnPrev, btnNext, btnHome;

function prog() {
  var n = Object.keys(done).length, t = QS.length;
  progBar.style.width = Math.round(n / t * 100) + '%';
  progText.textContent = n + ' / ' + t;
  if (viewMode === 'diff' && QS[0]) {
    progDiff.style.display = ''; progDiff.textContent = '🎯 ' + DIFF_NAMES[QS[0].difficulty];
  } else progDiff.style.display = 'none';
  progModeTag.style.display = 'none';
}

function nav() {
  btnPrev.disabled = (idx === 0);
  var q = QS[idx]; if (!q) return;
  var ad = q.id in done;
  if (!ad) {
    btnNext.disabled = true;
    navHint.textContent = '🔒 请先选择答案';
  } else if (idx >= QS.length - 1 && QS.every(function(q) { return q.id in done; })) {
    btnNext.disabled = false;
    navHint.textContent = '全部完成！';
  } else {
    btnNext.disabled = false;
    btnNext.textContent = '下一题 ▶';
    navHint.textContent = '';
  }
}

function render(i) {
  try {
  if (i < 0 || i >= QS.length) { showResult(); return; }
  idx = i; showQuizUI();
  var q = QS[i], sel = answers[q.id] || null, ad = q.id in done;
  var dName = DIFF_NAMES[q.difficulty], dCls = q.difficulty === 1 ? 'easy' : (q.difficulty === 3 ? 'hard' : 'mid');
  var isTF = (q.type === 'truefalse');
  var typeLabel = isTF ? '判断题' : '选择题';
  var typeCls = isTF ? 'tf' : 'choice';
  var correctAnswer = q.answer;

  var h = '<div class="card"><div class="q-head">';
  h += '<span class="q-num">第 ' + q.id + ' 题</span>';
  h += '<span class="q-type ' + typeCls + '">' + typeLabel + '</span>';
  h += '<span class="q-diff ' + dCls + '">' + DIFF_ICONS[q.difficulty] + ' ' + dName + '</span>';
  h += '<button class="err-toggle' + (bookmarkSet.has(q.id) ? ' on' : '') + '" id="errBtn">' + (bookmarkSet.has(q.id) ? '⭐ 已标记' : '☆ 标记重点') + '</button>';
  h += '</div>';
  h += '<div class="q-text">' + q.question + '</div>';
  // Tags
  if (q.tags && q.tags.length) {
    h += '<div class="q-tags">';
    q.tags.forEach(function(tag) { h += '<span class="q-tag">' + tag + '</span>'; });
    h += '</div>';
  }
  if (isTF) {
    var tCls = 'tf-btn t', fCls = 'tf-btn f';
    if (ad) {
      tCls += ' done'; fCls += ' done';
      if (correctAnswer === true) tCls += ' ok'; else fCls += ' ok';
      if (sel === true && correctAnswer !== true) tCls += ' bad';
      if (sel === false && correctAnswer !== false) fCls += ' bad';
    } else if (sel === true) tCls += ' sel-t'; else if (sel === false) fCls += ' sel-f';
    h += '<div class="tf-row"><div class="' + tCls + '" data-v="true">✅ 正确</div><div class="' + fCls + '" data-v="false">❌ 错误</div></div>';
  } else {
    var order = Object.keys(q.options);
    h += '<div class="options">';
    order.forEach(function(L) {
      var cls = 'opt';
      if (ad) {
        cls += ' done';
        if (L === correctAnswer) cls += ' ok';
        else if (L === sel && L !== correctAnswer) cls += ' bad';
      } else if (L === sel) cls += ' sel';
      h += '<div class="' + cls + '" data-l="' + L + '"><span class="opt-letter">' + L + '</span><span class="opt-label">' + q.options[L] + '</span></div>';
    });
    h += '</div>';
  }

  if (ad) h += '<div class="explain show" id="exp' + q.id + '"><strong>📖 解析：</strong>' + q.explanation + '</div>';
  else h += '<div class="explain" id="exp' + q.id + '"></div>';
  if (!ad) h += '<div class="lock-hint">🔒 选择答案后才能前进</div>';

  quizEl.innerHTML = h;

  // 事件绑定
  var eb = document.getElementById('errBtn'); if (eb) eb.addEventListener('click', function(e) { e.stopPropagation(); toggleBookmark(q.id); });
  if (isTF) {
    quizEl.querySelectorAll('.tf-btn').forEach(function(o) {
      o.addEventListener('click', function() {
        pickTF(q.id, o.getAttribute('data-v') === 'true');
      });
    });
  } else {
    quizEl.querySelectorAll('.opt').forEach(function(o) {
      o.addEventListener('click', function() {
        pick(q.id, o.getAttribute('data-l'));
      });
    });
  }
  nav(); prog();
    } catch(e) { document.getElementById('quiz').innerHTML = '<h2 style="color:red;padding:20px">Render Error: '+e.message+'</h2>'; }
}

function toggleBookmark(qid) {
  bookmarkSet.has(qid) ? bookmarkSet.delete(qid) : bookmarkSet.add(qid);
  saveBookmarks();
  var et = document.getElementById('errBtn'); if (et) {
    et.textContent = bookmarkSet.has(qid) ? '⭐ 已标记' : '☆ 标记重点';
    et.className = 'err-toggle' + (bookmarkSet.has(qid) ? ' on' : '');
  }
}

// ==================== 答案处理 ====================
function pick(qid, L) { _answer(qid, L); }
function pickTF(qid, v) { _answer(qid, v); }

function _answer(qid, val) {
  // 考试模式不允许修改答案

  var prevAnswer = answers[qid];
  answers[qid] = val;
  done[qid] = true;

  var q = QS.find(function(x) { return x.id === qid; });
  if (!q) return;

  // 自动错题收集
  autoCollectError(qid, val, q.answer);

  saveProgress();

  render(idx);
  prog(); nav();
  // 修改答案后更新导航状态
  if (prevAnswer !== undefined) {
    navHint.textContent = '✅ 答案已更新';
  }
}


// ==================== 导航 ====================
function prev() { if (idx > 0) render(idx - 1); }
function next() {
  var q = QS[idx]; if (!q) return;
  if (!(q.id in done)) return;
  if (idx >= QS.length - 1 && QS.every(function(q) { return q.id in done; })) showResult();
  else if (idx < QS.length - 1) render(idx + 1);
}

// ==================== 考试成绩 ====================
function showResult() {
  if (QS.length === 0) { alert('当前没有题目，请重新选择'); showHome(); return; }
  hideQuizUI(); viewMode = 'result';
  var cor = 0, wro = 0, una = 0;
  QS.forEach(function(q) {
    var ua = answers[q.id];
    if (ua === undefined) { una++; }
    else if (ua === q.answer) { cor++; }
    else { wro++; }
  });
  var sc = QS.length > 0 ? Math.round(cor / QS.length * 100) : 0;
  saveHistory(sc, cor, wro, una);
  saveLastScore(String(sc));
  clearProgress();
  var gd, gc;
  if (sc >= 90) { gd = '🏅 太棒了！掌握得非常扎实！'; gc = '#2D8C4A' }
  else if (sc >= 80) { gd = '👍 表现优秀！继续巩固薄弱知识点。'; gc = '#8B1A2B' }
  else if (sc >= 70) { gd = '📚 良好水平，建议针对错题强化复习。'; gc = '#C4924A' }
  else if (sc >= 60) { gd = '📖 刚刚及格，需要系统回顾本章内容。'; gc = '#E67E22' }
  else { gd = '💪 还需努力，建议重新梳理知识点后再做一遍。'; gc = '#D43D3D' }

  var bank = QUESTION_BANKS[currentSubject];
  var h = '<div class="result-card">';
  h += '<h2>📊 答题成绩</h2>';
  h += '<p style="font-size:.78rem;color:var(--grey);margin-bottom:8px">' + bank.name + ' · ' + bank.chapterLabel + '</p>';
  h += '<div class="score-circle" style="background:linear-gradient(135deg,' + gc + ',' + gc + 'dd)">' + sc + '<small>分</small></div>';
  h += '<p class="grade-text" style="color:' + gc + '">' + gd + '</p>';
  h += '<div class="stats"><span style="color:#2D8C4A">✅ 正确：<b>' + cor + '</b></span><span style="color:#D43D3D">❌ 错误：<b>' + wro + '</b></span>';
  if (una > 0) h += '<span style="color:var(--grey)">⬜ 未答：<b>' + una + '</b></span>';
  h += '</div>';
  h += '<p style="margin-top:6px;font-size:.82rem;color:var(--grey)">📌 错题已自动收录 <b style="color:var(--red)">' + getErrCount() + '</b> 题 | ⭐ 标记重点 <b style="color:var(--gold)">' + getBookmarkCount() + '</b> 题</p>';

  // 逐题回顾（可折叠）
  h += '<div class="review-list"><h3>📋 逐题回顾（点击展开）</h3>';
  QS.forEach(function(q) {
    var ua = answers[q.id], ok = ua === q.answer;
    var icon = ua !== undefined ? (ok ? '✅' : '❌') : '⬜';
    var ansLabel = q.type === 'truefalse' ? (q.answer ? '✅正确' : '❌错误') : q.answer;
    var uaL = q.type === 'truefalse' ? (ua === true ? '正确' : (ua === false ? '错误' : '')) : ua;
    h += '<details class="review-detail"><summary class="review-item">' + icon + ' <b>第' + q.id + '题</b> ';
    if (ua !== undefined && !ok) h += '<span style="color:#D43D3D">（你：' + uaL + '，正确：' + ansLabel + '）</span>';
    else if (ua !== undefined && ok) h += '<span style="color:#2D8C4A">（' + uaL + '）</span>';
    h += '</summary><div class="review-body">';
    h += '<p><b>题目：</b>' + q.question + '</p>';
    if (q.type === 'choice') {
      Object.keys(q.options).forEach(function(L) {
        h += '<p>' + (L === q.answer ? '✅' : '  ') + ' ' + L + '. ' + q.options[L] + '</p>';
      });
    } else {
      h += '<p>正确答案：' + (q.answer ? '✅ 正确' : '❌ 错误') + '</p>';

    }
    h += '<p><b>解析：</b>' + q.explanation + '</p>';
    h += '</div></details>';
  });
  h += '</div>';

  h += '<div class="result-actions">';
  h += '<button class="btn btn-go" id="btnRetry">🔄 重新做题</button>';
  if (wro > 0) h += '<button class="btn btn-outline-danger" id="btnWrong">📝 只做错题</button>';
  h += '<button class="btn btn-ghost" id="btnHome2">🏠 返回首页</button>';
  h += '</div></div>';
  quizEl.innerHTML = h;
  document.getElementById('btnRetry').addEventListener('click', retrySame);
  var bw = document.getElementById('btnWrong'); if (bw) bw.addEventListener('click', doWrongOnly);
  document.getElementById('btnHome2').addEventListener('click', showHome);

}

function retrySame() { idx = 0; answers = {}; done = {}; quizEl.innerHTML = ''; showQuizUI(); prog(); render(0); }
function doWrongOnly() {
  var wl = QS.filter(function(q) { return (q.id in done) && answers[q.id] !== q.answer; });
  if (!wl.length) { alert('没有错题！🎉'); return; }
  QS = wl; viewMode = 'quiz'; idx = 0; answers = {}; done = {}; showQuizUI(); prog(); render(0);
}

// ==================== 历史记录 ====================
function saveHistory(sc, cor, wro, una) {
  var records = lsGetJson('history') || [];
  var timeUsed = 0;
  records.unshift({
    id: Date.now(),
    date: new Date().toISOString(),
    subject: currentSubject,
    subjectName: QUESTION_BANKS[currentSubject].name,
    mode: 'practice',
    total: QS.length,
    correct: cor,
    wrong: wro,
    unanswered: una,
    score: sc,
    timeUsed: timeUsed
  });
  // 只保留最近50条
  if (records.length > 50) records = records.slice(0, 50);
  lsSetJson('history', records);
}

function showHistory() {
  hideQuizUI(); viewMode = 'history';
  var records = lsGetJson('history') || [];
  var h = '<div class="home-card"><h2>📋 历史记录</h2>';

        row.style.display = (subj === 'all' || row.getAttribute('data-subj') === subj) ? '' : 'none';
      });

// ==================== 首页 ====================

    var lce = document.getElementById('linkClearErr'); if (lce) lce.addEventListener('click', function() { if (confirm('确定清空错题集？')) { clearErrSet(); var t=document.createElement('div'); t.className='toast'; t.textContent='错题集已清空'; t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:24px;font-size:.85rem;font-weight:600;z-index:9999'; document.body.appendChild(t); setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(function(){t.remove()},300)},1500); showHome(); } });

function checkResumeQuiz(callback) {
  var prog = loadProgress();
  if (prog && prog.done && prog.done.length > 0) {
    var msg = '上次练习未完成（已完成' + prog.done.length + '题），是否继续？\n\n点"确定"继续上次 | 点"取消"重新开始';
    if (confirm(msg)) {
      resumeProgress();
      return;
    }
  }
  clearProgress();
  callback();
}

function startQuiz() { viewMode = 'quiz'; idx = 0; answers = {}; done = {}; showQuizUI(); prog(); render(0); }
function startErr() {
  if (errSet.size === 0) { alert('错题集为空，答错题目会自动收录！'); return; }

}

document.addEventListener('keydown', function(e) {
  if (navRow.style.display === 'none') return;
  var q = QS[idx]; if (!q) return;
  if (q.type === 'truefalse') { if (e.key === '1' || e.key === 't') { e.preventDefault(); pickTF(q.id, true); } if (e.key === '2' || e.key === 'f') { e.preventDefault(); pickTF(q.id, false); } }
  else { var km = {'1':'A','2':'B','3':'C','4':'D','a':'A','b':'B','c':'C','d':'D'}; if (e.key in km) { e.preventDefault(); pick(q.id, km[e.key]); } }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); next(); }
  if (e.key === 'Enter') { e.preventDefault(); next(); }
  if (e.key === 'Escape' || e.key === 'h') { e.preventDefault(); showHome(); }
});

var tx = 0, ty = 0;
document.addEventListener('touchstart', function(e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
document.addEventListener('touchend', function(e) {
  if (navRow.style.display === 'none') return;
  var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { if (dx < -30) next(); else if (dx > 30) prev(); }
});

// ==================== 旧数据迁移 ====================
function migrateOldData() {
  var migrations = [
    { old: 'biochem_err_v1', newSubj: 'biochemistry', purpose: 'errors' },
    { old: 'biochem_score_v1', newSubj: 'biochemistry', purpose: 'score' },
    { old: 'cellbio_err_v2', newSubj: 'cellbiology', purpose: 'errors' },
    { old: 'cellbio_score_v2', newSubj: 'cellbiology', purpose: 'score' },
  ];
  migrations.forEach(function(m) {
    try {
      var oldVal = localStorage.getItem(m.old);
      if (oldVal !== null) {
        var newKey = m.newSubj + '_' + m.purpose;
        if (!localStorage.getItem(newKey)) {
          localStorage.setItem(newKey, oldVal);
        }
        localStorage.removeItem(m.old);
      }
    } catch(e) {}
  });
  // 清理旧进度数据
  try { localStorage.removeItem('biochem_progress_v1'); } catch(e) {}
  try { localStorage.removeItem('cellbio_progress_v1'); } catch(e) {}
}

// ==================== PWA 支持 ====================
// 1. Canvas 生成图标
function generateIcon() {
  try {
    var size = 192;
    var canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    var ctx = canvas.getContext('2d');
    // 红色背景
    ctx.fillStyle = '#8B1A2B';
    ctx.beginPath(); ctx.arc(size/2, size/2, size/2, 0, Math.PI*2); ctx.fill();
    // 白色文字
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 72px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('湖大', size/2, size/2);
    return canvas.toDataURL('image/png');
  } catch(e) { return null; }
}

// 2. Manifest Blob URL
var iconDataUrl = generateIcon();
function setupManifest() {
  try {
    var manifest = {
      name: '湖南大学考研题库',
      short_name: '考研题库',
      start_url: './',
      display: 'standalone',
      background_color: '#F5F0EB',
      theme_color: '#8B1A2B',
      icons: [{
        src: iconDataUrl || '',
        sizes: '192x192',
        type: 'image/png'
      }]
    };
    var blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    var url = URL.createObjectURL(blob);
    document.getElementById('manifestLink').href = url;
    if (iconDataUrl) {
      document.getElementById('appleTouchIcon').href = iconDataUrl;
    }
  } catch(e) {}
}

// 3. Service Worker (Cache-First)
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    var CACHE_NAME = 'huda-quiz-v1';
    var swCode = [
      'var CACHE_NAME = "' + CACHE_NAME + '";',
      'self.addEventListener("install", function(e) {',
      '  e.waitUntil(self.skipWaiting());',
      '});',
      'self.addEventListener("activate", function(e) {',
      '  e.waitUntil(caches.keys().then(function(keys) {',
      '    return Promise.all(keys.filter(function(k) { return k !== CACHE_NAME; }).map(function(k) { return caches.delete(k); }));',
      '  }).then(function() { return self.clients.claim(); }));',
      '});',
      'self.addEventListener("fetch", function(e) {',
      '  if (e.request.method !== "GET") return;',
      '  e.respondWith(',
      '    caches.match(e.request).then(function(cached) {',
      '      if (cached) return cached;',
      '      return fetch(e.request).then(function(response) {',
      '        if (response && response.status === 200 && response.type === "basic") {',
      '          var clone = response.clone();',
      '          caches.open(CACHE_NAME).then(function(cache) { cache.put(e.request, clone); });',
      '        }',
      '        return response;',
      '      }).catch(function() {',
      '        return new Response("离线模式 - 资源未缓存", {status:503});',
      '      });',
      '    })',
      '  );',
      '});'
    ].join('\n');
    var swBlob = new Blob([swCode], {type: 'application/javascript'});
    var swUrl = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl).then(function(reg) {
      // 注册成功后立即缓存当前页面
      if (reg.installing) {
        reg.installing.addEventListener('statechange', function() {
          if (this.state === 'activated') cacheCurrentPage();
        });
      } else if (reg.active) {
        cacheCurrentPage();
      }
    }).catch(function(e) {
      // 静默降级
    });
  } catch(e) {}
}

function cacheCurrentPage() {
  try {
    if ('caches' in window) {
      caches.open('huda-quiz-v1').then(function(cache) {
        cache.add(window.location.href).catch(function() {});
      });
    }
  } catch(e) {}
}
