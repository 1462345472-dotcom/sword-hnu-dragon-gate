<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8B1A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="考研题库">
<link rel="manifest" id="manifestLink">
<link rel="apple-touch-icon" id="appleTouchIcon">
<title>湖南大学考研题库</title>
<style>:root{
  --red:#8B1A2B;--red2:#A01E32;--red-light:#FDF0F2;
  --gold:#C4924A;--gold-light:#FFF8F0;
  --green:#2D8C4A;--green-light:#EDF8F0;
  --red-wrong:#D43D3D;--red-wrong-light:#FFF5F5;
  --bg:#F5F0EB;--card:#FFFCF9;--text:#1E1414;--grey:#8C7A6B;
  --border:#E8DDD3;--border2:#DDD0C2;
  --radius:16px;--radius-sm:12px;--radius-xs:8px;--touch:48px;
  --safe-bottom:env(safe-area-inset-bottom,12px);
  --shadow-sm:0 1px 3px rgba(0,0,0,.04);
  --shadow-md:0 4px 20px rgba(0,0,0,.06);
  --shadow-lg:0 8px 36px rgba(0,0,0,.1);
  --t:0.2s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  background:linear-gradient(175deg,#F5F0EB 0%,#EDE4D8 50%,#E8DDD3 100%);
  background-attachment:fixed;color:var(--text);min-height:100vh;line-height:1.7;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}



/* 卡片入场动画 */

.container{max-width:860px;margin:0 auto;padding:clamp(10px,3vw,24px) clamp(8px,3vw,20px) calc(110px + var(--safe-bottom))}

/* ====== Brand ====== */
.brand{
  background:linear-gradient(160deg,#5C0D18 0%,#6B101D 20%,#8B1A2B 50%,#A01E32 80%,#8B1A2B 100%);
  color:#fff;border-radius:var(--radius);padding:clamp(28px,6vw,48px) clamp(16px,3vw,28px);
  margin-bottom:clamp(10px,2vw,16px);box-shadow:0 8px 36px rgba(107,16,29,.3);
  position:relative;overflow:hidden;text-align:center;
}
.brand::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(200px,50vw);height:min(200px,50vw);background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="none" stroke="rgba(196,146,74,.08)" stroke-width="2"/></svg>') center/contain no-repeat;pointer-events:none;z-index:0}
.brand::after{content:'';position:absolute;bottom:-30px;left:20%;width:200px;height:60px;background:rgba(255,255,255,.02);border-radius:50%;pointer-events:none}
.brand-top{display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;z-index:1}
.emblem{width:clamp(100px,25vw,130px);height:clamp(100px,25vw,130px);border-radius:50%;flex-shrink:0;box-shadow:0 6px 30px rgba(0,0,0,.35),0 0 0 5px rgba(255,255,255,.12);object-fit:contain;background:#fff;padding:5px;transition:transform var(--t);}
.brand-text{text-align:center}
.brand-title{font-size:clamp(1.4rem,4vw,1.9rem);font-weight:800;line-height:1.3;letter-spacing:2px;margin-top:2px}
.brand-slogan{text-align:center;font-size:.85rem;font-weight:700;font-style:italic;color:var(--gold);letter-spacing:2.5px;text-shadow:0 0 16px rgba(196,146,74,.35);margin-top:4px}
.brand-sub{font-size:clamp(.7rem,1.8vw,.8rem);opacity:.7;margin-top:2px}
.brand-motto{text-align:center;font-size:clamp(.78rem,2vw,.88rem);font-weight:600;letter-spacing:4px;opacity:.85;margin-top:4px;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
.brand-motto span{margin:0 10px;opacity:.45;transition:opacity var(--t)}
.brand-motto:hover span{opacity:.65}

/* ====== 科目切换 ====== */
.subject-switcher,.chapter-switcher{display:flex;gap:6px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.subject-tab:active{transform:scale(.94)}
.subject-tab{padding:8px 24px;border-radius:22px;border:1.5px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.8);font-size:.8rem;font-weight:600;cursor:pointer;transition:all var(--t);min-height:38px;white-space:nowrap;-webkit-tap-highlight-color:transparent;user-select:none;letter-spacing:.5px}
.subject-tab.active{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.8);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.chapter-tab{padding:5px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:transparent;color:rgba(255,255,255,.7);font-size:.72rem;font-weight:500;cursor:pointer;transition:all var(--t);min-height:30px;white-space:nowrap;-webkit-tap-highlight-color:transparent;user-select:none}
.chapter-tab.active{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5);color:#fff;font-weight:600}
.chapter-tab:active{transform:scale(.94)}
.chapter-tab.placeholder{opacity:.5;border-style:dashed}


/* ====== 进度条 ====== */
.progress-wrap{background:var(--card);border-radius:var(--radius);padding:clamp(8px,2vw,12px) clamp(14px,2vw,20px);margin-bottom:clamp(12px,3vw,18px);box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--border);animation:fadeIn .3s ease}
.progress-outer{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;min-width:80px}
.progress-inner{height:100%;background:linear-gradient(90deg,var(--red),var(--red2));border-radius:3px;transition:width .45s cubic-bezier(0.4,0,0.2,1)}
.progress-text{font-weight:700;font-size:clamp(.78rem,2vw,.88rem);color:var(--red);white-space:nowrap}
.progress-tag{font-size:.7rem;background:var(--red-light);color:var(--red);padding:4px 12px;border-radius:14px;font-weight:600;letter-spacing:.3px}

/* ====== 题目卡片 ====== */
.card{background:var(--card);border-radius:var(--radius);padding:clamp(20px,3vw,32px) clamp(16px,3vw,28px) clamp(18px,3vw,28px);margin-bottom:clamp(12px,2vw,16px);box-shadow:var(--shadow-md);border:1px solid var(--border);transition:all var(--t);animation:fadeIn .25s ease}
.card:active{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.q-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.q-num{font-size:.8rem;font-weight:700;color:var(--red);letter-spacing:.5px;background:var(--red-light);padding:4px 12px;border-radius:14px}
.q-type{font-size:.7rem;padding:3px 10px;border-radius:12px;font-weight:700;letter-spacing:.3px}
.q-type.choice{background:var(--red-light);color:var(--red)}
.q-type.tf{background:#F0F0FF;color:#4A4AC4}
.q-diff{font-size:.7rem;padding:4px 12px;border-radius:14px;font-weight:600;letter-spacing:.3px}
.q-diff.easy{background:var(--green-light);color:#1A5C30}
.q-diff.mid{background:var(--gold-light);color:#8B6914}
.q-diff.hard{background:var(--red-wrong-light);color:#922B21}
.q-text{font-size:clamp(.98rem,2.2vw,1.15rem);font-weight:600;margin-bottom:clamp(16px,3vw,22px);line-height:1.85;color:var(--text)}
.q-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.q-tag{font-size:.68rem;padding:3px 10px;border-radius:12px;background:var(--bg);color:var(--grey);font-weight:500;border:1px solid var(--border)}
.err-toggle{font-size:.78rem;padding:6px 14px;border-radius:16px;border:1.5px solid var(--border2);cursor:pointer;font-weight:600;transition:all var(--t);background:var(--card);margin-left:auto;-webkit-tap-highlight-color:transparent;user-select:none;white-space:nowrap}
.err-toggle:hover{border-color:var(--red);background:var(--red-light)}
.err-toggle.on{background:var(--red-wrong-light);border-color:#E88;color:var(--red-wrong)}
.err-toggle:active{transform:scale(.94)}

/* ====== 选项 ====== */
.options{display:flex;flex-direction:column;gap:clamp(8px,1.5vw,10px)}
.opt{display:flex;align-items:center;padding:clamp(13px,2vw,16px) clamp(14px,2vw,20px);border:2px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all var(--t);font-size:clamp(.88rem,2vw,1rem);user-select:none;min-height:var(--touch);-webkit-tap-highlight-color:transparent;background:var(--card);position:relative;overflow:hidden}
.opt:hover{border-color:var(--red);background:var(--bg);transform:translateX(2px)}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--red);background:var(--red-light);box-shadow:0 0 0 1px var(--red)}
.opt.ok{border-color:var(--green);background:var(--green-light);color:#1A5C30;box-shadow:0 0 0 1px var(--green)}
.opt.ok::after{content:'✓';position:absolute;right:14px;font-weight:800;font-size:1rem;color:var(--green)}
.opt.bad{border-color:var(--red-wrong);background:var(--red-wrong-light);color:#922B21;box-shadow:0 0 0 1px var(--red-wrong)}
.opt.bad::after{content:'✗';position:absolute;right:14px;font-weight:800;font-size:1rem;color:var(--red-wrong)}
.opt.done{pointer-events:none}
.opt-letter{width:clamp(30px,6vw,36px);height:clamp(30px,6vw,36px);min-width:clamp(30px,6vw,36px);border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(.8rem,2vw,.88rem);margin-right:clamp(10px,2vw,14px);transition:all var(--t);flex-shrink:0;color:#777}
.opt.sel .opt-letter{background:var(--red);color:#fff;transform:scale(1.1)}
.opt.ok .opt-letter{background:var(--green);color:#fff;transform:scale(1.1)}
.opt.bad .opt-letter{background:var(--red-wrong);color:#fff;transform:scale(1.1)}
.opt-label{flex:1;min-width:0;padding-right:24px}

/* ====== 判断题 ====== */
.tf-row{display:flex;gap:clamp(12px,2vw,16px)}
.tf-btn{flex:1;padding:clamp(16px,3vw,20px);border-radius:var(--radius-sm);cursor:pointer;font-weight:700;font-size:clamp(.98rem,2vw,1.1rem);text-align:center;transition:all var(--t);border:2px solid var(--border);background:var(--card);-webkit-tap-highlight-color:transparent;user-select:none}
.tf-btn:hover{background:var(--bg)}
.tf-btn:active{transform:scale(.97)}
.tf-btn.t{color:var(--green)}
.tf-btn.t:hover{border-color:var(--green);background:var(--green-light)}
.tf-btn.f{color:var(--red-wrong)}
.tf-btn.f:hover{border-color:var(--red-wrong);background:var(--red-wrong-light)}
.tf-btn.sel-t{border-color:var(--green);background:var(--green-light);box-shadow:0 0 0 2px var(--green)}
.tf-btn.sel-f{border-color:var(--red-wrong);background:var(--red-wrong-light);box-shadow:0 0 0 2px var(--red-wrong)}
.tf-btn.ok{border-color:var(--green);background:var(--green-light);color:#1A5C30}
.tf-btn.bad{border-color:var(--red-wrong);background:var(--red-wrong-light);color:#922B21}
.tf-btn.done{pointer-events:none}

/* ====== 解析 ====== */
.explain{margin-top:clamp(14px,2vw,18px);padding:clamp(14px,2vw,18px) clamp(16px,2vw,20px);background:var(--gold-light);border-left:4px solid var(--gold);border-radius:0 var(--radius-xs) var(--radius-xs) 0;font-size:clamp(.84rem,1.8vw,.92rem);color:#6B4C08;line-height:1.8;display:none;animation:fadeIn .35s ease}
.explain.show{display:block}
.lock-hint{text-align:center;font-size:.78rem;color:var(--grey);margin-top:8px;display:flex;align-items:center;justify-content:center;gap:4px}

/* ====== 导航 ====== */
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:clamp(10px,2vw,16px);gap:10px}
.btn{padding:clamp(11px,2vw,14px) clamp(18px,3vw,26px);border:none;border-radius:var(--radius-sm);font-size:clamp(.84rem,2vw,.95rem);font-weight:700;cursor:pointer;transition:all var(--t);white-space:nowrap;min-height:var(--touch);-webkit-tap-highlight-color:transparent;letter-spacing:.3px;position:relative;overflow:hidden}
.btn:active{transform:scale(.95)}
.btn::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0);transition:background var(--t)}
.btn:active::after{background:rgba(255,255,255,.15)}
.btn-go{background:var(--red);color:#fff;box-shadow:0 4px 16px rgba(139,26,43,.3)}
.btn-go:hover{background:var(--red2);transform:translateY(-1px);box-shadow:0 6px 24px rgba(139,26,43,.4)}
.btn-go:disabled{background:#D4B8BC;cursor:not-allowed;box-shadow:none;color:#fff;transform:none}
.btn-ghost{background:var(--card);color:var(--red);border:2px solid var(--red)}
.btn-ghost:hover{background:var(--red-light)}
.btn-ghost:disabled{border-color:var(--border2);color:var(--border2);cursor:not-allowed}
.btn-sm{padding:8px 16px;font-size:.8rem;min-height:38px;border-radius:22px}
.btn-outline-danger{background:var(--card);color:var(--red-wrong);border:2px solid var(--red-wrong)}
.btn-outline-danger:hover{background:var(--red-wrong-light)}
.btn-skip{background:var(--card);color:var(--grey);border:1.5px dashed var(--border2);width:100%;margin-top:12px}
.btn-skip:hover{background:var(--bg);border-color:var(--gold);color:var(--gold)}
.nav-hint{font-size:clamp(.72rem,1.6vw,.82rem);color:var(--grey);text-align:center;flex:1;font-weight:500}

/* ====== 移动端底部导航 ====== */
@media (max-width:767px){
  .nav-row{position:fixed;bottom:0;left:0;right:0;background:rgba(255,252,249,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:12px 12px calc(12px + var(--safe-bottom));box-shadow:0 -4px 24px rgba(0,0,0,.1);z-index:100;margin-top:0;border-top:1px solid var(--border)}
  .nav-hint{display:none}
  .btn{flex:1;text-align:center}
  .container{padding-bottom:calc(120px + var(--safe-bottom))}
}

/* ====== 首页 ====== */
.home-card{background:var(--card);border-radius:var(--radius);padding:clamp(22px,3vw,36px);box-shadow:var(--shadow-md);text-align:center;border:1px solid var(--border);animation:fadeIn .3s ease}
.home-wrap{position:relative}
.home-wrap::before,.home-wrap::after{content:'';display:block;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.25;margin:10px 0;border-radius:1px}
.home-stats{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.stat-chip{background:var(--card);border-radius:var(--radius-sm);padding:14px 20px;font-weight:700;font-size:.85rem;min-width:80px;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:all var(--t)}
.stat-chip:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-chip b{color:var(--red);font-size:1.3rem}
.menu-title{font-size:clamp(1rem,2.5vw,1.2rem);font-weight:800;margin-bottom:22px;color:var(--red);letter-spacing:.5px}

/* ====== 统计三列 ====== */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.stats-card{background:var(--card);border-radius:var(--radius-sm);padding:18px 12px;text-align:center;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:all var(--t);position:relative;overflow:hidden}
.stats-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stats-card:active{transform:scale(.97)}
.stats-num{font-size:30px;font-weight:800;color:var(--red);line-height:1.15;letter-spacing:-1px}
.stats-label{font-size:12px;color:var(--grey);margin-top:4px;font-weight:500}

/* ====== 快捷胶囊 ====== */
.quick-row{display:flex;gap:12px;margin-bottom:18px}
.quick-pill{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:26px;font-weight:700;font-size:.86rem;cursor:pointer;transition:all var(--t);text-align:center;min-height:50px;-webkit-tap-highlight-color:transparent;user-select:none;letter-spacing:.3px}
.quick-pill:active{transform:scale(.95)}
.quick-pill.err{background:var(--red-light);color:var(--red);border:2px solid var(--red)}
.quick-pill.err:hover{background:#fde8ea;box-shadow:0 4px 16px rgba(139,26,43,.15)}
.quick-pill.bm{background:var(--gold-light);color:#8B6914;border:2px solid var(--gold)}
.quick-pill.bm:hover{background:#fff3db;box-shadow:0 4px 16px rgba(196,146,74,.15)}
.quick-guide{text-align:center;font-size:.74rem;color:var(--gold);margin-bottom:12px;font-weight:600;letter-spacing:.5px}

/* ====== 2x2题型卡片 ====== */
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.type-card{background:var(--card);border-radius:var(--radius);padding:20px 16px;border:2px solid var(--border);cursor:pointer;transition:all var(--t);position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;box-shadow:var(--shadow-sm)}
.type-card:hover,.type-card:active{border-color:var(--red);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
@media (min-width:768px){.type-card:hover{border-color:var(--red);transform:translateY(-3px);box-shadow:var(--shadow-lg)}}
.type-icon{font-size:2rem;margin-bottom:8px;transition:transform var(--t)}
.type-card:hover .type-icon{transform:scale(1.1)}
.type-label{font-weight:800;font-size:.94rem;margin-bottom:4px;letter-spacing:.3px}
.type-sub{font-size:.7rem;color:var(--grey);margin-bottom:12px}
.type-bar-wrap{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:8px}
.type-bar-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--red2));border-radius:3px;transition:width .6s cubic-bezier(0.4,0,0.2,1)}
.type-meta{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;color:var(--grey)}
.type-meta .right{color:var(--red);font-weight:700}

/* ====== 底部 ====== */
.home-footer{text-align:center;margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}
.home-footer .motto{font-size:.84rem;color:var(--gold);letter-spacing:2.5px;font-weight:600;margin-bottom:10px;text-shadow:0 0 12px rgba(196,146,74,.2)}
.home-footer .links{font-size:.76rem;color:var(--grey)}
.home-footer .links span{cursor:pointer;transition:color var(--t);padding:4px 8px}
.home-footer .links span:hover{color:var(--red)}

/* ====== 成绩页 ====== */
.result-card{text-align:center;animation:fadeIn .4s ease}
.result-card h2{font-size:clamp(1.2rem,3vw,1.5rem);color:var(--red);margin-bottom:18px;letter-spacing:.5px}
.score-circle{width:clamp(110px,25vw,150px);height:clamp(110px,25vw,150px);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;margin:0 auto 14px;color:#fff;font-size:clamp(2.4rem,6vw,3.4rem);font-weight:800;box-shadow:0 10px 40px rgba(0,0,0,.18);animation:scaleIn .5s cubic-bezier(0.34,1.56,0.64,1)}
.score-circle small{font-size:.8rem;font-weight:500;opacity:.85}
.grade-text{font-size:clamp(.92rem,2.2vw,1.08rem);font-weight:700;margin-bottom:18px;letter-spacing:.3px}
.stats{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.stats span{font-weight:600;font-size:.9rem}
.review-list{text-align:left;margin:18px 0}
.review-list h3{text-align:center;margin-bottom:12px;font-size:1rem;color:var(--text)}
.review-detail summary{list-style:none;cursor:pointer;padding:12px 16px;background:var(--bg);border-radius:var(--radius-sm);margin-bottom:8px;font-size:.88rem;transition:all var(--t);outline:none;border:1px solid transparent}
.review-detail summary:hover{background:var(--border);border-color:var(--red)}
.review-detail summary::before{content:'▶';font-size:.65rem;margin-right:8px;transition:transform var(--t);display:inline-block}
.review-detail[open] summary::before{transform:rotate(90deg)}
.review-detail[open] summary{background:var(--red-light);border-color:var(--red);font-weight:700}
.review-body{padding:14px 18px;background:var(--gold-light);border-left:4px solid var(--gold);border-radius:0 var(--radius-xs) var(--radius-xs) 0;margin:0 0 10px 14px;font-size:.84rem;line-height:1.75;color:#6B4C08;animation:fadeIn .3s ease}
.review-body p{margin-bottom:5px}
.result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}

/* ====== 名词解释 ====== */
.glossary-card{animation:fadeIn .3s ease}
.glossary-card h2{font-size:clamp(1.15rem,2.5vw,1.35rem);color:var(--red);text-align:center;margin-bottom:10px;letter-spacing:.5px}
.glossary-chapter{text-align:center;font-size:.82rem;color:var(--grey);margin-bottom:22px}
.term-block{margin-bottom:16px;padding:16px 18px;background:var(--bg);border-radius:var(--radius-sm);border-left:4px solid var(--red);transition:all var(--t);box-shadow:var(--shadow-sm)}
.term-block:hover{box-shadow:var(--shadow-md);transform:translateX(2px)}
.term-name{font-weight:800;font-size:.94rem;margin-bottom:6px;color:var(--red);letter-spacing:.3px}
.term-def{font-size:.84rem;line-height:1.75;color:var(--text)}

/* ====== 考试模式 ====== */

/* ====== 历史记录 ====== */
.history-table{width:100%;border-collapse:collapse;font-size:.84rem;margin:18px 0}
.history-table th,.history-table td{padding:12px 10px;border-bottom:1px solid var(--border);text-align:center}
.history-table th{color:var(--red);font-weight:700;font-size:.76rem;text-transform:uppercase;letter-spacing:.8px;background:var(--bg)}
.history-table tbody tr{transition:all var(--t)}
.history-table tbody tr:nth-child(even){background:var(--bg)}
.history-table tbody tr:hover{background:var(--red-light)}
.history-table tbody tr:active{background:var(--border)}
.filter-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}

/* ====== 错题/标记提示条 ====== */

/* ====== 难度子面板 ====== */

/* ====== PWA提示 ====== */

/* ====== 动画 ====== */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

/* ====== 桌面增强 ====== */
@media (min-width:768px){
  .opt:hover{background:var(--bg);border-color:var(--red);transform:translateX(3px)}
  .tf-btn:hover{background:var(--bg)}
  .tf-btn.t:hover{background:var(--green-light);border-color:var(--green)}
  .tf-btn.f:hover{background:var(--red-wrong-light);border-color:var(--red-wrong)}
  .btn-go:hover{background:var(--red2);transform:translateY(-2px);box-shadow:0 6px 24px rgba(139,26,43,.4)}
  .btn-ghost:hover{background:var(--red-light)}
  .btn-outline-danger:hover{background:var(--red-wrong-light)}
  .nav-row{position:static;box-shadow:none;background:transparent;padding:0;border-top:none}
  .container{padding-bottom:40px}
}

/* ====== 键盘提示 ====== */

var QUESTION_BANKS = {"biochemistry":{"key":"biochemistry","name":"生物化学","code":"338","chapterLabel":"1+2 绪论+AA简介","questions":[{"id":1,"type":"choice","question":"生物化学发展的三个阶段不包括以下哪一项？","options":{"A":"静态阶段","B":"动态阶段","C":"现代阶段（分子生物学阶段）","D":"信息阶段"},"answer":"D","explanation":"生物化学发展的三大阶段为：静态阶段（酶、维生素和激素的发现等）、动态阶段（多种代谢途径的确定，呼吸、光合作用的深入研究等）、现代阶段（DNA结构、中心法则、操纵子学说、DNA重组技术、RNA具有酶的功能等）。「信息阶段」不是标准表述。","difficulty":1,"tags":["核酸化学","代谢总论","分子生物学","酶与催化"]},{"id":2,"type":"choice","question":"世界上第一个获得结晶酶（脲酶）并证实其为蛋白质的科学家是？","options":{"A":"Sanger（桑格）","B":"J.B. Summer（萨姆纳）","C":"Watson（沃森）","D":"Crick（克里克）"},"answer":"B","explanation":"J.B. Summer（萨姆纳）于1926年获得了世界上第一个结晶的酶——脲酶，并证实它是一种蛋白质。这是生物化学史上的里程碑事件。","difficulty":1,"tags":["蛋白质技术","酶与催化"]},{"id":3,"type":"choice","question":"Sanger（桑格）于1955年确定了哪种蛋白质的化学结构，并于1958年获得诺贝尔化学奖？","options":{"A":"人胰岛素","B":"牛胰岛素","C":"血红蛋白","D":"肌红蛋白"},"answer":"B","explanation":"Sanger（桑格）在1955年确定了牛胰岛素的化学结构（氨基酸序列），并因此于1958年获得诺贝尔化学奖。这是第一个被测定一级结构的蛋白质。","difficulty":1,"tags":["蛋白质结构","蛋白质技术"]},{"id":4,"type":"choice","question":"我国生物化学学科的开创者是？","options":{"A":"吴宪","B":"王应睐","C":"汤佩松","D":"邹承鲁"},"answer":"A","explanation":"吴宪开创了我国的生化科学。王应睐是我国生物化学奠基人之一，创办了上海生物化学研究所。注意区分：吴宪是「开创者」，王应睐是「奠基人之一」。","difficulty":2,"tags":["综合"]},{"id":5,"type":"choice","question":"我国于1965年在世界上首次人工合成的蛋白质是？","options":{"A":"人胰岛素","B":"牛胰岛素","C":"结晶牛胰岛素","D":"酵母丙氨酸转移核糖核酸"},"answer":"C","explanation":"1965年，中国科学院生物化学研究所、有机化学研究所和北京大学化学系协作，在世界上首次人工合成了结晶牛胰岛素。1983年又合成了酵母丙氨酸转移核糖核酸。","difficulty":1,"tags":["糖类与脂类","蛋白质技术","代谢总论","核酸化学"]},{"id":6,"type":"choice","question":"关于构型（Configuration）和构象（Conformation），以下说法正确的是？","options":{"A":"构型的改变不需要共价键的断裂","B":"构象的改变必须伴随共价键的断裂和重新形成","C":"一种构象改变为另一种构象时，不要求共价键的断裂和重新形成","D":"构型和构象是同一概念的不同表述"},"answer":"C","explanation":"构象的改变不要求共价键的断裂和重新形成，通过单键的自由旋转即可实现。而构型的改变必须伴随共价键的断裂和重新形成。构型指分子中各原子或基团在空间的固定排列方式，构象指分子在空间所采取的特定形态。","difficulty":2,"tags":["蛋白质结构"]},{"id":7,"type":"choice","question":"以下哪种非共价相互作用发生在带电基团之间，对加入盐类敏感？","options":{"A":"氢键","B":"范德华力","C":"离子相互作用（盐键）","D":"疏水相互作用"},"answer":"C","explanation":"离子相互作用（又称离子键、盐键、盐桥）是发生在带电荷基团之间的静电相互作用。它对环境极敏感，加入盐类可减弱，加入非极性溶剂可增强。","difficulty":1,"tags":["综合"]},{"id":8,"type":"choice","question":"关于氢键的特点，以下说法错误的是？","options":{"A":"本质是静电相互作用","B":"由电负性较大的原子和氢原子形成","C":"不具有方向性和饱和性","D":"氢键形成有协同性"},"answer":"C","explanation":"氢键具有方向性和饱和性，这是其重要特征。氢键本质是静电相互作用，由电负性较大的原子和氢原子形成，其形成具有协同性（一个氢键的形成可促进其余氢键的形成）。","difficulty":2,"tags":["综合"]},{"id":9,"type":"choice","question":"非极性物质之间仅有的范德华力是？","options":{"A":"定向效应","B":"诱导效应","C":"分散效应","D":"静电效应"},"answer":"C","explanation":"广义范德华力包括三种较弱的静电相互作用：定向效应（发生在极性物质之间）、诱导效应（发生在极性物质与非极性物质之间）、分散效应（非极性物质之间仅有的一种范德华力）。","difficulty":2,"tags":["综合"]},{"id":10,"type":"choice","question":"疏水相互作用在维持生物大分子三维结构中有重要作用。它是指？","options":{"A":"水分子之间的氢键网络","B":"在介质水中的疏水分子或基团倾向于聚集在一起的现象","C":"带电基团之间的静电排斥","D":"极性基团与水分子之间的引力"},"answer":"B","explanation":"疏水相互作用指在介质水中的疏水分子或基团倾向于聚集在一起的现象，在维持蛋白质、DNA等生物大分子的三维结构方面有重要作用。","difficulty":1,"tags":["核酸化学"]},{"id":11,"type":"choice","question":"组成蛋白质的常见氨基酸有多少种？","options":{"A":"18种","B":"20种","C":"22种","D":"24种"},"answer":"B","explanation":"从蛋白质水解产物中分离出的常见氨基酸共有20种，包括19种氨基酸和1种亚氨基酸（脯氨酸）。","difficulty":1,"tags":["蛋白质结构"]},{"id":12,"type":"choice","question":"组成蛋白质的氨基酸在结构上的共同特点是（除脯氨酸外）？","options":{"A":"与羧基相邻的α-碳原子上有一个氨基","B":"与羧基相邻的β-碳原子上有一个氨基","C":"与氨基相邻的碳原子上有一个羧基","D":"均为含硫氨基酸"},"answer":"A","explanation":"除脯氨酸及其衍生物外，组成蛋白质的氨基酸在结构上的共同点是：与羧基相邻的α-碳原子（Cα）上都有一个氨基，因此称为α-氨基酸。注意：脯氨酸是α-亚氨基酸。","difficulty":1,"tags":["蛋白质结构"]},{"id":13,"type":"choice","question":"在中性pH条件下，α-氨基酸主要以什么形式存在？","options":{"A":"非离子形式","B":"阳离子形式","C":"阴离子形式","D":"兼性离子（两性离子）形式"},"answer":"D","explanation":"在中性pH条件下，α-氨基酸以兼性离子形式存在，此时α-羧基呈-COO⁻，α-氨基呈-NH₃⁺。兼性离子指在同一分子上同时带有正离子基团和负离子基团。","difficulty":1,"tags":["蛋白质结构"]},{"id":14,"type":"choice","question":"成人必需氨基酸共有几种？","options":{"A":"6种","B":"7种","C":"8种","D":"9种"},"answer":"C","explanation":"成人必需氨基酸共8种：Phe、Met、Lys、Thr、Trp、Leu、Ile、Val。巧记：笨蛋来宿舍，凉凉鞋。婴儿为9种（加His）。","difficulty":2,"tags":["蛋白质结构"]},{"id":15,"type":"choice","question":"以下哪一个是婴儿的必需氨基酸，但不是成人的必需氨基酸？","options":{"A":"精氨酸（Arg）","B":"组氨酸（His）","C":"半胱氨酸（Cys）","D":"酪氨酸（Tyr）"},"answer":"B","explanation":"婴儿必需氨基酸共9种，在成人8种基础上增加组氨酸（His），因婴儿自身合成组氨酸的能力尚未完善。","difficulty":2,"tags":["蛋白质结构","代谢总论"]},{"id":16,"type":"choice","question":"以下哪种氨基酸是唯一不含手性碳原子的氨基酸？","options":{"A":"脯氨酸（Pro）","B":"甘氨酸（Gly）","C":"半胱氨酸（Cys）","D":"丙氨酸（Ala）"},"answer":"B","explanation":"甘氨酸（Gly）的侧链R基仅是氢原子，是氨基酸中结构最简单的，也是唯一不含手性碳原子的氨基酸，因此不具有旋光性。","difficulty":1,"tags":["蛋白质结构"]},{"id":17,"type":"choice","question":"脯氨酸（Pro）在蛋白质结构中的特殊作用是什么？","options":{"A":"形成二硫键","B":"作为甲基供体","C":"降低肽链区域的柔性，易形成顺式构型肽键","D":"吸收紫外线"},"answer":"C","explanation":"脯氨酸具有特殊的环状结构的脂族侧链，其二级氨基处于刚性构象，使含有脯氨酸的多肽区域的结构柔性降低，增加顺式构型肽键的出现频率。蛋白质中X-Pro的顺式与反式比例约为1:10。","difficulty":2,"tags":["蛋白质结构","糖类与脂类"]},{"id":18,"type":"choice","question":"两个含硫的氨基酸是？","options":{"A":"半胱氨酸和丝氨酸","B":"甲硫氨酸和苏氨酸","C":"半胱氨酸和甲硫氨酸","D":"半胱氨酸和酪氨酸"},"answer":"C","explanation":"半胱氨酸（Cys）和甲硫氨酸（Met，又称蛋氨酸）是两种含硫的氨基酸。Cys侧链含巯基（-SH），Met侧链含有一个非极性的硫醚基。","difficulty":1,"tags":["蛋白质结构"]},{"id":19,"type":"choice","question":"甲硫氨酸（Met）在体内代谢中的特殊作用是？","options":{"A":"形成二硫键","B":"作为甲基供体","C":"参与糖基化","D":"作为质子缓冲剂"},"answer":"B","explanation":"甲硫氨酸（蛋氨酸）在体内代谢中是甲基的供体，这一特性在生物化学中具有重要意义。","difficulty":2,"tags":["代谢总论"]},{"id":20,"type":"choice","question":"在生理pH条件下唯一具有明显缓冲能力的氨基酸是？","options":{"A":"谷氨酸（Glu）","B":"赖氨酸（Lys）","C":"组氨酸（His）","D":"精氨酸（Arg）"},"answer":"C","explanation":"组氨酸的pKR≈6.0，是唯一一个pKR值在中性附近的氨基酸，因此在生理pH条件下唯一具有明显缓冲能力。组氨酸在酶的酸碱催化机制中起重要作用，常存在于许多酶的活性中心。","difficulty":2,"tags":["蛋白质结构","酶与催化"]},{"id":21,"type":"choice","question":"碱性最强的蛋白质氨基酸是？","options":{"A":"赖氨酸（Lys）","B":"组氨酸（His）","C":"精氨酸（Arg）","D":"谷氨酰胺（Gln）"},"answer":"C","explanation":"精氨酸（Arg）含有带正电荷的胍基，是碱性最强的氨基酸。其侧链上的胍基是已知碱性最强的有机碱。精氨酸也是含氮量最高的蛋白质氨基酸。","difficulty":2,"tags":["蛋白质结构"]},{"id":22,"type":"choice","question":"具有紫外吸收能力的氨基酸是？","options":{"A":"所有20种基本氨基酸","B":"酸性氨基酸","C":"芳香族氨基酸","D":"碱性氨基酸"},"answer":"C","explanation":"只有芳香族氨基酸（苯丙氨酸Phe、酪氨酸Tyr、色氨酸Trp）在280nm左右具有紫外吸收能力，因为它们的R基含有苯环共轭双键系统。吸收强度：Trp > Tyr > Phe。","difficulty":1,"tags":["蛋白质结构"]},{"id":23,"type":"choice","question":"酸性氨基酸（带负电荷）包括？","options":{"A":"赖氨酸和精氨酸","B":"天冬氨酸和谷氨酸","C":"丝氨酸和苏氨酸","D":"苯丙氨酸和酪氨酸"},"answer":"B","explanation":"酸性氨基酸（带负电荷氨基酸）包括天冬氨酸（Asp）和谷氨酸（Glu）。两者都含有两个羧基，在pH 7.0左右第二个羧基也完全解离，使分子带有净负电荷。记忆口诀：天谷酸。","difficulty":1,"tags":["蛋白质结构"]},{"id":24,"type":"choice","question":"碱性氨基酸（带正电荷）包括？","options":{"A":"赖氨酸、精氨酸、组氨酸","B":"天冬氨酸、谷氨酸","C":"丝氨酸、苏氨酸、酪氨酸","D":"甘氨酸、丙氨酸、缬氨酸"},"answer":"A","explanation":"碱性氨基酸（带正电荷氨基酸）包括赖氨酸（Lys）、精氨酸（Arg）和组氨酸（His）。三者侧链都含有可质子化的碱性基团。记忆口诀：赖精组（来京组）。","difficulty":1,"tags":["蛋白质结构"]},{"id":25,"type":"choice","question":"侧链含有羟基的氨基酸包括？","options":{"A":"丝氨酸、苏氨酸、酪氨酸","B":"半胱氨酸、甲硫氨酸","C":"天冬氨酸、谷氨酸","D":"赖氨酸、精氨酸、组氨酸"},"answer":"A","explanation":"侧链含羟基的氨基酸有：丝氨酸（Ser）、苏氨酸（Thr）、酪氨酸（Tyr）。丝氨酸常出现在酶的活性中心；苏氨酸具有两个手性中心；酪氨酸的羟基为酚羟基。","difficulty":2,"tags":["蛋白质结构","酶与催化"]},{"id":26,"type":"choice","question":"侧链为脂肪族（分枝链）的氨基酸是？","options":{"A":"丙氨酸、甘氨酸、丝氨酸、苏氨酸","B":"丙氨酸、异亮氨酸、亮氨酸、缬氨酸","C":"苯丙氨酸、酪氨酸、色氨酸","D":"赖氨酸、精氨酸、组氨酸"},"answer":"B","explanation":"侧链为脂肪族（分枝链）氨基酸包括：Ala、Ile、Leu、Val。这些氨基酸的侧链全部为烷基，是典型的非极性氨基酸。","difficulty":2,"tags":["蛋白质结构","糖类与脂类"]},{"id":27,"type":"choice","question":"关于半胱氨酸（Cys），以下说法错误的是？","options":{"A":"极性来自它的巯基","B":"可氧化形成二硫键","C":"谷胱甘肽（GSH）的活性基团是半胱氨酸残基中的巯基","D":"半胱氨酸不含硫"},"answer":"D","explanation":"半胱氨酸（Cys）含有巯基（-SH），是可以形成二硫键的氨基酸。其极性来自巯基。谷胱甘肽（GSH）的活性基团正是半胱氨酸残基中的巯基。选项D错误，半胱氨酸含有硫。","difficulty":1,"tags":["蛋白质结构"]},{"id":28,"type":"choice","question":"关于等电点（pI）的计算，对于中性氨基酸正确的公式是？","options":{"A":"pI = (pKa-羧基 + pKa-氨基)/2","B":"pI = (pKa-羧基 + pKa-侧链羧基)/2","C":"pI = (pKa-氨基 + pKa-侧链氨基)/2","D":"pI = (pKa-羧基 + pKa-侧链氨基)/2"},"answer":"A","explanation":"中性氨基酸pI = (pKa-羧基 + pKa-氨基)/2；酸性氨基酸pI = (pKa-羧基 + pKa-侧链羧基)/2；碱性氨基酸pI = (pKa-氨基 + pKa-侧链氨基)/2。等电点相当于该氨基酸两性离子状态两侧解离基团pKa值之和的一半。","difficulty":3,"tags":["蛋白质结构"]},{"id":29,"type":"choice","question":"在等电点时，氨基酸的特征是？","options":{"A":"净电荷为正","B":"净电荷为负","C":"净电荷为零，主要以兼性离子形式存在","D":"完全不解离"},"answer":"C","explanation":"在等电点（pI）时，氨基酸净电荷为零，主要以兼性离子形式存在，在电场中不移动。此时氨基酸的溶解度最小。","difficulty":1,"tags":["蛋白质结构"]},{"id":30,"type":"choice","question":"当溶液pH大于氨基酸的pI时，氨基酸带何种电荷？","options":{"A":"正电荷","B":"负电荷","C":"净电荷为零","D":"无法确定"},"answer":"B","explanation":"当pH > pI时，氨基酸净电荷 < 0，即带负电荷；当pH < pI时，氨基酸净电荷 > 0，即带正电荷；当pH = pI时，净电荷 = 0。","difficulty":2,"tags":["蛋白质结构"]},{"id":31,"type":"choice","question":"Edman（埃德曼）降解（PITC法）用于测定蛋白质的什么？","options":{"A":"C端氨基酸序列","B":"N端氨基酸序列","C":"二硫键位置","D":"蛋白质分子量"},"answer":"B","explanation":"Edman（埃德曼）降解法（PITC法）用于从N端开始逐个测定蛋白质的氨基酸序列。可连续测定约50-60个氨基酸。DNFB法（Sanger（桑格）法）也可测定N端氨基酸。","difficulty":2,"tags":["蛋白质结构","蛋白质技术"]},{"id":32,"type":"choice","question":"与茚三酮反应生成黄色产物的氨基酸是？","options":{"A":"所有α-氨基酸","B":"脯氨酸和羟脯氨酸","C":"芳香族氨基酸","D":"碱性氨基酸"},"answer":"B","explanation":"大多数α-氨基酸与茚三酮反应生成紫色产物（570nm检测），但脯氨酸和羟脯氨酸与茚三酮反应生成亮黄色产物（最大光吸收在440nm）。","difficulty":2,"tags":["蛋白质结构"]},{"id":33,"type":"choice","question":"关于蛋白质中氨基酸的构型，以下说法正确的是？","options":{"A":"蛋白质中所有氨基酸都是D型","B":"蛋白质中除甘氨酸外都是L型","C":"蛋白质中氨基酸的构型与其旋光方向有必然联系","D":"所有蛋白质氨基酸都具有旋光性"},"answer":"B","explanation":"蛋白质中除甘氨酸（Gly，无手性碳）外，所有氨基酸都是L型。氨基酸的构型与旋光方向没有必然联系。甘氨酸没有手性碳原子，不具有旋光性。","difficulty":2,"tags":["蛋白质结构"]},{"id":34,"type":"choice","question":"具有两个手性中心的氨基酸是？","options":{"A":"甘氨酸和丙氨酸","B":"苏氨酸和异亮氨酸","C":"半胱氨酸和甲硫氨酸","D":"赖氨酸和精氨酸"},"answer":"B","explanation":"苏氨酸（Thr）和异亮氨酸（Ile）具有两个手性中心（两个不对称碳原子），因此有四种光学异构体。这是填空题常见考点。","difficulty":3,"tags":["蛋白质结构"]},{"id":35,"type":"choice","question":"用离子交换层析分离氨基酸时，在pH3左右用阳离子交换树脂，洗脱顺序为？","options":{"A":"碱性氨基酸→中性氨基酸→酸性氨基酸","B":"酸性氨基酸→中性氨基酸→碱性氨基酸","C":"中性氨基酸→酸性氨基酸→碱性氨基酸","D":"三种同时洗脱"},"answer":"B","explanation":"pH3左右，氨基酸与阳离子交换树脂之间静电吸引力大小为：碱性氨基酸 > 中性氨基酸 > 酸性氨基酸。结合越牢固越难洗脱，因此洗脱顺序为：酸性氨基酸、中性氨基酸、碱性氨基酸。","difficulty":3,"tags":["蛋白质结构","糖类与脂类","蛋白质技术"]},{"id":36,"type":"choice","question":"关于肽键的结构特点，以下说法错误的是？","options":{"A":"肽键实际是一个共振杂化体","B":"肽键具有双键性质，不能自由旋转","C":"肽键一般为顺式构型","D":"参与肽键形成的六个原子位于同一平面，形成肽平面"},"answer":"C","explanation":"肽键一般为反式构型（反式:顺式 ≈ 1000:1），而非顺式构型。脯氨酸可增加顺式构型占比（反式:顺式 ≈ 10:1）。肽键具有双键性质、不能自由旋转、形成肽平面。","difficulty":2,"tags":["蛋白质结构"]},{"id":37,"type":"choice","question":"双缩脲反应用于检测什么？","options":{"A":"单个氨基酸","B":"肽和蛋白质（含两个及以上肽键的化合物）","C":"核酸","D":"糖类"},"answer":"B","explanation":"双缩脲反应是含有两个或两个以上肽键的化合物（即三肽及以上）与CuSO₄碱性溶液生成的紫红色或蓝紫色复合物。氨基酸和二肽不能用双缩脲试剂检测。利用此反应可在540nm处测定蛋白质含量。","difficulty":2,"tags":["蛋白质结构"]},{"id":38,"type":"choice","question":"谷胱甘肽（GSH）由哪三种氨基酸组成？","options":{"A":"谷氨酸、半胱氨酸、甘氨酸","B":"谷氨酰胺、半胱氨酸、甘氨酸","C":"谷氨酸、丝氨酸、甘氨酸","D":"天冬氨酸、半胱氨酸、甘氨酸"},"answer":"A","explanation":"谷胱甘肽（GSH）由Glu、Cys、Gly三种氨基酸组成（顺序不能乱），含有游离-SH的三肽。GSH是体内具有氧化还原作用的最小肽。","difficulty":1,"tags":["蛋白质结构"]},{"id":39,"type":"choice","question":"谷胱甘肽在体内的主要功能不包括？","options":{"A":"解毒作用","B":"参与氧化还原反应","C":"作为遗传物质","D":"保护巯基酶的活性"},"answer":"C","explanation":"谷胱甘肽（GSH）的主要功能包括：解毒作用、参与氧化还原反应、保护巯基酶的活性、维持红细胞膜结构的稳定。GSH是肽而非核酸，不能作为遗传物质。","difficulty":1,"tags":["核酸化学","生物膜与运输","酶与催化"]},{"id":40,"type":"choice","question":"凯氏定氮法测定蛋白质含量的基础是蛋白质中氮元素的平均含量为？","options":{"A":"10%","B":"16%","C":"20%","D":"25%"},"answer":"B","explanation":"蛋白质中氮元素平均含量为16%，因此蛋白质含量 = 蛋白氮 × 6.25。这是凯氏定氮法的基础。","difficulty":1,"tags":["综合"]},{"id":41,"type":"choice","question":"对于不含辅基的简单蛋白质，其氨基酸残基数可粗略估计为：相对分子质量除以多少？","options":{"A":"100","B":"110","C":"120","D":"128"},"answer":"B","explanation":"对于不含辅基的简单蛋白质，氨基酸残基的数目 ≈ 相对分子质量 ÷ 110。因为蛋白质中氨基酸残基的平均分子量约110 Da。","difficulty":2,"tags":["蛋白质结构","酶与催化"]},{"id":42,"type":"choice","question":"蛋白质分子大小的下限一般认为从什么开始？","options":{"A":"谷胱甘肽（分子量307）","B":"催产素（分子量1007）","C":"胰岛素（分子量5733）","D":"溶菌酶（分子量14300）"},"answer":"C","explanation":"蛋白质分子大小的下限一般认为从胰岛素开始，其相对分子质量为5733。胰岛素是第一个被测定一级结构的蛋白质（Sanger（桑格）, 1953）。","difficulty":3,"tags":["蛋白质技术"]},{"id":43,"type":"choice","question":"第一个测出二、三级结构的蛋白质是？","options":{"A":"胰岛素","B":"肌红蛋白","C":"血红蛋白","D":"溶菌酶"},"answer":"B","explanation":"肌红蛋白的空间结构测定由Kendrew（肯德鲁）于1959年完成，是第一个测出二、三级结构的蛋白质（诺贝尔奖）。血红蛋白是第一个测出四级结构的蛋白质（Perutz（佩鲁茨））。胰岛素是第一个测出一级结构的蛋白质（Sanger（桑格））。","difficulty":3,"tags":["蛋白质结构","蛋白质技术"]},{"id":44,"type":"choice","question":"胰岛素由几条多肽链组成？它们之间以什么键连接？","options":{"A":"一条链，无链间连接","B":"两条链，以二硫键连接","C":"三条链，以氢键连接","D":"四条链，以肽键连接"},"answer":"B","explanation":"胰岛素由A链和B链两条多肽链组成，两者之间通过二硫键共价交联。由于两条链之间以共价键相连，胰岛素不具有四级结构，不属于多聚蛋白。","difficulty":2,"tags":["蛋白质结构"]},{"id":45,"type":"choice","question":"寡肽与多肽的界限（氨基酸数目）是？","options":{"A":"10个","B":"20个","C":"50个","D":"100个"},"answer":"B","explanation":"寡肽：20个氨基酸以内；多肽：20-100个氨基酸；蛋白质：含100个以上氨基酸。部分教材将多肽和蛋白质的界限定为200个氨基酸。","difficulty":2,"tags":["蛋白质结构"]},{"id":46,"type":"choice","question":"固相肽合成的方向是？","options":{"A":"N端→C端","B":"C端→N端","C":"随机方向","D":"从中间向两端"},"answer":"B","explanation":"固相肽合成的方向是C端→N端，将C端羧基固定在不溶性树脂上，然后从C端向N端逐步添加氨基酸。这与生物体内蛋白质合成的延伸方向（N端→C端）相反。","difficulty":3,"tags":["蛋白质结构","糖类与脂类","代谢总论"]},{"id":47,"type":"choice","question":"关于酪氨酸（Tyr），以下说法错误的是？","options":{"A":"侧链为酚羟基","B":"酚基是某些酶的重要功能基","C":"酚基可与重氮化合物结合形成棕黄色化合物","D":"酪氨酸不含芳香环"},"answer":"D","explanation":"酪氨酸（Tyr）含有苯环，属于芳香族氨基酸（老色本：Phe、Tyr、Trp）。其侧链为酚羟基，酚基能与重氮化合物结合（Pauly反应），酚基可还原磷钼酸-磷钨酸生成蓝色（Folin反应）。","difficulty":2,"tags":["蛋白质结构"]},{"id":48,"type":"choice","question":"对角线电泳中，上样位置在？","options":{"A":"滤纸端点","B":"滤纸中央","C":"滤纸上端","D":"滤纸下端"},"answer":"B","explanation":"对角线电泳测定二硫键位置时，将水解后的含二硫键的混合肽段点到滤纸的中央，而不是端点。这是判断题常见考点。","difficulty":3,"tags":["蛋白质技术"]},{"id":49,"type":"choice","question":"以下哪种试剂常用于断裂二硫键（还原法）？","options":{"A":"过甲酸","B":"二硫苏糖醇（DTT）","C":"三氯乙酸","D":"六盐酸胍"},"answer":"B","explanation":"二硫苏糖醇（DTT）或β-巯基乙醇常用于还原法断裂二硫键。过甲酸用于氧化法断裂二硫键。六盐酸胍（6mol/L）或尿素（8mol/L）用于拆分多肽链间的非共价键。","difficulty":3,"tags":["糖类与脂类"]},{"id":50,"type":"choice","question":"双向电泳中，水平分离反映的是什么差异？","options":{"A":"分子量差异","B":"等电点（pI）差异","C":"溶解度差异","D":"极性差异"},"answer":"B","explanation":"双向电泳中：第一向为等电聚焦（水平方向），反映pI的差异；第二向为SDS-PAGE（垂直方向），反映分子量的差异。二者结合可以更精确地区分蛋白质。","difficulty":2,"tags":["蛋白质技术"]},{"id":51,"type":"choice","question":"关于蛋白质的四级结构，以下说法正确的是？","options":{"A":"所有蛋白质都有四级结构","B":"四级结构中亚基之间以共价键连接","C":"四级结构中亚基之间主要通过非共价力缔合","D":"胰岛素是典型的多聚蛋白"},"answer":"C","explanation":"四级结构中亚基之间主要通过非共价力（疏水作用为主，其次为氢键、盐键等）缔合，无共价连接。并非所有蛋白质都有四级结构。胰岛素两条链以二硫键共价交联，不具有四级结构。","difficulty":2,"tags":["蛋白质结构"]},{"id":52,"type":"choice","question":"分配层析中，Rf值与什么成正比？","options":{"A":"样品的极性","B":"样品与固定相的亲和力","C":"样品与流动相的亲和力","D":"样品的分子量"},"answer":"C","explanation":"分配层析中，与流动相亲和力大者，容易随流动相移动，Rf大；与固定相亲和力大者，易滞留于原地，Rf小。即Rf和极性成反比（固定相一般吸附水为极性相）。","difficulty":2,"tags":["蛋白质技术"]},{"id":53,"type":"choice","question":"氰溴化氰（CNBr）选择性切割哪种氨基酸残基的羧基端肽键？","options":{"A":"赖氨酸（Lys）","B":"精氨酸（Arg）","C":"甲硫氨酸（Met）","D":"色氨酸（Trp）"},"answer":"C","explanation":"CNBr选择性切割甲硫氨酸（Met）残基羧基端形成的肽键。胰蛋白酶专一裂解Lys和Arg的羧基参与形成的肽键。","difficulty":3,"tags":["蛋白质结构","酶与催化"]},{"id":54,"type":"choice","question":"以下哪种方法常用于蛋白质C端分析？","options":{"A":"DNFB法（Sanger（桑格）法）","B":"PITC法（Edman（埃德曼）法）","C":"羧肽酶法","D":"DNS-Cl法"},"answer":"C","explanation":"羧肽酶法、还原法、肼解法常用于C端分析。DNFB法、PITC法、DNS-Cl法常用于N端检测。","difficulty":2,"tags":["酶与催化"]},{"id":55,"type":"choice","question":"关于二硫键的测定，常使用的方法是？","options":{"A":"双向纸层析","B":"对角线电泳","C":"凝胶过滤层析","D":"亲和层析"},"answer":"B","explanation":"对角线电泳是测定二硫键位置的经典方法。其原理是将含二硫键的肽段在过甲酸氧化断裂后，使含半胱氨酸的成对肽段偏离对角线，再对这些肽段进行序列分析。","difficulty":2,"tags":["蛋白质技术"]},{"id":56,"type":"choice","question":"蛋白氮含量为0.8g，则蛋白质含量约为？","options":{"A":"0.8g","B":"5g","C":"8g","D":"12.8g"},"answer":"B","explanation":"蛋白质含量 = 蛋白氮 × 6.25 = 0.8 × 6.25 = 5g。因为蛋白质中氮元素平均含量为16%（即1/6.25）。","difficulty":1,"tags":["综合"]},{"id":57,"type":"choice","question":"关于蛋白质的二级结构，其主要作用力是？","options":{"A":"肽键","B":"氢键","C":"疏水相互作用","D":"二硫键"},"answer":"B","explanation":"蛋白质二级结构的主要作用力是氢键，形成于肽链主链上的-NH和-CO基团之间。疏水相互作用是三级结构的主要稳定力。","difficulty":1,"tags":["蛋白质结构"]},{"id":58,"type":"choice","question":"以下哪种氨基酸参与糖基化及磷酸化修饰？","options":{"A":"甘氨酸（Gly）","B":"丝氨酸（Ser）、苏氨酸（Thr）","C":"丙氨酸（Ala）","D":"亮氨酸（Leu）"},"answer":"B","explanation":"丝氨酸（Ser）和苏氨酸（Thr）的侧链羟基可以参与O-连接的糖基化及磷酸化修饰。酪氨酸（Tyr）的酚羟基也可参与磷酸化。","difficulty":2,"tags":["蛋白质结构","糖类与脂类"]},{"id":59,"type":"choice","question":"利用氨基酸电荷行为进行分离的层析方法是？","options":{"A":"纸层析","B":"离子交换层析","C":"亲和层析","D":"凝胶过滤层析"},"answer":"B","explanation":"离子交换层析是一种基于氨基酸电荷行为的层析方法。在某一特定pH下，各氨基酸的电荷量及性质不同，故可通过离子交换层析得以分离。","difficulty":1,"tags":["蛋白质结构","蛋白质技术"]},{"id":60,"type":"choice","question":"在多肽中，位于N端的哪种氨基酸容易环化形成焦谷氨酸，导致N端封闭？","options":{"A":"天冬氨酸（Asp）","B":"谷氨酸（Glu）","C":"赖氨酸（Lys）","D":"精氨酸（Arg）"},"answer":"B","explanation":"在多肽中，位于N端的Glu容易环化形成焦谷氨酸，导致N端封闭。因此在进行N端测序时需要注意这一点。","difficulty":3,"tags":["蛋白质结构","蛋白质技术"]},{"id":61,"type":"choice","question":"苯丙氨酸浓度的测定被用于什么疾病的诊断指标？","options":{"A":"糖尿病","B":"苯丙酮尿症","C":"痛风","D":"白化病"},"answer":"B","explanation":"血浆或尿中苯丙氨酸浓度的测定被用于苯丙酮尿症的诊断指标。苯丙酮尿症是一种氨基酸代谢障碍疾病。","difficulty":2,"tags":["蛋白质结构","代谢总论"]},{"id":62,"type":"choice","question":"以下哪一种不是蛋白质的二级结构类型？","options":{"A":"α-螺旋","B":"β-折叠","C":"β-转角","D":"结构域"},"answer":"D","explanation":"蛋白质二级结构的主要类型包括：α-螺旋、β-折叠、β-转角和无规卷曲。结构域（domain）是介于二级和三级结构之间的结构层次，不是二级结构类型。","difficulty":1,"tags":["蛋白质结构"]},{"id":63,"type":"choice","question":"以下哪个是典型的不常见蛋白质氨基酸且有对应的密码子？","options":{"A":"羟脯氨酸","B":"γ-羧基谷氨酸","C":"含硒半胱氨酸（Sec）","D":"羟赖氨酸"},"answer":"C","explanation":"大多数不常见蛋白质氨基酸没有对应的密码子，但含硒半胱氨酸（Sec）和吡咯赖氨酸（Pyl）是例外，它们有对应的密码子。","difficulty":3,"tags":["蛋白质结构"]},{"id":64,"type":"choice","question":"蛋白质变性时，不被破坏的结构层次是？","options":{"A":"一级结构","B":"二级结构","C":"三级结构","D":"四级结构"},"answer":"A","explanation":"蛋白质变性是指蛋白质的高级结构（二级、三级、四级结构）被破坏，而一级结构（氨基酸序列）保持不变。变性主要破坏的是非共价键，不涉及肽键的断裂。","difficulty":1,"tags":["蛋白质结构"]},{"id":65,"type":"choice","question":"关于不常见的蛋白质氨基酸，以下说法正确的是？","options":{"A":"全部有对应的密码子","B":"一般由常见的氨基酸经专一酶催化的化学修饰转化而来","C":"在核糖体上直接合成","D":"全部没有对应的密码子"},"answer":"B","explanation":"不常见的蛋白质氨基酸一般是在已合成的肽链上由常见的氨基酸经专一酶催化的化学修饰转化而来的（一般没有密码子）。例外：含硒半胱氨酸和吡咯赖氨酸有密码子。","difficulty":2,"tags":["蛋白质结构","代谢总论","酶与催化"]},{"id":66,"type":"choice","question":"蛋白质一级结构很大程度上决定了什么？","options":{"A":"蛋白质的含量","B":"蛋白质的二、三级结构和功能","C":"蛋白质的元素组成","D":"蛋白质的溶解度"},"answer":"B","explanation":"一级结构（氨基酸序列）很大程度上决定了二级结构、三级结构以及蛋白质的功能。这是蛋白质结构层次中的基本原理（Anfinsen（安芬森）原理）。","difficulty":1,"tags":["蛋白质结构"]},{"id":67,"type":"truefalse","question":"等电点不能作为蛋白质的特征常数，因为还与蛋白质的高级结构相关。","answer":true,"explanation":"等电点可以作为氨基酸的特征常数，但不能作为蛋白质的特征常数，因为蛋白质的等电点还与其高级结构相关。在等电点时蛋白质的溶解度最小，可用于等电点沉淀。","difficulty":2,"tags":["蛋白质结构"]},{"id":68,"type":"truefalse","question":"Lys和Arg。","answer":true,"explanation":"胰蛋白酶专一裂解Lys（赖氨酸）和Arg（精氨酸）的羧基参与形成的肽键。注意：其后的氨基酸残基为Pro时，专一性较差。","difficulty":2,"tags":["蛋白质结构","酶与催化"]},{"id":69,"type":"truefalse","question":"芳香族氨基酸（Phe、Tyr、Trp）。","answer":true,"explanation":"只有芳香族氨基酸（Phe、Tyr、Trp）在280nm附近具有紫外吸收能力，因为它们的R基含有苯环共轭双键系统。Trp（280nm）、Tyr（275nm）、Phe（257nm）。","difficulty":1,"tags":["蛋白质结构"]},{"id":70,"type":"truefalse","question":"酸性氨基酸。","answer":true,"explanation":"使用阴离子交换树脂时，酸性氨基酸（带负电荷最多）结合最牢固。洗脱可采用降低pH和提高盐浓度的方式。这与阳离子交换树脂相反（碱性氨基酸结合最牢固）。","difficulty":3,"tags":["蛋白质结构","糖类与脂类"]},{"id":71,"type":"truefalse","question":"组成蛋白质的20种氨基酸都是α-氨基酸。","answer":false,"explanation":"错误。组成蛋白质的20种氨基酸中，脯氨酸（Pro）是α-亚氨基酸（含亚氨基而非氨基）。其余19种为α-氨基酸。","difficulty":2,"tags":["蛋白质结构"]},{"id":72,"type":"truefalse","question":"不常见的蛋白质氨基酸都没有密码子。","answer":false,"explanation":"错误。大多数不常见的蛋白质氨基酸没有密码子，但含硒半胱氨酸（Sec）和吡咯赖氨酸（Pyl）有对应的密码子，是例外。","difficulty":2,"tags":["蛋白质结构"]},{"id":73,"type":"truefalse","question":"谷氨酰胺和天冬酰胺是由谷氨酸和天冬氨酸氨基化形成的。","answer":false,"explanation":"错误。谷氨酰胺（Gln）和天冬酰胺（Asn）是由tRNA直接携带合成的，并非由Glu和Asp合成后修饰而来。","difficulty":3,"tags":["代谢总论","核酸化学"]},{"id":74,"type":"truefalse","question":"蛋白质氨基酸与茚三酮反应均产生紫色物质。","answer":false,"explanation":"错误。大多数α-氨基酸与茚三酮反应生成紫色产物，但脯氨酸和羟脯氨酸与茚三酮反应生成亮黄色产物（440nm检测）。","difficulty":2,"tags":["蛋白质结构"]},{"id":75,"type":"truefalse","question":"所有组成蛋白质的氨基酸都具有旋光性。","answer":false,"explanation":"错误。甘氨酸（Gly）的侧链仅为氢原子，不含手性碳，因此不具有旋光性。除甘氨酸外，其余19种基本氨基酸具有旋光性。","difficulty":1,"tags":["蛋白质结构"]},{"id":76,"type":"truefalse","question":"Asn是极性氨基酸，只能位于蛋白质分子外侧。","answer":false,"explanation":"错误。Asn（天冬酰胺）侧链参与氢键合成，稳定球蛋白结构，位于蛋白质分子内部较多。不能简单地说极性氨基酸只能位于外侧。","difficulty":3,"tags":["蛋白质结构","代谢总论"]},{"id":77,"type":"truefalse","question":"谷胱甘肽（GSH）由三种氨基酸的密码子同时编码产生。","answer":false,"explanation":"错误。谷胱甘肽（GSH）是酶促合成的，不是基因编码产生的。它是Glu、Cys、Gly组成的含游离-SH的三肽。","difficulty":2,"tags":["蛋白质结构","代谢总论","酶与催化"]},{"id":78,"type":"truefalse","question":"对角线电泳测定二硫键时，上样在滤纸的端点。","answer":false,"explanation":"错误。对角线电泳中，样品点在滤纸的中央，而非端点。第一向电泳后用过甲酸氧化断裂二硫键，再进行垂直方向的第二向电泳。","difficulty":2,"tags":["蛋白质技术"]},{"id":79,"type":"truefalse","question":"胰岛素的两条链分别由不同基因编码，然后共价连接形成活性成分。","answer":false,"explanation":"错误。胰岛素是先产生一条单链多肽（前胰岛素原），然后经过加工、切割，最终生成两条链共价连接的成熟胰岛素，而不是两条链分别合成后再连接。","difficulty":2,"tags":["代谢总论"]},{"id":80,"type":"truefalse","question":"氨基酸和二肽可以用双缩脲试剂进行检测。","answer":false,"explanation":"错误。双缩脲反应是含有两个或两个以上肽键的化合物特有的反应。氨基酸和二肽不能与双缩脲试剂发生阳性反应。","difficulty":2,"tags":["蛋白质结构"]},{"id":81,"type":"truefalse","question":"构型的改变不需要共价键的断裂和重新形成。","answer":false,"explanation":"错误。构型的改变必须伴随共价键的断裂和重新形成。构象的改变不要求共价键的断裂和重新形成。注意区分构型和构象。","difficulty":2,"tags":["蛋白质结构"]},{"id":82,"type":"truefalse","question":"在生理pH条件下，组氨酸是唯一具有明显缓冲能力的氨基酸。","answer":true,"explanation":"正确。组氨酸（His）的pKR≈6.0，是唯一一个pKR值在中性附近的氨基酸，在生理pH条件下唯一具有明显缓冲能力。","difficulty":1,"tags":["蛋白质结构"]},{"id":83,"type":"truefalse","question":"胰岛素的A链和B链之间以肽键连接。","answer":false,"explanation":"错误。胰岛素的A链和B链之间以二硫键（二硫桥）共价连接，而非肽键。","difficulty":1,"tags":["蛋白质结构"]},{"id":84,"type":"truefalse","question":"蛋白质中肽键大多为顺式构型。","answer":false,"explanation":"错误。蛋白质中肽键大多为反式构型（反式:顺式 ≈ 1000:1）。脯氨酸参与形成的肽键中顺式构型比例有所增加（约10:1）。","difficulty":2,"tags":["蛋白质结构"]},{"id":85,"type":"truefalse","question":"天然氨基酸多为D型。","answer":false,"explanation":"错误。天然蛋白质中的氨基酸除甘氨酸（无手性碳）外均为L型。D型氨基酸仅在少数天然活性肽（如某些细菌和真菌产生的肽类抗生素）中存在。","difficulty":1,"tags":["蛋白质结构"]},{"id":86,"type":"truefalse","question":"氢键具有方向性和饱和性。","answer":true,"explanation":"正确。氢键本质是静电相互作用，由电负性较大的原子和氢原子形成，具有方向性和饱和性。氢键的形成还具有协同性。","difficulty":1,"tags":["综合"]},{"id":87,"type":"truefalse","question":"蛋白质的等电点可以作为蛋白质的特征常数。","answer":false,"explanation":"错误。等电点可以作为氨基酸的特征常数，但不能作为蛋白质的特征常数，因为蛋白质的等电点还与其高级结构相关。","difficulty":2,"tags":["蛋白质结构"]},{"id":88,"type":"truefalse","question":"固相肽合成的延伸方向是N端→C端。","answer":false,"explanation":"错误。固相肽合成的方向是C端→N端，即先将C端羧基固定于树脂上，再从C端向N端逐步添加氨基酸。这与生物体内蛋白质合成的方向（N端→C端）相反。","difficulty":2,"tags":["蛋白质结构","糖类与脂类","代谢总论"]}],"terms":[{"id":1,"term":"兼性离子（两性离子，Zwitterion）","definition":"指在同一分子上同时带有能释放质子的正离子基团和能接受质子的负离子基团。在中性pH条件下，α-氨基酸以兼性离子形式存在（α-羧基呈-COO⁻，α-氨基呈-NH₃⁺），本身既是酸又是碱。","chapter":"绪论+第一章"},{"id":2,"term":"构型（Configuration）","definition":"指分子中各原子或基团在空间的固定排列方式。其差异源于手性中心的存在，构型的改变往往使分子的光学活性发生变化。构型的改变必须伴随共价键的断裂和重新形成，无法通过单键的自由旋转实现。常见的有顺反异构和D-、L-构型。","chapter":"绪论"},{"id":3,"term":"构象（Conformation）","definition":"指分子在空间所采取的特定形态，用来描述有机分子动态立体化学，反映分子在某一瞬间各原子的实际相对位置。一种构象改变为另一种构象时，不要求共价键的断裂和重新形成。研究方法主要为X射线晶体学和核磁共振（NMR）波谱学。","chapter":"绪论"},{"id":4,"term":"离子相互作用（盐键/盐桥）","definition":"又称为离子键、盐键和盐桥，是发生在带电荷基团之间的一种静电相互作用。带异种电荷基团之间为引力，带同种电荷基团之间为斥力。它对环境极敏感，加入盐类可减弱，加入非极性溶剂可增强。在疏水环境中介电常数比水中低，此时异种电荷基团之间的引力相应增大。","chapter":"绪论"},{"id":5,"term":"氢键（Hydrogen Bond）","definition":"本质是静电相互作用，由电负性较大的原子和氢原子形成。具有方向性和饱和性。氢键形成有协同性，即一个氢键的形成可促进其余氢键的形成。在维持蛋白质和核酸等生物大分子的结构中起关键作用。","chapter":"绪论"},{"id":6,"term":"范德华力（van der Waals Force）","definition":"广义范德华力包括三种较弱的静电相互作用：定向效应（发生在极性物质之间）、诱导效应（发生在极性物质与非极性物质之间）、分散效应（非极性物质之间仅有的一种范德华力）。虽然单个范德华力很弱，但大量累加后对生物大分子结构有重要贡献。","chapter":"绪论"},{"id":7,"term":"疏水相互作用（Hydrophobic Interaction）","definition":"指在介质水中的疏水分子或基团倾向于聚集在一起的现象。它不是一种直接的分子间作用力，而是由水分子的有序化驱动的热力学效应。在维持蛋白质、DNA等生物大分子的三维结构方面有重要作用，是蛋白质折叠的主要驱动力。","chapter":"绪论"},{"id":8,"term":"必需氨基酸（Essential Amino Acid）","definition":"动物体内不能合成或合成量不足以满足生理需要而必须随膳食一起供给的氨基酸。成人必需氨基酸共8种：Phe、Met、Lys、Thr、Trp、Leu、Ile、Val。婴儿为9种，在成人基础上增加组氨酸（His）。巧记：笨蛋来宿舍，凉凉鞋。","chapter":"第一章"},{"id":9,"term":"等电点（pI, Isoelectric Point）","definition":"当氨基酸（或蛋白质）处于净电荷为0的特征pH时，称为等电点（pI）。pH>pI时带负电荷，pH<pI时带正电荷。在等电点时，主要以兼性离子形式存在，净电荷为零，溶解度最小。pI的计算相当于该氨基酸两性离子状态两侧解离基团pKa值之和的一半。","chapter":"第一章"},{"id":10,"term":"茚三酮反应（Ninhydrin Reaction）","definition":"茚三酮在弱酸条件下与α-氨基酸共热，引起α-氨基氧化脱氨，产生的氨、还原茚三酮与另一个茚三酮分子反应生成紫色产物，可用分光光度计在570nm波长处检测。脯氨酸和羟脯氨酸生成亮黄色产物（440nm检测）。可用于检测和定量氨基酸。","chapter":"第一章"},{"id":11,"term":"Edman降解法（PITC法）","definition":"利用异硫氰酸苯酯（PITC）特异性地从蛋白质N端逐个切下氨基酸并进行鉴定的方法。在弱碱性条件下PITC与N端氨基酸连接形成PTC-蛋白复合物，酸处理后N端氨基酸被切割并转化为稳定的PTH衍生物，通过HPLC鉴定。可连续测定约50-60个氨基酸的N端序列。","chapter":"第一章"},{"id":12,"term":"肽键（Peptide Bond）","definition":"由一个氨基酸的α-NH₂和另一氨基酸的α-COOH脱去一分子H₂O缩合而成的酰胺键（-CO-NH-）。实际是一个共振杂化体，具有双键性质，不能自由旋转。参与肽键形成的六个原子位于同一平面，形成肽平面（酰胺平面）。肽链中肽键一般为反式构型。","chapter":"第一章"},{"id":13,"term":"双缩脲反应（Biuret Reaction）","definition":"含有两个或两个以上肽键的化合物（即三肽及以上）与CuSO₄碱性溶液反应生成紫红色或蓝紫色复合物的反应。是肽和蛋白质所特有的颜色反应，氨基酸和二肽不发生此反应。可利用此反应在540nm处测定蛋白质含量，精确到mg级。","chapter":"第一章"},{"id":14,"term":"谷胱甘肽（GSH, Glutathione）","definition":"由Glu、Cys、Gly三种氨基酸组成的含游离-SH的三肽。主要功能：解毒作用（与毒物或药物结合）、参与氧化还原反应（作为重要还原剂）、保护巯基酶的活性（维持-SH还原态）、维持红细胞膜结构的稳定。GSH是酶促合成的，不是基因编码的。还原型:氧化型约500:1。","chapter":"第一章"},{"id":15,"term":"蛋白质一级结构（Primary Structure）","definition":"通常指蛋白质肽链的氨基酸残基的序列（从N端到C端），还包括二硫键的数量和位置。对结合蛋白质还应包括共价连接的辅基部分。一级结构是无空间结构概念的一维结构，很大程度上决定了二级结构、三级结构和蛋白质的功能。","chapter":"第一章"},{"id":16,"term":"赛聚蛋白质/多聚蛋白质（Oligomeric Protein）","definition":"由两条或多条肽链（亚基）构成的蛋白质。每条多肽链称为亚基，亚基之间通过非共价力（主要为疏水作用）缔合，无共价连接。如血红蛋白和己糖激酶。注意：如果多条肽链之间以共价键相连（如胰岛素），则不是多聚蛋白，不具有四级结构。","chapter":"第一章"},{"id":17,"term":"对角线电泳（Diagonal Electrophoresis）","definition":"测定二硫键位置的经典方法。将水解后的含二硫键的混合肽段点到滤纸中央，在pH6.5条件下进行第一向电泳，然后用过甲酸蒸气使二硫键氧化断裂，再将滤纸旋转90°进行相同条件的第二向电泳。含磺基丙氨酸的成对肽段偏离对角线，可取下进行序列分析以确定二硫键位置。","chapter":"第一章"},{"id":18,"term":"离子交换层析（Ion Exchange Chromatography）","definition":"一种基于氨基酸电荷行为的层析方法。利用离子交换树脂上的活性基团与溶液中的离子进行交换反应，由于各种离子交换能力不同，与树脂结合的牢固程度不同，在洗脱过程中以不同的速度移动，从而达到分离目的。阳离子交换树脂在pH3左右上样，洗脱顺序为酸性→中性→碱性氨基酸。","chapter":"第一章"},{"id":19,"term":"同源蛋白质（Homologous Protein）","definition":"不同物种或同一物种中功能相同或相似的蛋白质，具有相似的氨基酸序列或具有明显同源性序列。一个蛋白质家族的成员一般有25%或更多的序列相同。其中对生物功能必需的氨基酸残基在进化过程中保持高度保守，而不必需的残基可被替换。如泛素。","chapter":"第一章"},{"id":20,"term":"固相肽合成（Solid Phase Peptide Synthesis）","definition":"人工合成多肽的方法，将目标多肽的C端羧基以共价键与不溶性高分子树脂相连，然后以该氨基酸的氨基为起点，用DCC作偶联剂逐步添加氨基酸形成肽链。合成方向为C端→N端（与生物合成方向相反）。不断重复过程即可得到目标多肽产物。","chapter":"第一章"}],"stats":{"total":88,"choice":66,"truefalse":22,"easy":31,"mid":43,"hard":14,"terms":20}},"cellbiology":{"key":"cellbiology","name":"细胞生物学","code":"851","chapterLabel":"1 绪论","questions":[{"id":1,"type":"choice","question":"第一个用显微镜观察到植物细胞构造，并用拉丁文“cellar”命名的科学家是？","options":{"A":"列文虎克（Leeuwenhoek（列文虎克））","B":"罗伯特·胡克（Robert Hooke（罗伯特·胡克））","C":"施莱登（Schleiden（施莱登））","D":"施旺（Schwann（施旺））"},"answer":"B","explanation":"胡克用自制显微镜（放大40-140倍）观察软木薄片，首次描述植物细胞构造，用拉丁文“cellar”命名，后英文为“cell”，中文译为“细胞”。1665年在《显微图谱》中发表。注意：胡克观察到的是死亡组织中的细胞壁，并非活细胞。","difficulty":1,"tags":["显微镜技术"]},{"id":2,"type":"choice","question":"被誉为“真正的活细胞发现者”的科学家是？","options":{"A":"罗伯特·胡克（Robert Hooke（罗伯特·胡克））","B":"列文虎克（Leeuwenhoek（列文虎克））","C":"施莱登（Schleiden（施莱登））","D":"施旺（Schwann（施旺））"},"answer":"B","explanation":"列文虎克是真正的活细胞发现者，他观察了活体动物及细菌。1674年观察鱼的红细胞时描述了细胞核结构，并将显微镜用于科学研究试验，拓展了显微镜在科学研究中的应用范围。","difficulty":1,"tags":["显微镜技术","细胞核"]},{"id":3,"type":"choice","question":"胡克在《显微图谱》中发表细胞的首次描述是在哪一年？","options":{"A":"1665年","B":"1674年","C":"1838年","D":"1839年"},"answer":"A","explanation":"1665年，胡克在《显微图谱》（Micrographia）中发表了对细胞的首次描述。1674年是列文虎克观察鱼红细胞并描述细胞核的时间。1838-1839年是细胞学说提出的年份。","difficulty":1,"tags":["细胞学说","细胞核"]},{"id":4,"type":"choice","question":"胡克观察到的细胞实际是死亡组织中的细胞壁，这一事实说明了什么？","options":{"A":"胡克的显微镜放大倍数不够","B":"胡克发现的是死细胞而非活细胞，真正活细胞发现者是列文虎克","C":"细胞壁是细胞最重要的结构","D":"软木薄片不含有活细胞"},"answer":"B","explanation":"胡克观察软木薄片时看到的是死亡组织中残留的细胞壁（木栓化），并非活细胞。列文虎克才是真正活细胞的发现者，他观察了活体动物及细菌。","difficulty":2,"tags":["综合"]},{"id":5,"type":"choice","question":"细胞学说的核心内容不包括以下哪一项？","options":{"A":"一切植物、动物都是由细胞组成的，细胞是生物体的基本结构单位","B":"细胞只能来自细胞","C":"有机体的一切病理表现都是基于细胞的损伤","D":"原生动物也是由细胞组成的，它是仅含一个细胞的动物，能独立进行全部生命活动"},"answer":"D","explanation":"D选项是后人对细胞学说的补充，并非施莱登和施旺提出细胞学说时的原始观点。原始内容包括A、B、C三项。后人的补充还包括：生物个体发育的过程是细胞不断繁殖和分化的连续过程。","difficulty":2,"tags":["细胞学说"]},{"id":6,"type":"choice","question":"施莱登发表的与细胞学说相关的著作名称是？","options":{"A":"《显微图谱》","B":"《关于动植物结构和生长的一致性的显微研究》","C":"《植物发生论》","D":"《物种起源》"},"answer":"C","explanation":"施莱登发表的著作名为《植物发生论》。施旺发表的著作名为《关于动植物的结构和生长的一致性的显微研究》。注意区分两位科学家的著作名称，选择题常考。","difficulty":1,"tags":["细胞学说"]},{"id":7,"type":"choice","question":"施旺发表的与细胞学说相关的著作名称是？","options":{"A":"《显微图谱》","B":"《关于动植物结构和生长的一致性的显微研究》","C":"《植物发生论》","D":"《自然的构建》"},"answer":"B","explanation":"施旺发表的是《关于动植物的结构和生长的一致性的显微研究》。施莱登发表的是《植物发生论》。注意区分。","difficulty":1,"tags":["细胞学说"]},{"id":8,"type":"choice","question":"下列哪项关于细胞学说的描述是正确的？","options":{"A":"细胞学说是在17世纪提出的","B":"细胞学说认为病毒也是由细胞组成的","C":"细胞学说为生物学的统一性提供了清晰的细胞学基础","D":"细胞学说的建立标志着实验细胞学时期的开始"},"answer":"C","explanation":"细胞学说为生物学的统一性提供了清晰的细胞学基础，推进了人类对自然界的认识，促进了自然科学和哲学的进步。细胞学说是在19世纪（1838-1839年）提出的，不是17世纪。","difficulty":2,"tags":["细胞学说"]},{"id":9,"type":"choice","question":"下列哪一项属于细胞学说提出时的原始观点？","options":{"A":"原生动物也是由细胞组成的","B":"生物个体发育的过程是细胞不断繁殖和分化的连续过程","C":"细胞只能来自细胞","D":"原生动物能独立进行全部生命活动"},"answer":"C","explanation":"“细胞只能来自细胞”是细胞学说体系的组成部分（由Virchow（菲尔绍）补充）。A、B、D选项属于后人对细胞学说的补充，并非施莱登和施旺提出时的原始观点。","difficulty":2,"tags":["细胞学说"]},{"id":10,"type":"choice","question":"在经典细胞学时期，下列哪项不是该时期的主要进展？","options":{"A":"命名动植物细胞内胶状物质为“原生质”","B":"明确细胞分裂基本类型（有丝分裂和减数分裂）","C":"提出DNA双螺旋结构模型","D":"陆续发现中心体、线粒体、高尔基体"},"answer":"C","explanation":"经典细胞学时期的主要进展包括：提出原生质理论、命名有丝分裂并发现减数分裂、陆续发现中心体/线粒体/高尔基体等细胞器。DNA双螺旋结构是1953年才提出的，属于分子生物学时期。","difficulty":2,"tags":["线粒体叶绿体","细胞分裂","内膜系统"]},{"id":11,"type":"choice","question":"细胞生物学作为一门学科正式出现是在哪个时期？","options":{"A":"17世纪","B":"19世纪中叶","C":"20世纪50~60年代","D":"21世纪初"},"answer":"C","explanation":"20世纪50~60年代，生物化学与细胞学相互渗透结合，细胞结构与功能结合的研究水平大幅提升，细胞生物学学科正式出现。60~70年代，分子生物学概念与技术被引入细胞学。","difficulty":2,"tags":["综合"]},{"id":12,"type":"choice","question":"实验细胞学时期的研究内容包括哪三个主要分支？","options":{"A":"细胞化学、细胞遗传学、细胞生理学","B":"细胞生物学、分子生物学、生物化学","C":"细胞形态学、细胞分类学、细胞生态学","D":"细胞免疫学、细胞药理学、细胞毒理学"},"answer":"A","explanation":"实验细胞学时期的研究内容包括：①细胞化学（核心技术为细胞组分分离、放射自显影、超微量分析）；②细胞遗传学（核心为染色体与基因学说）；③细胞生理学（研究细胞对环境反应、生长繁殖、营养摄取、兴奋性等）。","difficulty":2,"tags":["细胞核"]},{"id":13,"type":"choice","question":"细胞遗传学研究的核心是？","options":{"A":"核酸与蛋白质代谢","B":"染色体与基因学说","C":"生物电与能量传递","D":"细胞组分分离与放射自显影"},"answer":"B","explanation":"细胞遗传学从细胞学角度（侧重染色体结构功能及与其他细胞器的关系）研究遗传现象，阐明遗传变异机制，核心为染色体与基因学说。A属于细胞化学，C属于细胞生理学。","difficulty":2,"tags":["细胞核"]},{"id":14,"type":"choice","question":"以下哪项不是所有细胞共有的基本共性？","options":{"A":"相似的化学组成——以碳为骨架，利用约20种元素","B":"脂-蛋白体系的细胞质膜","C":"以DNA为遗传信息载体，遗传密码通用","D":"具有以膜为基础的各种细胞器"},"answer":"D","explanation":"具有以膜为基础的细胞器是真核细胞的特征，原核细胞仅有核糖体这一无膜细胞器。细胞的四个基本共性为：相似的化学组成、脂-蛋白体系的质膜、相同的遗传装置、一分为二的分裂方式。","difficulty":2,"tags":["细胞膜","细胞分裂"]},{"id":15,"type":"choice","question":"下列生物类群的细胞体积从大到小排列，正确的是？","options":{"A":"原生动物 > 动植物 > 细菌 > 支原体 > 病毒","B":"动植物 > 原生动物 > 细菌 > 支原体 > 病毒","C":"原生动物 > 细菌 > 动植物 > 支原体 > 病毒","D":"动植物 > 细菌 > 原生动物 > 病毒 > 支原体"},"answer":"A","explanation":"细胞体积大小顺序为：原生动物（多为单细胞）> 动植物 > 细菌 > 支原体 > 病毒。","difficulty":1,"tags":["综合"]},{"id":16,"type":"choice","question":"对于高等动植物，器官大小与细胞的关系是？","options":{"A":"器官大小与细胞体积成正比","B":"器官大小与细胞数量成正比，与细胞大小无关","C":"器官大小与细胞体积和数量均成正比","D":"器官大小与细胞核体积成正比"},"answer":"B","explanation":"对于高等动植物，不论物种差异多大，同一器官与组织的细胞大小总是在一个恒定的范围之内。器官大小与细胞数量成正比，与细胞大小无关。","difficulty":2,"tags":["综合"]},{"id":17,"type":"choice","question":"维持细胞基本生存的最小体积极限直径约为？","options":{"A":"20~200 nm","B":"140~200 nm","C":"0.5~5.0 μm","D":"0.2~10 μm"},"answer":"B","explanation":"维持基本生存的细胞体积最小极限直径约为140~200 nm，支原体已接近这个极限，因此被称为最小最简单的细胞。","difficulty":2,"tags":["综合"]},{"id":18,"type":"choice","question":"IGF/PI3K/Akt/mTOR信号通路中，最终推动细胞体积增大的机制是？","options":{"A":"IGF与受体结合","B":"PI3K活化","C":"Akt激活","D":"mTOR促进蛋白质合成增加与脂类合成"},"answer":"D","explanation":"该通路：IGF与受体结合→激活PI3K→将PI(4,5)P₂转化为PI(3,4,5)P₃→激活Akt→激活mTOR→促进蛋白质合成增加与脂类合成，最终推动细胞体积增大。","difficulty":3,"tags":["综合"]},{"id":19,"type":"choice","question":"下列哪项不能体现“细胞是生命活动的基本单位”？","options":{"A":"一切有机体都由细胞构成（除病毒以外）","B":"有机体一切代谢活动最终要由各种细胞来完成","C":"病毒可以脱离细胞独立完成代谢活动","D":"细胞是繁殖的基本单位，是遗传的桥梁"},"answer":"C","explanation":"病毒不具备独立的代谢能力，必须依赖宿主细胞才能进行增殖。细胞作为生命活动的基本单位体现在五个方面。","difficulty":2,"tags":["综合"]},{"id":20,"type":"choice","question":"生物界依据细胞结构差异，将细胞分为哪两大类？","options":{"A":"植物细胞和动物细胞","B":"原核细胞和真核细胞","C":"单细胞和多细胞","D":"自养细胞和异养细胞"},"answer":"B","explanation":"依据细胞结构差异，将细胞分为原核细胞和真核细胞两大类。后来在原核细胞中又发现了古核细胞。","difficulty":1,"tags":["综合"]},{"id":21,"type":"choice","question":"根据三域分类系统，生物分为哪三个域？","options":{"A":"原核生物、原生生物、真核生物","B":"原核生物、古核生物、真核生物","C":"细菌域、古菌域、真核域","D":"动物界、植物界、微生物界"},"answer":"C","explanation":"三域分别是细菌域、古菌域和真核域。六界为：原核生物界、古核生物界、原生生物界、真菌界、植物界和动物界。","difficulty":2,"tags":["综合"]},{"id":22,"type":"choice","question":"支原体（mycoplasma）被称为最小最简单的细胞，其主要原因是？","options":{"A":"支原体没有细胞质膜","B":"支原体没有细胞壁，直径接近维持生存的最小极限（140~200nm）","C":"支原体没有DNA","D":"支原体不能进行代谢活动"},"answer":"B","explanation":"支原体具有细胞质膜但没有细胞壁，环状双螺旋DNA均匀散布在细胞内，以二分裂方式繁殖，直径接近维持基本生存的最小极限（140~200 nm）。","difficulty":1,"tags":["细胞膜","细胞分裂"]},{"id":23,"type":"choice","question":"支原体不具有的结构是？","options":{"A":"细胞质膜","B":"环状双螺旋DNA","C":"细胞壁","D":"核区"},"answer":"C","explanation":"支原体具有细胞质膜，但没有细胞壁。这是支原体区别于大多数细菌的重要特征之一。","difficulty":2,"tags":["细胞膜"]},{"id":24,"type":"choice","question":"革兰氏阳性菌（G⁺）与革兰氏阴性菌（G⁻）细胞壁的主要区别是？","options":{"A":"G⁺肽聚糖含量低，G⁻肽聚糖含量高","B":"G⁺肽聚糖含量高，G⁻肽聚糖含量低","C":"G⁺和G⁻肽聚糖含量相同","D":"G⁺无肽聚糖，G⁻有肽聚糖"},"answer":"B","explanation":"革兰氏阳性菌（G⁺）细胞壁肽聚糖含量高，革兰氏阴性菌（G⁻）细胞壁肽聚糖含量低，肽聚糖是细菌细胞壁的共同成分。","difficulty":2,"tags":["综合"]},{"id":25,"type":"choice","question":"下列哪种生物属于真核生物？","options":{"A":"支原体","B":"蓝藻（蓝细菌）","C":"酿酒酵母","D":"大肠杆菌"},"answer":"C","explanation":"酿酒酵母属于真核生物（真菌界）。支原体、蓝藻、大肠杆菌均属于原核生物。注意辨析：念珠藻、衣藻、杆菌属于原核生物，酿酒酵母属于真核生物。","difficulty":1,"tags":["模式生物"]},{"id":26,"type":"choice","question":"蓝藻（蓝细菌）的营养方式和关键特征是？","options":{"A":"异养型，能分解有机物获取能量","B":"自养型，能进行产氧型光合作用","C":"化能自养型，利用化学能固定CO₂","D":"寄生型，依赖宿主获取营养"},"answer":"B","explanation":"蓝藻又称蓝细菌，是自养型原核生物，能进行产氧型光合作用。含有光合色素，通过藻胆体将光能传递给叶绿素进行光合作用。","difficulty":2,"tags":["线粒体叶绿体"]},{"id":27,"type":"choice","question":"蓝藻细胞内不含下列哪种结构？","options":{"A":"藻胆体——传递光能给叶绿素","B":"羧酶体——含固CO₂酶","C":"线粒体——进行有氧呼吸","D":"气泡——调节水中位置"},"answer":"C","explanation":"蓝藻是原核生物，没有以膜为基础的细胞器（包括线粒体）。其内含物包括藻胆体、脂滴、羧酶体、气泡等。","difficulty":2,"tags":["线粒体叶绿体"]},{"id":28,"type":"choice","question":"关于古核生物（古细菌）的描述，正确的是？","options":{"A":"古核生物的翻译起始氨基酸为fMet（甲酰甲硫氨酸）","B":"古核生物的细胞壁与细菌完全相同，含肽聚糖","C":"古核生物的RNA聚合酶复杂，翻译起始氨基酸为Met","D":"古核生物的核糖体不受任何抗生素影响"},"answer":"C","explanation":"古核生物的RNA聚合酶复杂，翻译起始氨基酸为Met（甲硫氨酸），而细菌的为fMet（甲酰甲硫氨酸）。古核生物的细胞壁不含肽聚糖，受青霉素抑制。核糖体为70S但对毛霉素不敏感。","difficulty":3,"tags":["综合"]},{"id":29,"type":"choice","question":"真核细胞内部的三大结构系统不包括？","options":{"A":"以脂质和蛋白质为基础的生物膜结构系统","B":"以核酸与蛋白质为主要成分的遗传信息传递与表达系统","C":"由特异蛋白质分子装配构成的细胞骨架系统","D":"以细胞壁为基础的保护支撑系统"},"answer":"D","explanation":"真核细胞内部的三大基本结构系统是：生物膜结构系统、遗传信息传递与表达系统、细胞骨架系统。这些系统的结构尺度多在5~20 nm范围内。","difficulty":2,"tags":["细胞骨架"]},{"id":30,"type":"choice","question":"真核细胞生物膜系统的厚度约为？","options":{"A":"2~5 nm","B":"8~10 nm","C":"20~50 nm","D":"100~200 nm"},"answer":"B","explanation":"真核细胞的生物膜系统以脂质+蛋白质为基础，厚度约8~10 nm。包含质膜、双层核膜及各种细胞器膜。","difficulty":1,"tags":["细胞膜","细胞核"]},{"id":31,"type":"choice","question":"遗传信息传递与表达系统中，核仁的主要功能是？","options":{"A":"储存遗传信息","B":"转录rRNA、装配核糖体亚基","C":"介导mRNA翻译肽链","D":"调控基因表达"},"answer":"B","explanation":"核仁的主要功能是转录rRNA、装配核糖体亚基。核小体/染色质负责储存遗传信息和调控基因转录。核糖体介导mRNA翻译肽链。","difficulty":2,"tags":["细胞核"]},{"id":32,"type":"choice","question":"生物大分子组装的三种方式不包括？","options":{"A":"自我装配——装配信息存在于参与装配的分子本身（如中间纤维）","B":"协助装配——需要其他组分介入但不参与最终产物（如核糖体组装需200多种蛋白）","C":"直接装配——亚基直接装配到预先形成的基础结构上（如细胞质膜扩展）","D":"共价交联装配——通过共价键交联形成稳定结构"},"answer":"D","explanation":"生物大分子组装的三种方式为：①自我装配（如中间纤维）；②协助装配（如核糖体组装需要200多种蛋白质介入）；③直接装配（如细胞质膜扩展）。没有“共价交联装配”这一分类。","difficulty":2,"tags":["细胞骨架","细胞膜"]},{"id":33,"type":"choice","question":"下列哪种结构是植物细胞特有而动物细胞不具有的？","options":{"A":"线粒体","B":"高尔基体","C":"以纤维素为核心的细胞壁","D":"溶酶体"},"answer":"C","explanation":"植物细胞特有的结构包括：细胞壁（以纤维素为核心）、液泡、叶绿体。中心体是动物及低等植物特有的。","difficulty":2,"tags":["线粒体叶绿体"]},{"id":34,"type":"choice","question":"中心体由什么组成？其主要功能是？","options":{"A":"由单层膜包裹，与蛋白质合成有关","B":"由两个互相垂直的中心粒及周围物质组成，与细胞有丝分裂有关","C":"由微管蛋白组成，与细胞运动有关","D":"由DNA和蛋白质组成，与遗传有关"},"answer":"B","explanation":"中心体由两个互相垂直的中心粒及周围物质组成，无膜结构。与细胞有丝分裂有关，能发出星射线形成纺锤体。中心体是动物及低等植物特有的细胞器。","difficulty":2,"tags":["细胞分裂"]},{"id":35,"type":"choice","question":"关于植物中央大液泡的功能，以下描述错误的是？","options":{"A":"扩大细胞体积，提升光合面积","B":"维持细胞膨压，保障组织刚性","C":"是细胞呼吸作用的主要场所","D":"储存蛋白质，调节细胞内环境"},"answer":"C","explanation":"细胞呼吸作用的主要场所是线粒体，不是液泡。中央大液泡的功能包括：扩大细胞体积、维持细胞膨压、储存蛋白质、调节细胞内环境等。","difficulty":2,"tags":["线粒体叶绿体"]},{"id":36,"type":"choice","question":"原核细胞与真核细胞核糖体的比较，正确的是？","options":{"A":"原核细胞核糖体为80S（60S+40S），真核细胞为70S（50S+30S）","B":"原核细胞核糖体为70S（50S+30S），真核细胞为80S（60S+40S）","C":"两者均为70S","D":"两者均为80S"},"answer":"B","explanation":"原核细胞核糖体为70S（50S+30S），对毛霉素敏感；真核细胞核糖体为80S（60S+40S），对毛霉素不敏感。古核细胞核糖体为70S但对毛霉素不敏感。","difficulty":2,"tags":["细胞核"]},{"id":37,"type":"choice","question":"真核细胞相比于原核细胞的重要优势不包括？","options":{"A":"细胞膜系统的演化——分化出功能专一的细胞器","B":"细胞骨架系统——保证了细胞内部空间的合理布局","C":"遗传信息量与遗传装置的扩增和复杂化","D":"细胞增殖速度更快"},"answer":"D","explanation":"真核细胞的三大优势为：细胞膜系统的演化、细胞骨架系统、遗传装置的扩增及复杂化。原核细胞增殖速度反而更快。","difficulty":3,"tags":["细胞骨架","细胞膜"]},{"id":38,"type":"choice","question":"关于病毒和细胞的比较，下列哪项是错误的？","options":{"A":"病毒没有核糖体等任何细胞结构","B":"病毒的遗传物质只能是DNA","C":"病毒以复制和装配的方式进行增殖","D":"病毒必须利用宿主细胞的结构、原料、能量与酶系统进行繁殖"},"answer":"B","explanation":"病毒的遗传物质可以是DNA或RNA，而细胞始终以DNA作为遗传物质。有些病毒为DNA病毒（如T4噬菌体），有些为RNA病毒（如SARS、新冠、流感、HIV等）。","difficulty":1,"tags":["综合"]},{"id":39,"type":"choice","question":"病毒增殖的方式是？","options":{"A":"以二分裂方式进行增殖","B":"以复制和装配的方式进行增殖","C":"以有丝分裂方式进行增殖","D":"以出芽方式进行增殖"},"answer":"B","explanation":"病毒以复制和装配的方式进行增殖。在宿主细胞内先合成大量病毒核酸和病毒蛋白，然后装配成新的子代病毒。这与细胞的分裂方式完全不同。","difficulty":2,"tags":["细胞分裂"]},{"id":40,"type":"choice","question":"绝大多数病毒的大小范围是？","options":{"A":"20~200 nm","B":"0.2~10 μm","C":"0.5~5.0 μm","D":"10~100 μm"},"answer":"A","explanation":"绝大多数病毒的大小只有20~200 nm，必须在电子显微镜下才能看到。原核生物直径一般为0.2~10 μm。","difficulty":1,"tags":["显微镜技术"]},{"id":41,"type":"choice","question":"关于病毒与细胞在起源与演化中的关系，得到更多实验结果支持的观点是？","options":{"A":"生物大分子→病毒→细胞（病毒先于细胞出现）","B":"生物大分子分别独立演化出病毒和细胞","C":"生物大分子→细胞→病毒（病毒由细胞演化而来）","D":"病毒和细胞同时从无机物中诞生"},"answer":"C","explanation":"第三种观点得到更多证据支持：原核细胞质粒与λ噬菌体行为类似；反转录转座子与反转录病毒相似；腺病毒核酸与细胞DNA相近；细胞原癌基因与病毒癌基因序列相似。","difficulty":3,"tags":["综合"]},{"id":42,"type":"choice","question":"以下哪种病毒是双链DNA病毒？","options":{"A":"SARS病毒","B":"HIV病毒","C":"T4噬菌体","D":"流感病毒"},"answer":"C","explanation":"T4噬菌体是双链DNA病毒。SARS和新冠是正链RNA病毒；HIV是两条单链正链RNA病毒；流感是单股负链RNA病毒。","difficulty":1,"tags":["综合"]},{"id":43,"type":"choice","question":"新冠病毒（SARS-CoV-2）的核酸类型是？","options":{"A":"双链DNA","B":"正链RNA","C":"负链RNA","D":"双链RNA"},"answer":"B","explanation":"新冠病毒（SARS-CoV-2）是正链RNA病毒，与SARS病毒属于同一类。","difficulty":1,"tags":["综合"]},{"id":44,"type":"choice","question":"HIV病毒的核酸特征是？","options":{"A":"双链DNA","B":"单股负链RNA","C":"两条单链正链RNA（二倍体正链RNA）","D":"双链RNA"},"answer":"C","explanation":"HIV病毒是两条单链正链RNA病毒（即二倍体正链RNA），这也是反转录病毒的典型特征。","difficulty":2,"tags":["综合"]},{"id":45,"type":"choice","question":"下列哪种病毒是单股负链RNA病毒？","options":{"A":"SARS病毒","B":"流感病毒","C":"烟草花叶病毒","D":"T4噬菌体"},"answer":"B","explanation":"流感病毒是单股负链RNA病毒。常见总结：SARS→正链RNA；新冠→正链RNA；流感→单股负链RNA；HIV→两条正链RNA；T4→双链DNA。","difficulty":1,"tags":["综合"]},{"id":46,"type":"choice","question":"原核细胞中唯一具有的细胞器是？","options":{"A":"线粒体","B":"高尔基体","C":"核糖体","D":"内质网"},"answer":"C","explanation":"原核细胞细胞内没有分化出以膜为基础的细胞器与细胞核膜，唯一的细胞器是核糖体，且为无膜细胞器。","difficulty":1,"tags":["细胞核"]},{"id":47,"type":"choice","question":"关于细胞核大小的描述，正确的是？","options":{"A":"各种正常细胞核的大小差异很大","B":"细胞核体积通常占细胞总体积的50%以上","C":"各种正常细胞核的大小通常差距不大，约占细胞总体积的10%","D":"恶性肿瘤细胞的细胞核通常比正常细胞小"},"answer":"C","explanation":"各种正常细胞的体积有大小不同，但细胞核的大小通常差距不大，约占10%。某些特殊细胞的细胞核可以很大，如恶性肿瘤细胞。","difficulty":2,"tags":["细胞核"]},{"id":48,"type":"choice","question":"真核细胞与原核细胞在遗传信息方面的比较，错误的是？","options":{"A":"真核基因组远大于原核","B":"真核DNA为线状多倍性，原核为环状单倍性","C":"真核基因数量从原核的几千个增至2万~3万个","D":"真核细胞与原核细胞的遗传密码不同"},"answer":"D","explanation":"真核与与原核的遗传密码是通用的（细胞基本共性之一）。显著差异包括：基因组大小、DNA形态、基因数量、内含子与可变剪接、基因表达调控的精细复杂度等。","difficulty":3,"tags":["综合"]},{"id":49,"type":"choice","question":"关于原核细胞特征的描述，错误的是？","options":{"A":"原核细胞大约出现在30~35亿年前，代表一种原始的细胞类型","B":"原核生物一般体积小，直径0.2~10 μm","C":"原核细胞的遗传物质由一个裸露的环状DNA分子构成","D":"原核细胞具有典型的细胞核结构"},"answer":"D","explanation":"原核细胞无典型的细胞核，这是原核与真核最显著差异之一。遗传信息量小，遗传物质仅由一个裸露的环状DNA分子构成，无核膜包裹。","difficulty":2,"tags":["细胞核"]},{"id":50,"type":"choice","question":"细胞生物学的研究水平包括？","options":{"A":"个体水平、组织水平、器官水平","B":"显微水平、亚显微水平与分子水平","C":"宏观水平与微观水平","D":"群体水平与个体水平"},"answer":"B","explanation":"细胞生物学从显微水平、亚显微水平与分子水平三个层次来研究细胞。研究内容包括细胞结构与功能、增殖分化衰老死亡、信号转导、基因表达调控、起源与进化等。","difficulty":1,"tags":["综合"]},{"id":51,"type":"choice","question":"细胞生物学作为一门学科，其核心思维和研究出发点是什么？","options":{"A":"从分子水平研究DNA的结构与功能","B":"从细胞作为生命活动基本单位的思维出发，研究细胞基本生命活动规律","C":"从个体水平研究生物体的发育与演化","D":"从群体水平研究生态系统的结构与功能"},"answer":"B","explanation":"细胞生物学侧重从细胞作为生命活动的基本单位的思维为出发点，研究和揭示细胞基本生命活动规律的科学。","difficulty":1,"tags":["综合"]},{"id":52,"type":"choice","question":"细胞生物学学科发展的关键转折点是？","options":{"A":"17世纪显微镜的发明","B":"19世纪细胞学说的提出","C":"20世纪50~60年代生物化学与细胞学相互渗透结合，分子生物学技术被引入","D":"21世纪基因组测序的完成"},"answer":"C","explanation":"20世纪50~60年代，生物化学与细胞学相互渗透结合，细胞生物学正式出现。60~70年代分子生物学技术被引入，学科聚焦“细胞的分子生物学”。","difficulty":2,"tags":["综合"]},{"id":53,"type":"choice","question":"从经典细胞学到实验细胞学的转变，最主要的标志是什么？","options":{"A":"细胞学说的提出","B":"显微镜放大倍数的提升","C":"人们从好奇性和描述性观察进入主动性科学实验时期","D":"DNA双螺旋结构的发现"},"answer":"C","explanation":"最关键的转变是人们从好奇性或消遣性地观察进入了主动地科学实验时期。","difficulty":2,"tags":["综合"]},{"id":54,"type":"choice","question":"细胞生物学研究内容中，下列哪项属于现代细胞生物学的核心研究领域？","options":{"A":"仅研究细胞形态结构","B":"仅研究细胞分裂过程","C":"细胞结构功能、增殖分化衰老死亡、信号转导、基因表达调控、起源与进化等","D":"仅研究细胞膜的结构"},"answer":"C","explanation":"细胞生物学研究内容包括：细胞结构与功能、增殖、分化、衰老、死亡、信号转导、基因表达调控、起源与进化等重大生命过程。","difficulty":1,"tags":["综合"]},{"id":55,"type":"choice","question":"下列哪项细胞生物学重大发现曾获得诺贝尔生理学或医学奖？","options":{"A":"胡克发现细胞","B":"施莱登和施旺提出细胞学说","C":"细胞周期调控机制的发现（Hartwell（哈特韦尔）、Hunt（亨特）、Nurse（纳斯），2001年）","D":"Virchow（菲尔绍）提出“细胞只能来自细胞”"},"answer":"C","explanation":"细胞周期调控机制的发现获得2001年诺贝尔奖。细胞生物学领域的诺贝尔奖还包括：细胞凋亡（2002）、囊泡运输（2013）、自噬（2016）等。","difficulty":2,"tags":["细胞分裂","物质运输","内膜系统"]},{"id":56,"type":"choice","question":"2016年诺贝尔生理学或医学奖授予大隅良典，表彰他在哪方面的贡献？","options":{"A":"细胞周期的调控机制","B":"细胞凋亡的遗传调控","C":"细胞自噬（autophagy）机制的发现","D":"囊泡运输的分子机制"},"answer":"C","explanation":"2016年诺贝尔奖授予大隅良典，表彰他在细胞自噬机制方面的发现。自噬是细胞降解和回收自身组分的核心过程。","difficulty":2,"tags":["综合"]},{"id":57,"type":"choice","question":"2013年诺贝尔生理学或医学奖授予Rothman（罗斯曼）、Schekman（谢克曼）和Südhof，表彰他们在哪方面的贡献？","options":{"A":"细胞周期调控","B":"细胞凋亡研究","C":"囊泡运输（vesicle trafficking）调控机制","D":"DNA修复机制"},"answer":"C","explanation":"2013年诺贝尔奖授予Rothman（罗斯曼）、Schekman（谢克曼）和Südhof，表彰他们在细胞囊泡运输调控机制方面的发现。","difficulty":2,"tags":["物质运输","内膜系统"]},{"id":58,"type":"choice","question":"2002年诺贝尔生理学或医学奖授予Brenner（布伦纳）、Horvitz（霍维茨）和Sulston（苏尔斯顿），表彰他们在哪方面的贡献？","options":{"A":"细胞周期的发现","B":"细胞凋亡（程序性细胞死亡）的遗传调控","C":"端粒和端粒酶的发现","D":"细胞信号转导机制"},"answer":"B","explanation":"2002年诺贝尔奖授予Brenner（布伦纳）、Horvitz（霍维茨）和Sulston（苏尔斯顿），表彰他们在线虫中发现细胞凋亡的遗传调控机制。","difficulty":2,"tags":["模式生物"]},{"id":59,"type":"choice","question":"当前细胞生物学研究的重点与前沿领域不包括？","options":{"A":"单细胞组学与空间转录组学","B":"细胞重编程与再生医学","C":"CRISPR基因编辑技术的应用与改进","D":"用光学显微镜观察细胞的基本形态"},"answer":"D","explanation":"光学显微镜观察是经典细胞学时期的主要手段。当前前沿包括：单细胞组学、细胞重编程、CRISPR基因编辑、类器官、细胞微环境与免疫治疗等。","difficulty":1,"tags":["显微镜技术"]},{"id":60,"type":"choice","question":"分子生物学技术对细胞生物学发展的最大贡献是？","options":{"A":"提高了显微镜的分辨率","B":"使得从分子水平探索细胞基本生命活动规律成为可能","C":"发现了新的细胞类型","D":"简化了细胞培养流程"},"answer":"B","explanation":"分子生物学技术被引入后，使研究者能够从分子水平探索细胞基本生命活动规律，学科聚焦“细胞的分子生物学”。","difficulty":2,"tags":["综合"]},{"id":61,"type":"choice","question":"细胞学说对于现代医学（特别是病理学）的奠基性意义体现在？","options":{"A":"Virchow（菲尔绍）提出“有机体的一切病理表现都是基于细胞的损伤”","B":"细胞学说推动了显微镜的商业化生产","C":"细胞学说发现了所有致病微生物","D":"细胞学说直接导致了抗生素的发现"},"answer":"A","explanation":"Virchow（菲尔绍）将细胞学说应用于病理学，提出“有机体的一切病理表现都是基于细胞的损伤”，为现代病理学奠定了细胞学基础。","difficulty":2,"tags":["细胞学说"]},{"id":62,"type":"choice","question":"原核生物与真核生物在自然界中长期共存，形成了复杂的相互关系。下列描述错误的是？","options":{"A":"有些原核生物是真核生物的病原体","B":"人体肠道中存在总数达10万亿的微生物菌群","C":"原核生物和真核生物在地球上已共存了20多亿年","D":"原核生物与真核生物之间没有相互依存关系"},"answer":"D","explanation":"原核与真核之间存在复杂的相互关系：有些原核生物是病原体，有些相互依存。例如人体肠道中存在由1000多种微生物组成的菌群，总数达10万亿。","difficulty":2,"tags":["综合"]},{"id":63,"type":"choice","question":"真核细胞与原核细胞在遗传信息表达方面最显著的区别是？","options":{"A":"真核细胞有内含子和可变剪接机制，原核细胞一般没有","B":"真核细胞的遗传密码与原核不同","C":"真核细胞不使用核糖体翻译蛋白质","D":"原核细胞的基因数量比真核细胞多"},"answer":"A","explanation":"真核细胞有内含子、可变剪接机制，少量基因可编码多种蛋白质，基因表达调控更精细复杂。而原核细胞一般无内含子。真核与原核的遗传密码是通用的。","difficulty":3,"tags":["综合"]},{"id":64,"type":"choice","question":"病毒识别并进入特定宿主细胞的机制是？","options":{"A":"病毒随机进入任何细胞","B":"病毒通过其表面蛋白质识别细胞表面特异性受体","C":"病毒通过细胞壁的被动扩散进入","D":"病毒不需要识别，直接穿透细胞膜"},"answer":"B","explanation":"不同的病毒可通过其表面的蛋白质识别细胞表面特异的受体（蛋白质或糖蛋白），因而只能感染特定的细胞类型。","difficulty":2,"tags":["综合"]},{"id":65,"type":"choice","question":"关于病毒在宿主细胞内的增殖过程，正确的顺序是？","options":{"A":"装配→识别→进入→释放","B":"识别→进入→复制与装配→释放","C":"进入→识别→释放→装配","D":"复制→识别→装配→进入"},"answer":"B","explanation":"病毒增殖过程：①识别（病毒蛋白识别宿主受体）；②进入（胞饮、膜融合等方式）；③复制与装配（利用宿主代谢以病毒核酸为模板复制转录翻译并装配）；④释放。","difficulty":2,"tags":["综合"]},{"id":66,"type":"choice","question":"关于病毒与细胞的区别，以下哪项描述是正确的？","options":{"A":"病毒和细胞都具有核糖体","B":"病毒和细胞都以DNA为唯一的遗传物质","C":"病毒不具备独立的代谢能力，必须依赖宿主细胞","D":"病毒和细胞都以二分裂方式增殖"},"answer":"C","explanation":"病毒不具备独立的代谢能力，必须利用宿主细胞的结构、原料、能量与酶系统进行繁殖。病毒无核糖体；遗传物质可以是DNA或RNA；以复制和装配方式增殖。","difficulty":1,"tags":["综合"]},{"id":67,"type":"truefalse","question":"罗伯特·胡克是第一个观察到活细胞的科学家。","answer":false,"explanation":"胡克观察到的是软木薄片中死亡组织残留的细胞壁，并非活细胞。真正的活细胞发现者是列文虎克，他观察了活体动物及细菌。","difficulty":1,"tags":["综合"]},{"id":68,"type":"truefalse","question":"列文虎克在1674年观察鱼的红细胞时，描述了细胞核的结构。","answer":true,"explanation":"1674年，列文虎克观察鱼的红细胞时描述了细胞核结构。这是细胞核的早期描述之一，拓展了显微镜在科学研究中的应用范围。","difficulty":1,"tags":["显微镜技术","细胞核"]},{"id":69,"type":"truefalse","question":"细胞学说是在17世纪由施莱登和施旺共同提出的。","answer":false,"explanation":"细胞学说是在19世纪（1838-1839年）提出的。施莱登于1838年发表《植物发生论》，施旺于1839年发表《关于动植物的结构和生长的一致性的显微研究》。","difficulty":1,"tags":["细胞学说"]},{"id":70,"type":"truefalse","question":"Virchow（菲尔绍）提出了“细胞只能来自细胞”的观点，属于细胞学说的核心内容。","answer":true,"explanation":"Virchow（菲尔绍）提出的“细胞只能来自细胞”是细胞学说的重要组成部分。他还将细胞学说应用于病理学，提出有机体的一切病理表现都是基于细胞的损伤。","difficulty":2,"tags":["细胞学说"]},{"id":71,"type":"truefalse","question":"原生动物也是由细胞组成的，这一观点是施莱登和施旺提出细胞学说时的原始内容。","answer":false,"explanation":"原生动物由细胞组成、生物个体发育是细胞繁殖分化的连续过程——这些是后人对细胞学说的补充，并非原始内容。","difficulty":2,"tags":["细胞学说"]},{"id":72,"type":"truefalse","question":"细胞生物学作为一门独立学科正式出现于20世纪50~60年代。","answer":true,"explanation":"20世纪50~60年代，生物化学与细胞学相互渗透结合，细胞生物学学科正式出现。60~70年代分子生物学技术被引入，学科聚焦到“细胞的分子生物学”。","difficulty":1,"tags":["综合"]},{"id":73,"type":"truefalse","question":"所有细胞都具有以膜为基础的各种细胞器。","answer":false,"explanation":"原核细胞（如细菌、支原体）没有以膜为基础的细胞器，唯一的细胞器是核糖体（无膜细胞器）。具有以膜为基础的细胞器是真核细胞的特征。","difficulty":2,"tags":["综合"]},{"id":74,"type":"truefalse","question":"细胞的遗传密码在绝大多数生物中是通用的，表明所有细胞起源于共同祖先。","answer":true,"explanation":"大多数细胞的遗传密码通用，这是细胞的基本共性之一。细胞以双链DNA为遗传信息载体，RNA指导蛋白质合成，合成场所为核糖体。","difficulty":2,"tags":["物质运输"]},{"id":75,"type":"truefalse","question":"支原体（mycoplasma）是最小最简单的真核细胞。","answer":false,"explanation":"支原体是最小最简单的细胞，但它属于原核细胞而非真核细胞。它具有细胞质膜但没有细胞壁，直径接近维持生存的最小极限（140~200 nm）。","difficulty":1,"tags":["细胞膜"]},{"id":76,"type":"truefalse","question":"蓝藻（蓝细菌）是自养型原核生物，能进行产氧型光合作用。","answer":true,"explanation":"蓝藻又称蓝细菌，是自养型原核生物，能进行产氧型光合作用。含有光合色素（叶绿素），通过藻胆体将光能传递给叶绿素进行光合作用。","difficulty":1,"tags":["线粒体叶绿体"]},{"id":77,"type":"truefalse","question":"古核生物（古细菌）的翻译起始氨基酸与细菌相同，均为甲酰甲硫氨酸（fMet）。","answer":false,"explanation":"古核生物的翻译起始氨基酸为Met（甲硫氨酸），而细菌的翻译起始氨基酸为fMet（甲酰甲硫氨酸）。这是两者的重要区别之一。","difficulty":3,"tags":["综合"]},{"id":78,"type":"truefalse","question":"真核细胞的生物膜系统厚度约为8~10 nm。","answer":true,"explanation":"真核细胞的生物膜系统以脂质+蛋白质为基础，厚度约8~10 nm。包含质膜、双层核膜、细胞器膜（线粒体、叶绿体、内质网、高尔基体、溶酶体等）。","difficulty":1,"tags":["细胞膜","线粒体叶绿体","内膜系统","细胞核"]},{"id":79,"type":"truefalse","question":"中心体是植物细胞特有的细胞器。","answer":false,"explanation":"中心体是动物及低等植物特有的细胞器，由两个互相垂直的中心粒及周围物质组成，与细胞有丝分裂有关（发出星射线形成纺锤体）。植物细胞特有的包括细胞壁、液泡、叶绿体。","difficulty":2,"tags":["线粒体叶绿体","细胞分裂"]},{"id":80,"type":"truefalse","question":"植物细胞壁的核心成分是肽聚糖。","answer":false,"explanation":"植物细胞壁以纤维素为核心成分，还含有果胶、半纤维素、木质素等。肽聚糖是细菌细胞壁的共同成分。","difficulty":2,"tags":["综合"]},{"id":81,"type":"truefalse","question":"原核细胞的核糖体为70S，真核细胞的核糖体为80S。","answer":true,"explanation":"原核细胞核糖体为70S（包括50S与30S的大小亚基），真核细胞核糖体为80S（包括60S与40S的大小亚基）。这是两者的重要区别之一。","difficulty":2,"tags":["细胞核"]},{"id":82,"type":"truefalse","question":"真核细胞的DNA为环状单倍性，原核细胞的DNA为线状多倍性。","answer":false,"explanation":"恰恰相反：原核细胞的DNA为环状单倍性（一个裸露的环状DNA分子），真核细胞的DNA为线状多倍性。真核基因组远大于原核。","difficulty":2,"tags":["综合"]},{"id":83,"type":"truefalse","question":"病毒的遗传物质只能是DNA，不能是RNA。","answer":false,"explanation":"病毒的遗传物质可以是DNA或RNA。有些病毒为DNA病毒（如T4噬菌体），有些为RNA病毒（如SARS、新冠、流感、HIV等）。而细胞始终以DNA作为遗传物质。","difficulty":1,"tags":["综合"]},{"id":84,"type":"truefalse","question":"病毒以二分裂的方式进行增殖。","answer":false,"explanation":"病毒以复制和装配的方式进行增殖：在宿主细胞内先合成大量病毒核酸和病毒蛋白，然后装配成新的子代病毒。二分裂是原核细胞的主要增殖方式。","difficulty":1,"tags":["细胞分裂"]},{"id":85,"type":"truefalse","question":"病毒不具备独立的代谢能力，必须利用宿主细胞的结构、原料、能量与酶系统进行繁殖。","answer":true,"explanation":"病毒是一类不“完全”的生命体，本身不表现任何生命特征，必须利用宿主细胞的全套代谢机构进行繁殖。这也是病毒与细胞最本质的区别之一。","difficulty":1,"tags":["综合"]},{"id":86,"type":"truefalse","question":"HIV病毒是双链DNA病毒。","answer":false,"explanation":"HIV病毒是两条单链正链RNA病毒（即二倍体正链RNA），属于反转录病毒。T4噬菌体才是双链DNA病毒。","difficulty":2,"tags":["综合"]},{"id":87,"type":"truefalse","question":"新冠病毒（SARS-CoV-2）是正链RNA病毒。","answer":true,"explanation":"新冠病毒（SARS-CoV-2）是正链RNA病毒，与SARS病毒属于同一类。流感病毒是单股负链RNA病毒。","difficulty":1,"tags":["综合"]},{"id":88,"type":"truefalse","question":"细胞学说为生物学的统一性提供了清晰的细胞学基础，推进了人类对自然界的认识。","answer":true,"explanation":"细胞学说揭示了有机体结构的统一性，为生物学的统一性提供了细胞学基础，促进了自然科学和哲学的进步。","difficulty":1,"tags":["细胞学说"]}],"terms":[{"id":1,"term":"细胞（Cell）","definition":"细胞是生命活动的基本单位。一切有机体都由细胞构成（除病毒外），细胞是代谢与功能的基本单位，是有机体生长发育的基础，是繁殖的基本单位和遗传的桥梁，也是生命起源的标志和生物演化的起点。细胞由脂-蛋白体系的质膜包围，内含遗传物质（DNA）和核糖体，通过一分为二的方式分裂增殖。","chapter":"绪论"},{"id":2,"term":"细胞学说（Cell Theory）","definition":"1838-1839年由施莱登和施旺提出，核心内容包括：①一切植物、动物都是由细胞组成的，细胞是生物体的基本结构单位；②细胞只能来自细胞（Virchow补充）；③有机体的一切病理表现都是基于细胞的损伤。细胞学说为生物学的统一性提供了细胞学基础，推进了人类对自然界的认识。","chapter":"绪论"},{"id":3,"term":"原生质（Protoplasm）","definition":"动植物细胞内胶状物质的统称。原生质理论认为原生质是有机体的基本单位，各类有机体中相似。原生质体（Protoplast）指有生命活性的原生质，即去壁后的植物细胞或动物细胞。原生质的命名和相关理论是经典细胞学时期的主要进展之一。","chapter":"绪论"},{"id":4,"term":"细胞生物学（Cell Biology）","definition":"应用现代技术成就及分子生物学的概念与方法，侧重以细胞作为生命活动基本单位的思维为出发点，研究和揭示细胞基本生命活动规律的科学。研究水平包括显微、亚显微与分子水平。研究内容涵盖细胞结构与功能、增殖、分化、衰老、死亡、信号转导、基因表达调控、起源与进化等。","chapter":"绪论"},{"id":5,"term":"原核细胞（Prokaryotic Cell）","definition":"没有典型的细胞核、遗传信息量小的细胞类型。遗传物质仅由一个裸露的环状DNA分子构成，细胞内没有分化出以膜为基础的细胞器与细胞核膜，唯一的细胞器是核糖体（70S）。大约出现在30~35亿年前，代表一种原始的细胞类型。常见的有支原体、细菌、蓝藻等。","chapter":"绪论"},{"id":6,"term":"真核细胞（Eukaryotic Cell）","definition":"具有典型细胞核和以膜为基础的各种细胞器的细胞类型。内部有三大基本结构系统：①以脂质和蛋白质为基础的生物膜结构系统；②以核酸与蛋白质为主要成分的遗传信息传递与表达系统；③由特异蛋白质分子装配构成的细胞骨架系统。核糖体为80S，DNA为线状多倍性。","chapter":"绪论"},{"id":7,"term":"古核细胞/古细菌（Archaea）","definition":"曾归为原核生物，但遗传信息表达系统更接近真核细胞的特殊生物类群。RNA聚合酶复杂，翻译起始氨基酸为Met（细菌为fMet）。细胞壁不含肽聚糖，核糖体为70S但对毛霉素不敏感，不受细菌核糖体类抗生素抑制。极端耐热菌的细胞膜为四乙醚单层膜。深海热泉的嗜热菌可能代表原始生命形式。","chapter":"绪论"},{"id":8,"term":"支原体（Mycoplasma）","definition":"最小最简单的细胞，也是最简单的原核细胞。具有细胞质膜但没有细胞壁，环状双螺旋DNA较均匀地散布在细胞内，无细菌那样的核区。以二分裂方式繁殖，直径接近维持基本生存的最小极限（140~200 nm）。","chapter":"绪论"},{"id":9,"term":"蓝藻/蓝细菌（Cyanobacteria）","definition":"自养型原核生物，能进行产氧型光合作用。含有光合色素（叶绿素），通过藻胆体将光能传递给叶绿素。内含物包括藻胆体、脂滴、羧酶体（含固CO₂酶）、气泡（调节水中位置）。分布广、耐贫瘠，颜色不局限于蓝绿色。细胞中部横隔分裂，子细胞共胶质鞘形成多细胞群体。","chapter":"绪论"},{"id":10,"term":"病毒（Virus）","definition":"迄今发现的最小、最简单的有机体（非细胞形式）。本质是一种生物大分子复合体，无核糖体等任何细胞结构。遗传物质可以是DNA或RNA。以复制和装配的方式在宿主细胞内增殖，必须利用宿主细胞的结构、原料、能量与酶系统。大小约20~200 nm，须在电子显微镜下才能看清。","chapter":"绪论"},{"id":11,"term":"三域分类系统（Three-Domain System）","definition":"将生物分为细菌域、古菌域和真核域的分类体系。对应六界分类：原核生物界（细菌域）、古核生物界（古菌域）、原生生物界+真菌界+植物界+动物界（真核域）。所有生物起源于共同祖先，最终演化出3种基本细胞类型和六个界。","chapter":"绪论"},{"id":12,"term":"细胞质膜（Plasma Membrane）","definition":"细胞表面由磷脂双分子层和蛋白质构成的脂-蛋白体系薄膜。它使细胞与外界分隔，维持稳定内环境，还能进行物质交换和信号传递。是细胞的基本共性之一，所有细胞都具有细胞质膜。在真核细胞中，是生物膜系统的重要组成部分，厚度约8~10 nm。","chapter":"绪论"},{"id":13,"term":"生物膜结构系统","definition":"真核细胞三大结构系统之一，以脂质和蛋白质为基础，厚度约8~10 nm。包含质膜、双层核膜和各种细胞器膜（线粒体、叶绿体、内质网、高尔基体、溶酶体等）。功能包括：选择性物质运输与信号转导（质膜）、分隔核质与调控基因表达（核膜）、支撑各细胞器功能、为生化反应提供酶附着位点。","chapter":"绪论"},{"id":14,"term":"遗传信息传递与表达系统","definition":"真核细胞三大结构系统之一，由DNA、RNA和蛋白质组成。结构上包括：核小体/染色质（DNA+组蛋白，直径10nm）、核仁（转录rRNA，装配核糖体亚基）、核糖体（介导mRNA翻译肽链）。功能为储存和传递遗传信息、调控基因转录与表达。","chapter":"绪论"},{"id":15,"term":"细胞骨架系统（Cytoskeleton）","definition":"真核细胞三大结构系统之一，由特异蛋白质分子装配构成。包括胞质骨架（微丝、微管、中间纤维）和核骨架（核纤层、核基质）。功能：提供物质运输通道（微管）、支撑细胞形态（微丝）、参与基因表达与染色质构建和排列（核骨架）。是保证细胞内部空间合理布局的关键系统。","chapter":"绪论"},{"id":16,"term":"二分裂（Binary Fission）","definition":"细胞一分为二的增殖方式，是细胞的四个基本共性之一。分裂时核内遗传物质均匀分配到子细胞，保障了生命繁殖的连续性，反映出细胞演化上的同源性。原核细胞和单细胞真核生物均以此方式增殖，多细胞生物则通过有丝分裂等更复杂的机制。","chapter":"绪论"},{"id":17,"term":"有丝分裂（Mitosis）","definition":"真核细胞分裂的主要方式之一，核心为染色体的形成与平均分配。经典细胞学时期将其命名，并先后在动植物细胞中发现。真核细胞发展出复杂的有丝分裂器（纺锤体等）和精细的细胞周期调控体系，而原核细胞无有丝分裂器和明确的细胞周期。","chapter":"绪论"},{"id":18,"term":"细胞器（Organelle）","definition":"细胞内具有一定形态结构和特定功能的亚细胞结构。原核细胞仅有核糖体一种无膜细胞器。真核细胞具有丰富的膜性细胞器（如内质网、高尔基体、线粒体、溶酶体、叶绿体等）和非膜性细胞器（如中心体、核糖体）。经典细胞学时期陆续发现了中心体、线粒体和高尔基体。","chapter":"绪论"},{"id":19,"term":"革兰氏染色（Gram Stain）","definition":"区分细菌的重要染色方法。根据细胞壁肽聚糖含量的差异，将细菌分为革兰氏阳性菌（G⁺，肽聚糖含量高）和革兰氏阴性菌（G⁻，肽聚糖含量低）。肽聚糖是细菌细胞壁的共同成分，而古核生物的细胞壁不含肽聚糖。","chapter":"绪论"},{"id":20,"term":"细胞自噬（Autophagy）","definition":"细胞内降解和回收自身组分（如受损细胞器、错误折叠蛋白质等）的核心过程。2016年大隅良典因发现细胞自噬机制获得诺贝尔生理学或医学奖。自噬对细胞应对饥饿、清除损伤组分、维持细胞内稳态具有重要意义，是当前细胞生物学研究的前沿领域之一。","chapter":"绪论"}],"stats":{"total":88,"choice":66,"truefalse":22,"easy":33,"mid":48,"hard":7,"terms":20}},"biochem_ch3":{"key":"biochem_ch3","name":"生物化学","code":"338","chapterLabel":"3 pr的结构","questions":[{"id":1,"topic":"蛋白质三维结构概述","type":"choice","question":"蛋白质三维结构取决于什么？","options":{"A":"氨基酸序列","B":"肽键的数量","C":"分子伴侣的协助","D":"溶液pH值"},"answer":"A","explanation":"蛋白质的三维结构取决于其氨基酸序列（一级结构决定高级结构）。分子伴侣协助折叠但不决定结构，pH影响但不决定。","difficulty":1,"tags":["三维结构","一级结构"]},{"id":2,"topic":"蛋白质三维结构概述","type":"choice","question":"稳定蛋白质天然构象的主要作用力是？","options":{"A":"共价键","B":"疏水相互作用","C":"肽键","D":"糖苷键"},"answer":"B","explanation":"疏水相互作用是稳定蛋白质构象的优势作用力。虽然非共价键不如共价键强，但数量巨大。氢键引领折叠过程。","difficulty":1,"tags":["疏水相互作用","非共价力"]},{"id":3,"topic":"蛋白质三维结构概述","type":"choice","question":"以下哪种作用力不属于稳定蛋白质天然构象的非共价相互作用？","options":{"A":"氢键","B":"离子相互作用","C":"二硫键","D":"范德华力"},"answer":"C","explanation":"二硫键是共价键，不属于非共价相互作用。氢键、离子相互作用、范德华力和疏水相互作用均为非共价力。","difficulty":2,"tags":["二硫键","非共价力"]},{"id":4,"topic":"蛋白质三维结构概述","type":"choice","question":"蛋白质三维结构的定义是什么？","options":{"A":"蛋白质中所有肽键的空间排列","B":"蛋白质中所有原子的空间排列","C":"蛋白质中所有氨基酸的序列","D":"蛋白质中所有亚基的组合"},"answer":"B","explanation":"三维结构（构象）指一个蛋白质中或任一部分中的原子空间排列。肽键排列是二级结构，氨基酸序列是一级结构。","difficulty":1,"tags":["三维结构","构象"]},{"id":5,"topic":"蛋白质三维结构概述","type":"choice","question":"关于肽平面的描述，正确的是？","options":{"A":"肽平面中所有原子均可自由旋转","B":"肽键具有部分双键性质，6个原子共平面","C":"肽平面由5个原子组成","D":"肽平面不涉及Cα原子"},"answer":"B","explanation":"肽键具有部分双键性质，参与肽键形成的6个原子C、H、O、N、Cα、Cα形成肽基（酰胺平面），处于同一平面不能自由转动。","difficulty":2,"tags":["肽平面","酰胺平面"]},{"id":6,"topic":"蛋白质三维结构概述","type":"choice","question":"决定多肽链构象的二面角（构象角）主要由哪两个角度决定？","options":{"A":"α和β","B":"Φ和Ψ","C":"ω和θ","D":"Φ和ω"},"answer":"B","explanation":"多肽链构象由3个二面角决定：Φ（绕N-Cα键旋转）、Ψ（绕Cα-C键旋转）和ω。其中主要由Φ和Ψ决定。","difficulty":2,"tags":["二面角","构象角"]},{"id":7,"topic":"蛋白质三维结构概述","type":"choice","question":"蛋白质晶体结构数据库（PDB）主要用于？","options":{"A":"分析蛋白质氨基酸序列","B":"储存蛋白质空间结构数据","C":"模拟蛋白质折叠过程","D":"计算蛋白质分子量"},"answer":"B","explanation":"PDB（Protein Data Bank）是公认的储存蛋白质空间结构的数据库。","difficulty":1,"tags":["PDB","结构数据库"]},{"id":8,"topic":"蛋白质三维结构概述","type":"choice","question":"蛋白质最稳定的构象是？","options":{"A":"共价键数目最大的构象","B":"弱相互作用数目最大的构象","C":"氢键数目最少的构象","D":"二硫键数目最大的构象"},"answer":"B","explanation":"虽然非共价键弱，但数量巨大，蛋白质最稳定的构象往往是弱相互作用数目最大的时候。","difficulty":2,"tags":["弱相互作用","稳定构象"]},{"id":9,"topic":"蛋白质三维结构概述","type":"truefalse","question":"蛋白质的三维结构取决于其氨基酸序列。","answer":true,"explanation":"一级结构（氨基酸序列）对三级结构起决定作用。这是蛋白质化学的核心原理之一。","difficulty":1,"tags":["一级结构","三维结构"]},{"id":10,"topic":"蛋白质三维结构概述","type":"truefalse","question":"稳定蛋白质天然构象的作用力中，氢键是最主要的。","answer":false,"explanation":"疏水相互作用是占优势的作用力，氢键起引领折叠的作用，但不是最主要的稳定力。","difficulty":2,"tags":["疏水相互作用","氢键"]},{"id":11,"topic":"蛋白质三维结构概述","type":"truefalse","question":"蛋白质的功能取决于其三维结构。","answer":true,"explanation":"蛋白质的功能与其三维构象密切相关，变性导致构象改变也会使功能丧失。","difficulty":1,"tags":["结构","功能"]},{"id":12,"topic":"蛋白质三维结构测定","type":"choice","question":"可用于测定蛋白质晶体三维结构、达到原子分辨率的方法是？","options":{"A":"核磁共振（NMR）","B":"X射线衍射法","C":"圆二色性（CD）","D":"紫外差光谱"},"answer":"B","explanation":"X射线衍射法依据晶体中原子重复的周期性结构分析晶体蛋白，可达到原子分辨率，但仅适用于晶体状态蛋白。NMR也可原子水平分析但用于溶液状态。","difficulty":1,"tags":["X射线衍射","晶体结构"]},{"id":13,"topic":"蛋白质三维结构测定","type":"choice","question":"常用于估算蛋白质中α-螺旋、β-折叠含量的方法是？","options":{"A":"拉曼光谱","B":"荧光偏振","C":"圆二色性（CD）","D":"X射线衍射"},"answer":"C","explanation":"圆二色性（CD）直接反映蛋白质二级结构改变，可估算α-螺旋、β-折叠和无规卷曲的含量。","difficulty":2,"tags":["圆二色性","二级结构"]},{"id":14,"topic":"蛋白质三维结构测定","type":"choice","question":"核磁共振（NMR）测定蛋白质结构的优势是什么？","options":{"A":"仅用于晶体状态蛋白","B":"可研究溶液状态下的蛋白结构","C":"只能测定一级结构","D":"分辨率低于X射线衍射一个数量级"},"answer":"B","explanation":"NMR可在原子水平揭示溶液状态下的蛋白质三维结构，提供大量结构动态信息。X射线衍射仅适用于晶体。","difficulty":2,"tags":["NMR","溶液结构"]},{"id":15,"topic":"蛋白质三维结构测定","type":"choice","question":"紫外差光谱用于测定蛋白质的什么特性？","options":{"A":"全部氨基酸的含量","B":"含芳香族共轭环系统的氨基酸微环境","C":"蛋白质的分子量","D":"蛋白质的氨基酸序列"},"answer":"B","explanation":"紫外差光谱测定含芳香族、杂环族且在近紫外光区有光吸收能力的共轭环系统（如Trp、Tyr、Phe）。","difficulty":2,"tags":["紫外差光谱","芳香族氨基酸"]},{"id":16,"topic":"蛋白质三维结构测定","type":"choice","question":"荧光和荧光偏振主要用于研究什么？","options":{"A":"蛋白质二级结构含量","B":"Trp和Tyr的微环境及蛋白构象变化","C":"蛋白质氨基酸序列","D":"蛋白质晶体结构"},"answer":"B","explanation":"荧光和荧光偏振用于测定Trp、Tyr的微环境以及蛋白质分子构象的变化。","difficulty":3,"tags":["荧光","Trp","Tyr"]},{"id":17,"topic":"蛋白质三维结构测定","type":"truefalse","question":"X射线衍射法可用于测定溶液状态下的蛋白质三维结构。","answer":false,"explanation":"X射线衍射法仅适用于晶体状态蛋白，不能用于溶液状态。溶液状态下用NMR。","difficulty":1,"tags":["X射线衍射","晶体"]},{"id":18,"topic":"蛋白质三维结构测定","type":"truefalse","question":"圆二色性（CD）可用于直接反映蛋白质二级结构的改变。","answer":true,"explanation":"圆二色性直接反映蛋白质二级结构改变，用于估算α-螺旋、β-折叠和无规卷曲的含量。","difficulty":1,"tags":["圆二色性","二级结构"]},{"id":19,"topic":"蛋白质二级结构","type":"choice","question":"蛋白质中最常见、含量最丰富的二级结构元件是？","options":{"A":"β-折叠","B":"β-转角","C":"α-螺旋","D":"无规卷曲"},"answer":"C","explanation":"α-螺旋是蛋白质中最常见、最典型和含量最丰富的二级结构元件。蛋白质中约1/4氨基酸残基以α-螺旋形式存在。","difficulty":1,"tags":["α-螺旋","二级结构"]},{"id":20,"topic":"蛋白质二级结构","type":"choice","question":"一个α-螺旋螺圈包含多少个氨基酸残基？","options":{"A":"3.0","B":"3.6","C":"4.0","D":"2.5"},"answer":"B","explanation":"α-螺旋一个螺圈包含3.6个氨基酸残基，沿螺旋轴上升0.54nm。注意并非所有α-螺旋都是3.6，也有3α螺旋等。","difficulty":2,"tags":["α-螺旋","螺圈"]},{"id":21,"top
